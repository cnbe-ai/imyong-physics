<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>임용 물리 기출 개요</title>
<style>
:root{--bg:#f4f5fa;--panel:#fff;--ink:#1b1f2a;--muted:#5b6475;--faint:#8a93a6;--line:#e3e6ef;--accent:#3b3486;--chip:#eef0f7;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 6px 18px rgba(20,24,40,.06);--shadow2:0 4px 10px rgba(20,24,40,.08),0 18px 40px rgba(20,24,40,.14)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1220;--panel:#171b2c;--ink:#e8eaf3;--muted:#a7aec4;--faint:#7c849c;--line:#2a3048;--accent:#a99ff5;--chip:#242a42}}
:root[data-theme="dark"]{--bg:#0f1220;--panel:#171b2c;--ink:#e8eaf3;--muted:#a7aec4;--faint:#7c849c;--line:#2a3048;--accent:#a99ff5;--chip:#242a42}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
.hero{background:radial-gradient(1000px 380px at 10% -10%,rgba(15,110,102,.45),transparent 60%),linear-gradient(135deg,#1f1b4d,#2a2370 50%,#0b4a45);color:#fff;padding:32px 0 28px}
.kicker{font-size:13px;letter-spacing:.14em;opacity:.75;font-weight:700}
.hero h1{margin:6px 0 4px;font-size:clamp(26px,3.4vw,40px);font-weight:900}
.hero p{margin:0;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:20px}
.stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:26px;font-weight:900;line-height:1.1}.stat span{font-size:12.5px;opacity:.8}
.prog{height:10px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:18px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#7ee0a1,#3fbf7f)}
.progl{font-size:13px;opacity:.85;margin-top:6px}
h2{font-size:20px;font-weight:900;margin:30px 0 12px}
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s}
.rc:hover{transform:translateY(-4px);box-shadow:var(--shadow2)}
.rc.off{opacity:.55}.rc.off:hover{transform:none;box-shadow:var(--shadow)}
.rc .hd{padding:16px 18px;color:#fff;background:var(--c)}
.rc .hd b{font-size:20px;font-weight:900;display:block}.rc .hd span{font-size:13px;opacity:.85}
.rc .bd{padding:12px 18px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.rc .num{display:flex;gap:14px;flex-wrap:wrap}.rc .num div{white-space:nowrap}.rc .num div b{font-size:20px;font-weight:900;display:block;line-height:1.15}.rc .num div span{font-size:12px;color:var(--faint)}
.rc .bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--chip)}.rc .bar i{height:100%}
.rc .go{margin-top:auto;text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px;font-weight:800}
.rc:not(.off):hover .go{background:var(--c);border-color:var(--c);color:#fff}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:600px}
th,td{padding:9px 12px;text-align:center;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:13px;color:var(--muted);font-weight:800}
td:first-child,th:first-child{text-align:left;font-weight:800;white-space:nowrap}
td a{display:block;border-radius:8px;padding:4px 0;font-weight:800}
td a:hover{outline:2px solid var(--accent)}
td.z{color:var(--faint)}
tr.tot td{font-weight:900;border-bottom:0}
td .done{background:color-mix(in srgb,#2e9e5b 22%,transparent);color:inherit}
td .todo{color:var(--faint);font-weight:600;font-size:12.5px}
td .rd{display:block;font-size:11px;color:var(--faint);font-weight:600}
td.era{font-size:12px;color:var(--muted);font-weight:600;text-align:left}
.note{color:var(--faint);font-size:12.5px;margin:8px 2px}
.foot{color:var(--faint);font-size:12.5px;padding:28px 0 40px;text-align:center}.foot a{color:var(--accent);font-weight:700}
</style>
</head>

  <div class="kicker">TEACHER CERTIFICATION EXAM · PHYSICS</div>

    '<div class="num"><div><b>'+k.n+'</b><span>학습지</span></div><div><b>'+k.nq+'</b><span>문항</span></div><div><b>'+(k.ys.length?(k.ys[0]===k.ys[k.ys.length-1]?k.ys[0]:k.ys[0]+'–'+k.ys[k.ys.length-1]):'—')+'</b><span>학년도</span></div></div>'+
    '<div class="bar">'+bar+'</div><span class="go">'+(off?'준비 중':'대시보드 열기 →')+'</span></div></'+tag+'>';
}).join('');
var K=D.kinds.filter(function(k){return k.n}), mx=1;
K.forEach(function(k){ D.majors.forEach(function(m){ mx=Math.max(mx,k.topics[m.k]||0); }); });
var h='<tr><th>주제</th>'+K.map(function(k){return '<th>'+k.name+'</th>'}).join('')+'<th>합계</th></tr>';
D.majors.forEach(function(m){
  var sum=0, row=K.map(function(k){ var v=k.topics[m.k]||0; sum+=v; if(!v) return '<td class="z">·</td>';
    var a=Math.round(15+70*v/mx); return '<td><a href="'+go(k.key,'t='+encodeURIComponent(m.k))+'" target="_top" style="background:color-mix(in srgb,'+m.color+' '+a+'%,transparent);color:'+(a>50?'#fff':'inherit')+'">'+v+'</a></td>'; }).join('');
  h+='<tr><td>'+m.icon+' '+m.name+'</td>'+row+'<td><b>'+(sum||'·')+'</b></td></tr>';
});
h+='<tr class="tot"><td>학습지 수</td>'+K.map(function(k){return '<td>'+k.n+'</td>'}).join('')+'<td>'+D.n+'</td></tr>';
$('mx').innerHTML=h;
var t='<tr><th>학년도</th><th>시험 형태</th>'+D.kinds.map(function(k){return '<th>'+k.name+'</th>'}).join('')+'</tr>';
D.years.slice().reverse().forEach(function(y){
  t+='<tr><td>'+y.year+'</td><td class="era">'+y.era+'</td>'+D.kinds.map(function(k){
    var v=y.n[k.kind]||0, has=y.has[k.kind];
    if(v) return '<td><a class="done" href="'+go(k.key,'y='+y.year)+'" target="_top">'+v+'<span class="rd">'+(k.kind==='객관식'?'묶음':'문항')+'</span></a></td>';
    if(!has) return '<td class="z">·</td>';
    return '<td><a class="todo" href="'+y.pdf+'" target="_blank" title="원문 PDF">원문<span class="rd">예정</span></a></td>';
  }).join('')+'</tr>';
});
$('yt').innerHTML=t;
$('foot').innerHTML='생성일 '+D.built+' · <a href="../임용_문제목록.xlsx">엑셀 문제목록</a> · <a href="../index.html" target="_top">🏠 대문</a> · <a href="../학습지.html" target="_top">학습지 목록</a>';
})();
</script>
