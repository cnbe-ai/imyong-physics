<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물리교육론 문항 지도</title>
<style>
:root{--bg:#f4f5fa;--panel:#fff;--panel2:#f8f9fc;--ink:#1b1f2a;--muted:#5b6475;--faint:#8a93a6;--line:#e3e6ef;--accent:#3b3486;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 6px 18px rgba(20,24,40,.06);--shadow2:0 4px 10px rgba(20,24,40,.08),0 18px 40px rgba(20,24,40,.14);
  --thumb:#fff;--chip:#eef0f7;--radius:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1220;--panel:#171b2c;--panel2:#1d2236;--ink:#e8eaf3;--muted:#a7aec4;--faint:#7c849c;
  --line:#2a3048;--accent:#a99ff5;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--shadow2:0 6px 14px rgba(0,0,0,.45),0 22px 44px rgba(0,0,0,.5);--thumb:#f7f8fb;--chip:#242a42}}
:root[data-theme="dark"]{--bg:#0f1220;--panel:#171b2c;--panel2:#1d2236;--ink:#e8eaf3;--muted:#a7aec4;--faint:#7c849c;
  --line:#2a3048;--accent:#a99ff5;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--shadow2:0 6px 14px rgba(0,0,0,.45),0 22px 44px rgba(0,0,0,.5);--thumb:#f7f8fb;--chip:#242a42}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none} button{font:inherit;color:inherit}
.wrap{max-width:1480px;margin:0 auto;padding:0 20px}
.hero{background:radial-gradient(1200px 400px at 10% -10%,rgba(255,255,255,.12),transparent 60%),linear-gradient(135deg,#1b1f2a,#2b2766 55%,#5b4fc4);color:#fff;padding:30px 0 24px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:22px 22px;pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:700}
.hero h1{margin:6px 0 4px;font-size:clamp(24px,3.2vw,38px);font-weight:900;letter-spacing:-.02em}
.hero p{margin:0;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:20px}
.stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:26px;font-weight:900;line-height:1.1}.stat span{font-size:12.5px;opacity:.8}
.dist{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:18px;background:rgba(255,255,255,.12)}.dist i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px;cursor:pointer}.legend span:hover{text-decoration:underline}
.legend em{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:12px;padding-bottom:12px}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:15px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--panel2)}
.tabs,.chips{display:flex;gap:6px;flex-wrap:wrap}
.tab,.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;cursor:pointer;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.chip{padding:5px 11px;font-size:12.5px}
.tab .n,.chip .n{font-size:11.5px;font-weight:800;background:var(--chip);border-radius:99px;padding:0 7px;color:var(--muted)}
.tab:hover,.chip:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.tab.on,.chip.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.tab.on .n,.chip.on .n{background:rgba(255,255,255,.25);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel,.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;font-size:13.5px;color:var(--ink);cursor:pointer}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.row2{width:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row2 .lab{font-size:12px;color:var(--faint);font-weight:800}
.main{display:grid;grid-template-columns:250px 1fr;gap:24px;padding-top:22px;padding-bottom:60px}
.side{position:sticky;top:130px;align-self:start;max-height:calc(100vh - 150px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px;box-shadow:var(--shadow)}
.side h4{margin:4px 6px 10px;font-size:12px;letter-spacing:.1em;color:var(--faint)}
.tree .mj{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;cursor:pointer;font-weight:800;font-size:14px}
.tree .mj:hover,.tree .mn:hover{background:var(--panel2)}
.tree .dot{width:10px;height:10px;border-radius:3px}
.tree .cnt{margin-left:auto;font-size:12px;color:var(--faint);font-weight:700}
.tree .mn{display:flex;gap:8px;padding:5px 8px 5px 26px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.tree .mn.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink);font-weight:700}
.tree .mn.zero{opacity:.38}
.result-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;color:var(--muted);font-size:14px}.result-line b{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:700;color:var(--ink)}
.pill button{border:0;background:none;cursor:pointer;color:var(--faint);padding:0;font-size:14px}
.sec{margin:0 0 30px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--line)}
.sec-h .ic{font-size:22px}.sec-h h2{margin:0;font-size:22px;font-weight:900}.sec-h .cnt{margin-left:auto;font-weight:800;color:var(--faint);font-size:13px}
.minor-h{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}
.minor-h h3{margin:0;font-size:16px;font-weight:800}.minor-h .desc{color:var(--faint);font-size:12.5px}
.minor-h .code{font-size:12px;font-weight:800;color:#fff;background:var(--c);border-radius:6px;padding:1px 7px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s,border-color .18s;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow2);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c);z-index:1}
.thumb{display:block;background:var(--thumb);aspect-ratio:16/11;position:relative;border-bottom:1px solid var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .25s}
.card:hover .thumb img{transform:scale(1.04)}
.thumb .noimg{display:flex;align-items:center;justify-content:center;height:100%;font-size:40px;opacity:.35}
.thumb .go{position:absolute;right:8px;bottom:8px;background:rgba(27,31,42,.82);color:#fff;font-size:11.5px;font-weight:700;border-radius:8px;padding:3px 8px;opacity:0;transition:opacity .18s}
.card:hover .thumb .go{opacity:1}
.badge{position:absolute;left:10px;top:12px;font-size:11.5px;font-weight:800;color:#fff;background:var(--c);border-radius:7px;padding:2px 7px;box-shadow:0 2px 6px rgba(0,0,0,.18);z-index:2;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{padding:11px 13px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);font-weight:700;flex-wrap:wrap}
.meta .rc{font-size:10.5px;background:var(--chip);border-radius:6px;padding:0 6px}
.meta .rc.deep{background:#ffd84d;color:#3b2f00;font-weight:800}
.ko{font-weight:800;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.en{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:4px}.tags span{font-size:11.5px;background:var(--chip);color:var(--muted);border-radius:6px;padding:1px 7px;font-weight:600}
.tags span.tp{color:#fff;background:var(--tc)}
.ans{display:none;font-size:12.5px;background:color-mix(in srgb,#2e9e5b 14%,transparent);border-radius:8px;padding:5px 8px;font-weight:700}
body.show-ans .ans{display:block}
.acts{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.acts a,.acts button{flex:1;text-align:center;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:6px 4px;font-size:12.5px;font-weight:800;cursor:pointer}
.acts a:hover,.acts button:hover{background:var(--c);border-color:var(--c);color:#fff}.acts .pv{flex:0 0 38px}
body.list .grid{grid-template-columns:1fr}
body.list .card{flex-direction:row}
body.list .card::before{width:4px;height:auto;bottom:0;right:auto}
body.list .thumb{width:170px;flex:0 0 170px;aspect-ratio:auto;border-bottom:0;border-right:1px solid var(--line)}
body.list .ko{-webkit-line-clamp:1;min-height:0}body.list .acts{max-width:330px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}.empty b{display:block;font-size:40px;margin-bottom:8px}
.more{display:block;margin:18px auto 0;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 22px;font-weight:800;cursor:pointer}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,12,24,.55);backdrop-filter:blur(4px)}
.modal.on{display:flex}
.mbox{background:var(--panel);border-radius:20px;max-width:1000px;width:100%;max-height:calc(100vh - 40px);overflow:auto;box-shadow:var(--shadow2);display:grid;grid-template-columns:1.1fr 1fr;position:relative}
.mfig{background:var(--thumb);padding:18px;display:flex;align-items:flex-start;justify-content:center;border-right:1px solid var(--line);position:relative}
.mfig img{width:100%;height:auto;max-height:76vh;object-fit:contain;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.mfig::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.mtxt{padding:24px 24px 20px;display:flex;flex-direction:column;gap:10px}
.mtxt .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mtxt h3{margin:2px 0 0;font-size:21px;font-weight:900;line-height:1.35}
.mtxt .en{white-space:normal;font-size:14px}
.mtxt .mans{display:none;background:color-mix(in srgb,#2e9e5b 14%,transparent);border-radius:12px;padding:10px 14px;font-weight:800}
.mtxt.reveal .mans{display:block}
.mtxt .note{font-size:12.5px;color:var(--faint)}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.mbtns a,.mbtns button{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:9px 14px;font-weight:800;font-size:14px;cursor:pointer}
.mbtns .pri{background:var(--c);border-color:var(--c);color:#fff}
.mclose{position:absolute;right:12px;top:10px;border:0;background:var(--panel2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;z-index:2}
.mnav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:var(--panel);box-shadow:var(--shadow2);width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:18px;z-index:51}
.mnav.prev{left:14px}.mnav.next{right:14px}
.foot{color:var(--faint);font-size:12.5px;padding:24px 0 40px;text-align:center}.foot a{color:var(--accent);font-weight:700}
.top-btn{position:fixed;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:var(--shadow2);cursor:pointer;font-size:18px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.top-btn.on{opacity:1;pointer-events:auto}
@media (max-width:980px){.bar{position:static}.main{grid-template-columns:1fr}.side{position:static;max-height:none}.mbox{grid-template-columns:1fr}.mfig{border-right:0;border-bottom:1px solid var(--line)}.mnav{display:none}}
@media (max-width:560px){.wrap{padding:0 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ko{font-size:13px}.tags,.en{display:none}body.list .thumb{width:100px;flex-basis:100px}}
.card .ans{display:none!important} #ansBtn{display:none!important}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="kicker">Teacher Certification Exam · 중등교사 임용시험 물리 기출</div>
  <h1>물리교육론 문항 지도</h1><p id="heroSub"></p>
  <div class="stats" id="stats"></div><div class="dist" id="dist"></div><div class="legend" id="legend"></div>
</div></header>
<div class="bar"><div class="wrap">
  <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="제목·학년도·분류·태그로 찾기 (예: 퍼텐셜, 2003, 오수벨, 1.4.1.1)" autocomplete="off"><kbd>/</kbd></label>
  <div class="tools">
    <select class="sel" id="yf" title="연도"></select>
    <select class="sel" id="sort" title="정렬"><option value="topic">주제별 묶음</option><option value="new">최신순</option><option value="old">오래된 순</option><option value="group">갈래순</option></select>
    <button class="tbtn" id="vGrid" title="카드 보기">▦</button><button class="tbtn" id="vList" title="목록 보기">☰</button>
    <button class="tbtn" id="ansBtn" title="카드에 정답 표시">정답</button>
    <select class="sel" id="clickTo" title="썸네일 클릭 시 여는 자료"><option value="0">클릭 → 학생용</option><option value="1">클릭 → 교사용</option><option value="2">클릭 → 원문 PDF</option></select>
    <button class="tbtn" id="rand" title="무작위 문제">🎲</button><button class="tbtn" id="theme" title="밝게/어둡게">◐</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="row2"><span class="lab" id="glab"></span><div class="chips" id="chips"></div></div>
</div></div>
<div class="wrap main" id="mainWrap">
  <aside class="side"><h4>주제 › <span id="glab2"></span></h4><div class="tree" id="tree"></div></aside>
  <section><div class="result-line" id="resLine"></div><div id="content"></div></section>
</div>
<div class="foot wrap" id="foot"></div>
<div class="modal" id="modal" aria-hidden="true">
  <button class="mnav prev" id="mPrev" title="이전 (←)">‹</button>
  <div class="mbox" id="mbox" role="dialog" aria-modal="true"><button class="mclose" id="mClose" title="닫기 (Esc)">×</button><div class="mfig" id="mFig"></div><div class="mtxt" id="mTxt"></div></div>
  <button class="mnav next" id="mNext" title="다음 (→)">›</button>

때문(평가의 타당도 결여) / ㉠ ‘추 전체에 작용하는 힘에 따른 추의 가속도를 정리한 표를 가로축 힘–세로축 가속도 그래프로 바르게 변환하였는가?’", "th": "../학습지/_썸네일/PTE-2025-B-04.png", "L": [["학생용", "../학습지/2_물리교육론/2025/PTE-2025-B-04_학생용.html"], ["교사용", "../학습지/2_물리교육론/2025/PTE-2025-B-04_교사용.html"], ["원문 PDF", "../문항모음/2025_중등1차_물리_전공B.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2025-B-05", "c": "2025 1차 전공B 5번", "mj": "물리교육론", "ms": ["물리교육론", "현대물리학"], "g": "물리교육론", "y": 2025, "t": "LED로 플랑크 상수 측정하기 — 회로 재구성, 발광 원리, 그래프 작성 지도", "s": "2025학년도 1차 전공B 5번 · 난이도 ★★☆☆☆ · 5.2.2.3 고체물리 기초 (에너지 밴드와 반도체) · 순방향 전압이 V_t에 이르면 전자가 p–n 접합의 띠 간격 E_g\\approx eV_t를 넘어 정공과 재결합하며 광자 hf\\approx E_g를 낸다 → eV_t=hf, h=\\dfrac{eV_t}{f}=\\dfrac", "tg": ["5.2.2.3 고체물리 기초 (에너지 밴드와 반도체)", "5.1.2.2 광전 효과와 광자", "E7 실험 지도와 평가", "광자 에너지", "반도체", "LED"], "a": "㉠ 각 LED에 스위치를 직렬로 연결한 가지 4개를 병렬로 연결하고(전원·저항·전류계는 공통 직렬, 전압계는 LED 양단), 측정할 LED의 스위치만 닫아 차례로 전류와 전압을 측정한다. / 원리 전압이 문턱 전압 V_t에 이르면 전자가 eV_t의 에너지를 얻어 p–n 접합의 띠 간격을 넘어가 전류가 급증하고(㉡), 전자와 정공이 재결합하며 띠 간격만큼의 에너지 E_t=eV_t를 광자 hf로 방출한다(㉣). h=\\dfrac{eV_t}{f}=\\dfrac{eV_t\\lambda}{c} (= E_t–f 그래프의 기울기) / ㉤ 측정점을 잇지 말고 점들의 경향을 나타내는 최적 직선을 그린 뒤, 직선 위에서 멀리 떨어진 두 점을 골라 기울기를 구하게 한다.", "th": "../학습지/_썸네일/PTE-2025-B-05.png", "L": [["학생용", "../학습지/2_물리교육론/2025/PTE-2025-B-05_학생용.html"], ["교사용", "../학습지/2_물리교육론/2025/PTE-2025-B-05_교사용.html"], ["원문 PDF", "../문항모음/2025_중등1차_물리_전공B.pdf#page=4"]], "au": false, "bd": false}, {"id": "PTE-2024-A-05", "c": "2024 1차 전공A 5번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2024, "t": "밀리컨의 기름방울 실험과 자료 선별 논쟁 — 가설 연역적 탐구와 가치·태도 요소", "s": "2024학년도 1차 전공A 5번 · 난이도 ★★☆☆☆ · 3.1.1.1 쿨롱의 법칙과 전하 보존 · 가설을 먼저 세우고(모든 전하는 기본 전하량의 배수) 그로부터 예측되는 결과를 실험으로 검증 → 가설 연역적 탐구. (나)에는 자료 선별의 정당성 논쟁(과학 활동의 윤리성)과 ‘아름다운 결과’(과학의 심미적 가치)가", "tg": ["3.1.1.1 쿨롱의 법칙과 전하 보존", "E4 과학 탐구와 과학적 사고", "E5 과학의 본성과 과학사", "E1 과학과 교육과정", "과학사", "탐구 방법", "연구 윤리"], "a": "㉠ 가설 연역적 탐구 방법 — 밀리컨이 ‘모든 전하는 기본 전하량의 배수’라는 가설을 먼저 세우고, 기름방울 실험 결과로 이 가설을 검증했기 때문 / (나) ① 과학 활동의 윤리성: 140회 중 가설을 뒷받침하는 58회 자료만 골라 발표하면서 모든 결과를 수록했다고 거짓으로 적음 ② 과학의 심미적 가치: ‘아름다운 결과’ — 잘 통제된 실험 결과가 기본 전하량의 존재를 명확하고 단순하게 보여 줌(“발표할 만큼 아름다움”)", "th": "../학습지/_썸네일/PTE-2024-A-05.png", "L": [["학생용", "../학습지/2_물리교육론/2024/PTE-2024-A-05_학생용.html"], ["교사용", "../학습지/2_물리교육론/2024/PTE-2024-A-05_교사용.html"], ["원문 PDF", "../문항모음/2024_중등1차_물리_전공A.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2024-A-06", "c": "2024 1차 전공A 6번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2024, "t": "전동기로 옴의 법칙 확인하기 — 역기전력, 포퍼·쿤·라카토스의 과학철학", "s": "2024학년도 1차 전공A 6번 · 난이도 ★★★☆☆ · 3.2.2.3 패러데이 전자기 유도 법칙과 렌츠의 법칙 · 회전하는 전동기 코일에는 전자기 유도로 역기전력 \\varepsilon=k\\omega가 생겨 I=\\dfrac{V-\\varepsilon}{R}로 전류가 줄어든다(멈추면 V/I\\approx R). 반증주의는 반증 사례 하", "tg": ["3.2.2.3 패러데이 전자기 유도 법칙과 렌츠의 법칙", "3.2.1.1 전류, 저항, 옴의 법칙", "E5 과학의 본성과 과학사", "E4 과학 탐구와 과학적 사고", "옴의 법칙", "전자기 유도", "과학의 본성"], "a": "㉠ 회전하는 전동기에서 전자기 유도로 역기전력이 생겨 전류가 V/R보다 작아진다(회전하지 않으면 역기전력이 없어 V/I\\approx R). 반증주의의 한계: 반증 사례가 이론이 아니라 보조 가설(전동기를 순수 저항으로 본 가정)·실험 조건의 문제일 수 있는데 이를 구분하지 못하고 이론을 성급히 폐기하게 된다. / B·C 공통점(쿤): 두 학생 모두 옴의 법칙(패러다임)을 유지하며 변칙 사례를 패러다임 안에서 해결하려는 정상과학의 태도를 보인다. 차이점(라카토스): 둘 다 견고한 핵(옴의 법칙)을 지키지만, B는 ‘오차’라는 임시방편으로 변칙을 덮어 새 예측이 없는 퇴행적 태도, C는 보호대(보조 가설)를 수정해 새로운 예측을 하고 추가 실험으로 검증하려는 전진적 태도이다.", "th": "../학습지/_썸네일/PTE-2024-A-06.png", "L": [["학생용", "../학습지/2_물리교육론/2024/PTE-2024-A-06_학생용.html"], ["교사용", "../학습지/2_물리교육론/2024/PTE-2024-A-06_교사용.html"], ["원문 PDF", "../문항모음/2024_중등1차_물리_전공A.pdf#page=4"]], "au": false, "bd": false}, {"id": "PTE-2024-A-07", "c": "2024 1차 전공A 7번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2024, "t": "되돌아오는 부메랑 — 귀추적 추론으로 가설 세우기와 가설 평가·검증 실험 설계", "s": "2024학년도 1차 전공A 7번 · 난이도 ★★☆☆☆ · 1.3.1.3 각운동량 보존과 롤링 운동 · 귀추: 놀라운 현상 → 유사 사례 탐색 → 그 사례의 원리를 빌려 ‘이 현상도 그렇다면 설명된다’는 가설 생성. 좋은 가설의 조건: 관찰 사실을 인과적으로 설명(설명력), 기존 과학 이론과 정합, 검증 가능성 등.", "tg": ["1.3.1.3 각운동량 보존과 롤링 운동", "1.3.2.3 유체 동역학 (연속 방정식, 베르누이 방정식)", "E4 과학 탐구와 과학적 사고", "가설 세우기", "세차 운동", "양력"], "a": "㉠ ① 가설이 관찰 사실(부메랑이 처음엔 똑바로 서서 회전하다 점차 기울어진 채 회전)과 일치하며 진행 방향이 휘어 되돌아오는 현상을 인과적으로 설명한다(설명력). ② 이미 인정된 과학 원리인 각운동량 보존 법칙(세차 운동)에 근거하여 기존 과학 지식과 정합한다. / ㉡ ㉡: 부메랑 날개 단면이 비행기 날개처럼 위는 볼록하고 아래는 평평하여, 날아갈 때 두 면 사이의 압력 차(양력)로 볼록한 면 쪽으로 힘을 받아 진행 방향이 휘어 되돌아온다. 실험: 날개 단면만 다른(볼록–평평 / 양면 평평) 두 부메랑을 크기·질량·던지는 속력·각도·회전을 같게 하여 던지고 경로가 휘는 정도와 되돌아오는지를 비교한다.", "th": "../학습지/_썸네일/PTE-2024-A-07.png", "L": [["학생용", "../학습지/2_물리교육론/2024/PTE-2024-A-07_학생용.html"], ["교사용", "../학습지/2_물리교육론/2024/PTE-2024-A-07_교사용.html"], ["원문 PDF", "../문항모음/2024_중등1차_물리_전공A.pdf#page=4"]], "au": false, "bd": false}, {"id": "PTE-2024-B-03", "c": "2024 1차 전공B 3번", "mj": "물리교육론", "ms": ["물리교육론", "현대물리학"], "g": "물리교육론", "y": 2024, "t": "특수상대성 이론 수업 지도안 — 드라이버의 개념변화 학습 모형, 포스너의 개념변화 조건, GPS 시간 보정", "s": "2024학년도 1차 전공B 3번 · 난이도 ★★☆☆☆ · 5.1.1.2 시간 지연과 길이 수축 · 드라이버(R. Driver) 모형: 오리엔테이션 → 생각의 표현 → 생각의 재구성 → 생각의 적용 → 생각의 검토. 적용 단계는 포스너의 유용성(생산성) 조건에 대응. 원리에서 현상을 이끌어내는 것은 연역적 사고. ", "tg": ["5.1.1.2 시간 지연과 길이 수축", "5.1.1.1 마이컬슨-몰리 실험과 상대성 원리", "E3 오개념과 개념 변화", "E6 과학 수업 모형과 교수 전략", "E4 과학 탐구와 과학적 사고", "시간 팽창", "길이 수축", "GPS"], "a": "㉠ 드라이버(Driver)의 개념변화 학습 모형(구성주의 학습 모형). 단계 Ⅳ(생각의 적용)에 대응하는 조건: 새 개념의 유용성(생산성) — 새 개념이 새로운 상황(GPS)의 문제를 해결하는 데 유용해야 한다. / ㉡ 연역적 사고(연역적 추론) / ㉢ 일반 상대성 이론에 따라 중력이 약한 위성(높은 고도)에서는 지표면보다 시간이 빠르게 가는 현상(중력에 의한 시간 지연)", "th": "../학습지/_썸네일/PTE-2024-B-03.png", "L": [["학생용", "../학습지/2_물리교육론/2024/PTE-2024-B-03_학생용.html"], ["교사용", "../학습지/2_물리교육론/2024/PTE-2024-B-03_교사용.html"], ["원문 PDF", "../문항모음/2024_중등1차_물리_전공B.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2024-B-04", "c": "2024 1차 전공B 4번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2024, "t": "단진자 실험 보고서의 수행 평가 — 평가 준거 수정, 최저점 측정의 이유, 진자 길이 측정", "s": "2024학년도 1차 전공B 4번 · 난이도 ★★☆☆☆ · 1.4.1.2 단진자와 물리 진자 · 단진자 주기 T=2\\pi\\sqrt{L/g} — 길이의 제곱근에 비례, 질량·(작은) 진폭과 무관. 진자의 길이 L은 받침점에서 추의 질량 중심까지. 추가 최저점을 지날 때 속력이 최대라 통과 시각을 정확히 판단할 수", "tg": ["1.4.1.2 단진자와 물리 진자", "E7 실험 지도와 평가", "E4 과학 탐구와 과학적 사고", "단진자", "변인 통제", "측정 오차"], "a": "(1) ‘실의 길이, 추의 질량, 진폭을 각각 조작 변인으로 설정하고(한 번에 하나씩 변화), 나머지 변인은 통제하여 주기(종속 변인)를 측정했는가?’ — 진폭을 조작 변인으로 설정했는지를 포함 / ㉠ 추는 최저점에서 가장 빠르므로 기준점을 지나는 순간을 짧고 정확하게 판단할 수 있어 시간 측정(판단·반응) 오차가 작다. 최고점에서는 속력이 거의 0이라 머무는 시간이 길어 언제 최고점인지 판단하기 어려워 오차가 커진다. / ㉡ 진자의 길이는 실을 매단 점에서 추의 질량 중심까지로 측정해야 한다. 과정 (4)에서 실의 길이(100 cm)를 같게 해도 질량이 다른 추는 크기가 달라 질량 중심의 위치가 달라지므로 실제 진자의 길이가 달라져, 질량 외의 변인(길이)이 통제되지 않기 때문이다.", "th": "../학습지/_썸네일/PTE-2024-B-04.png", "L": [["학생용", "../학습지/2_물리교육론/2024/PTE-2024-B-04_학생용.html"], ["교사용", "../학습지/2_물리교육론/2024/PTE-2024-B-04_교사용.html"], ["원문 PDF", "../문항모음/2024_중등1차_물리_전공B.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2024-B-05", "c": "2024 1차 전공B 5번", "mj": "물리교육론", "ms": ["물리교육론", "열역학 및 통계물리"], "g": "물리교육론", "y": 2024, "t": "열전달을 모형·비유로 표현하기 — 근접 발달 영역, 브루너의 표현 양식, 비유의 한계", "s": "2024학년도 1차 전공B 5번 · 난이도 ★★☆☆☆ · 2.1.2.2 열전달 메커니즘 (전도, 대류, 복사) · 근접 발달 영역(ZPD): 혼자 해결하는 실제적 발달 수준과 도움을 받아 해결하는 잠재적 발달 수준의 차이 — 이 영역에 비계 제공. 브루너의 표현 양식: 작동적(행동·조작) → 영상적(그림·이미지) → 상징적(언어", "tg": ["2.1.2.2 열전달 메커니즘 (전도, 대류, 복사)", "E2 학습 이론", "E6 과학 수업 모형과 교수 전략", "열의 전도·대류·복사", "모형으로 설명하기"], "a": "㉠ 근접 발달 영역(ZPD, zone of proximal development) / ㉡ ① 영상적 표상: 열화상 카메라로 뜨거운 물 컵 주변의 색 변화(이미지)를 보여 준다. ② 작동적 표상: 학생들이 주변 도구나 신체를 이용해 열의 이동 방식을 직접 행동으로 표현한다. / ㉢ 비유물과 목표물은 모든 속성이 대응하지 않으므로, 대응하지 않는 비유물의 속성을 목표물의 속성으로 잘못 받아들여 오개념이 형성될 수 있다(예: 공 전달 비유 → 전도에서 입자가 이동한다고 오해).", "th": "../학습지/_썸네일/PTE-2024-B-05.png", "L": [["학생용", "../학습지/2_물리교육론/2024/PTE-2024-B-05_학생용.html"], ["교사용", "../학습지/2_물리교육론/2024/PTE-2024-B-05_교사용.html"], ["원문 PDF", "../문항모음/2024_중등1차_물리_전공B.pdf#page=4"]], "au": false, "bd": false}, {"id": "PTE-2023-A-05", "c": "2023 1차 전공A 5번", "mj": "물리교육론", "ms": ["물리교육론", "파동 및 광학"], "g": "물리교육론", "y": 2023, "t": "뉴턴의 두 프리즘 실험 — 결정적 실험, 백색광 가설, 가설 연역적 탐구", "s": "2023학년도 1차 전공A 5번 · 난이도 ★★☆☆☆ · 4.2.1.1 반사의 법칙과 스넬의 법칙 · 뉴턴: ‘백색광은 굴절률이 서로 다른 여러 색의 빛이 섞인 것이고, 프리즘은 이를 분산시킬 뿐’이라는 가설 → 두 번째 프리즘을 통과한 빨간빛은 더 이상 분산되지 않는다는 예측을 연역해 실험으로 검증. 두 이론 중 ", "tg": ["4.2.1.1 반사의 법칙과 스넬의 법칙", "E5 과학의 본성과 과학사", "E4 과학 탐구와 과학적 사고", "E1 과학과 교육과정", "빛의 분산", "과학사", "탐구 방법"], "a": "㉠ 결정적 실험 (experimentum crucis) / ㉡ 백색광(햇빛)은 굴절률(굴절 정도)이 서로 다른 여러 색의 빛이 섞여 있는 것이다. / 탐구 방법 가설 연역적 방법 — 가설을 먼저 설정하고, 그로부터 ‘빨간빛은 두 번째 프리즘에서 분산되지 않을 것’이라는 예측을 연역한 뒤, 실험 결과와 비교하여 가설을 검증하였기 때문", "th": "../학습지/_썸네일/PTE-2023-A-05.png", "L": [["학생용", "../학습지/2_물리교육론/2023/PTE-2023-A-05_학생용.html"], ["교사용", "../학습지/2_물리교육론/2023/PTE-2023-A-05_교사용.html"], ["원문 PDF", "../문항모음/2023_중등1차_물리_전공A.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2023-A-06", "c": "2023 1차 전공A 6번", "mj": "물리교육론", "ms": ["물리교육론", "열역학 및 통계물리"], "g": "물리교육론", "y": 2023, "t": "단열 주사기 실험과 과학 철학 — 포퍼의 반증주의와 쿤의 정상 과학", "s": "2023학년도 1차 전공A 6번 · 난이도 ★★☆☆☆ · 2.2.2.1 열역학 제1법칙과 열역학적 과정 · 단열 팽창: Q=0이므로 W\\gt 0이면 \\Delta U=-W\\lt 0 → 온도 하강. 포퍼: 예측과 어긋난 결과 하나로 이론은 반증·폐기. 쿤: 패러다임(열역학 법칙)을 받아들인 정상 과학 시기에는 패러다임을 의심", "tg": ["2.2.2.1 열역학 제1법칙과 열역학적 과정", "2.2.1.1 이상기체 방정식", "E5 과학의 본성과 과학사", "단열 압축·팽창", "열역학 제1법칙"], "a": "예비 교사 1 포퍼(반증주의) — 이론에서 이끌어 낸 예측(온도 상승)과 다른 실험 결과(온도 하강)가 나오자, 반증 사례에 따라 열역학 제1법칙을 폐기해야 한다고 주장했기 때문 / ㉠ 정상 과학 단계 — 쿤의 관점에서 예비 교사 2는 열역학 법칙(패러다임)을 의심하지 않고, 이를 풍선의 압축·팽창이라는 새로운 상황에 적용해 부합하는지 확인하는 퍼즐 풀이 활동을 하려 하기 때문", "th": "../학습지/_썸네일/PTE-2023-A-06.png", "L": [["학생용", "../학습지/2_물리교육론/2023/PTE-2023-A-06_학생용.html"], ["교사용", "../학습지/2_물리교육론/2023/PTE-2023-A-06_교사용.html"], ["원문 PDF", "../문항모음/2023_중등1차_물리_전공A.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2023-A-07", "c": "2023 1차 전공A 7번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2023, "t": "마찰 전기로 네온전구 켜기와 프랭클린의 단일 유체설 — 전기 유체의 이동과 과학 지식의 합의", "s": "2023학년도 1차 전공A 7번 · 난이도 ★★☆☆☆ · 3.1.1.1 쿨롱의 법칙과 전하 보존 · 털가죽으로 문지른 스티로폼은 음(−)으로 대전. 그 위의 알루미늄 접시는 유도로 아래 +, 위 −. 네온전구로 접시와 손을 이으면 전자가 접시 → 손으로 흐른다(프랭클린 유체로는 손 → 접시). ‘양전기·음전기’, ", "tg": ["3.1.1.1 쿨롱의 법칙과 전하 보존", "3.2.1.1 전류, 저항, 옴의 법칙", "E5 과학의 본성과 과학사", "E7 실험 지도와 평가", "마찰 전기", "도체와 부도체", "전류의 방향"], "a": "㉠·㉡ ㉠ 손이 알루미늄 접시에 닿으면 접시의 전하가 손을 통해 빠져나가므로, 부도체인 수수깡을 잡아 손이 접시에 닿지 않게 하기 위해. ㉡ 스티로폼 접시는 부도체라 전하가 이동하지 못하지만, 알루미늄 접시는 도체라 전하가 이동하여 네온전구로 흐를 수 있기 때문 / ㉢ 손(사람) → 네온전구 → 알루미늄 접시 (보통 상태인 손에서 전기 유체가 부족한(음전 "bd": false}, {"id": "PTE-2022-A-06", "c": "2022 1차 전공A 6번", "mj": "물리교육론", "ms": ["물리교육론", "역학", "파동 및 광학"], "g": "물리교육론", "y": 2022, "t": "압력 탐구 활동의 귀납적 사고와 뉴턴 입자설의 귀추적 사고 — 포퍼로 본 파동설의 지지", "s": "2022학년도 1차 전공A 6번 · 난이도 ★★☆☆☆ · 1.3.2.3 유체 동역학 (연속 방정식, 베르누이 방정식) · 귀납: 여러 관찰 사례에서 공통 규칙성을 찾아 일반화. 귀추: 관찰된 현상을 설명할 수 있는 가설(원인, 보이지 않는 실체)을 제안. 포퍼: 이론은 증명되지 않으며, 반증 가능한 대담한 예측이 반증 시험을 견디면 확", "tg": ["1.3.2.3 유체 동역학 (연속 방정식, 베르누이 방정식)", "4.2.1.1 반사의 법칙과 스넬의 법칙", "E4 과학 탐구와 과학적 사고", "E5 과학의 본성과 과학사", "과학적 사고", "빛의 본성 과학사", "유체의 압력"], "a": "㉠·㉡ ㉠ 귀납적 사고, ㉡ 귀추적 사고 / 차이점 귀납은 여러 관찰 사례로부터 공통 규칙성을 찾아 일반화하는 것(결론이 관찰 가능한 현상 수준)이고, 귀추는 관찰된 현상을 설명하기 위해 그 원인이 되는 가설(관찰할 수 없는 실체 포함)을 제안하는 것이다. / ㉢ 포퍼에 따르면 이론은 증명될 수 없고 반증 시도를 견딜 때 잠정적으로 지지된다. 파동설은 ‘빛은 물에서 더 느리게 진행한다’는 반증 가능한 예측을 했고, 피조·푸코의 실험에서 반증되지 않고 살아남았으므로(확인·입증됨) 지지되었다. 반대 예측을 한 입자설은 반증되었다.", "th": "../학습지/_썸네일/PTE-2022-A-06.png", "L": [["학생용", "../학습지/2_물리교육론/2022/PTE-2022-A-06_학생용.html"], ["교사용", "../학습지/2_물리교육론/2022/PTE-2022-A-06_교사용.html"], ["원문 PDF", "../문항모음/2022_중등1차_물리_전공A.pdf#page=4"]], "au": false, "bd": false}, {"id": "PTE-2022-A-07", "c": "2022 1차 전공A 7번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2022, "t": "솔레노이드 시뮬레이션 수업 — 통합 탐구 과정(변인 통제·자료 변환)과 관찰 체크리스트 평가", "s": "2022학년도 1차 전공A 7번 · 난이도 ★★☆☆☆ · 3.2.2.2 비오-사바르 법칙과 앙페르 법칙 · 통합 탐구 과정: 문제 인식, 가설 설정, 변인 통제, 자료 변환, 자료 해석, 결론 도출, 일반화. 긴 솔레노이드 내부 B=\\mu_0nI — 반지름과 무관, 단위 길이당 감은 수와 전류에 비례.", "tg": ["3.2.2.2 비오-사바르 법칙과 앙페르 법칙", "E4 과학 탐구와 과학적 사고", "E7 실험 지도와 평가", "솔레노이드 자기장", "탐구 과정", "시뮬레이션"], "a": "㉠·㉡ ㉠ 변인 통제, ㉡ 자료 변환 / ㉢ 예비 교사가 전류가 다른데 자기장의 세기가 같은 두 시뮬레이션(솔레노이드 A, B) 결과를 비교해 보여 주며 그 이유를 묻는, 모의 실험과 관련된 문제 상황을 제시했기 때문 / ㉣ 학생 A가 ‘자기장은 반지름과 무관할 것’, 학생 B가 ‘단위 길이당 감은 수에 비례할 것’이라고 시뮬레이션 전에 예측했기 때문", "th": "../학습지/_썸네일/PTE-2022-A-07.png", "L": [["학생용", "../학습지/2_물리교육론/2022/PTE-2022-A-07_학생용.html"], ["교사용", "../학습지/2_물리교육론/2022/PTE-2022-A-07_교사용.html"], ["원문 PDF", "../문항모음/2022_중등1차_물리_전공A.pdf#page=5"]], "au": false, "bd": false}, {"id": "PTE-2022-B-03", "c": "2022 1차 전공B 3번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2022, "t": "드라이버의 개념 변화 학습 모형 — 부도체의 정전기 유도(유전 분극)와 피아제의 평형화", "s": "2022학년도 1차 전공B 3번 · 난이도 ★★☆☆☆ · 3.1.1.1 쿨롱의 법칙과 전하 보존 · 드라이버 모형: 오리엔테이션 → 생각의 표현 → 생각의 재구성(명료화와 교환 → 갈등 상황에의 노출 → 새로운 생각의 구성 → 새로운 생각의 평가) → 생각의 적용 → 생각 변화의 검토. 부도체에서도 대전체 가까이에", "tg": ["3.1.1.1 쿨롱의 법칙과 전하 보존", "3.1.2.3 축전기(커패시터)와 유전체", "E3 오개념과 개념 변화", "E2 학습 이론", "E6 과학 수업 모형과 교수 전략", "정전기 유도", "도체와 부도체", "검전기"], "a": "(다) 학생들이 자신의 생각을 발표하여 명료화하고, 다른 학생의 생각과 비교·교환하면서 자신과 다른 생각이 있음을 인식하게 한다(생각의 명료화와 교환). / (라) 갈등 상황에의 노출 — 시범 실험은 부도체에서도 금속박이 벌어지는 결과를 보여 학생의 예측과 불일치하는 상황을 제시해 인지 갈등(기존 생각에 대한 불만족)을 일으킨다. / 피아제 (다)에서 학생 B는 ‘부도체는 정전기 유도가 없다’는 기존 인지 구조로 평형 상태였으나, (라)의 시범 실험 결과가 기존 구조로 동화되지 않아 인지적 불평형이 생겼다. (마)·(바)에서 새 개념을 받아들여 인지 구조를 수정(조절)하고, (사)·(아)에서 적용·검토하며 새로운 평형에 이르렀다(평형화).", "th": "../학습지/_썸네일/PTE-2022-B-03.png", "L": [["학생용", "../학습지/2_물리교육론/2022/PTE-2022-B-03_학생용.html"], ["교사용", "../학습지/2_물리교육론/2022/PTE-2022-B-03_교사용.html"], ["원문 PDF", "../문항모음/2022_중등1차_물리_전공B.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2022-B-04", "c": "2022 1차 전공B 4번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2022, "t": "물리학Ⅰ 핵심역량과 충격 흡수 장치 설계 과제 — 정보 수집 과제와 모형화 안내", "s": "2022학년도 1차 전공B 4번 · 난이도 ★★☆☆☆ · 1.2.2.1 선운동량과 충격량 · 2015 개정 과학과 핵심역량: 과학적 사고력, 과학적 탐구 능력, 과학적 문제 해결력, 과학적 의사소통 능력, 과학적 참여와 평생 학습 능력. 충격량 I=F_{\\rm 평균}\\Delta t=\\Delta p — 같은 ", "tg": ["1.2.2.1 선운동량과 충격량", "E1 과학과 교육과정", "E6 과학 수업 모형과 교수 전략", "충격량", "안전장치", "문제 해결"], "a": "㉠ 과학적 문제 해결력 / ㉡ ① 생활 속 충격 흡수 장치(에어백, 범퍼, 매트, 놀이터 고무 바닥 등)의 사례를 조사한다. ② 조사한 장치들이 충돌 시간을 늘려 같은 충격량에서 충격력을 줄이는 원리를 분석·정리한다. / ㉢ 날달걀을 그네에서 떨어지는 아이의 모형으로 보고, 실제 사고 상황에 대응하도록 그네가 가장 높이 올라간 높이에서(같은 높이로) 떨어뜨리게 하며, 장치 유무 외의 조건(높이·달걀·바닥)은 같게 하도록 안내한다.", "th": "../학습지/_썸네일/PTE-2022-B-04.png", "L": [["학생용", "../학습지/2_물리교육론/2022/PTE-2022-B-04_학생용.html"], ["교사용", "../학습지/2_물리교육론/2022/PTE-2022-B-04_교사용.html"], ["원문 PDF", "../문항모음/2022_중등1차_물리_전공B.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2022-B-05", "c": "2022 1차 전공B 5번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2022, "t": "POE 수업 모형과 가설 연역적 순환 학습 — 역학적 에너지 보존과 마찰에 의한 열", "s": "2022학년도 1차 전공B 5번 · 난이도 ★★☆☆☆ · 1.2.1.3 역학적 에너지 보존과 비보존력 · POE: 예측(Predict) → 관찰(Observe) → 설명(Explain). 순환 학습: 탐색 → 개념 도입 → 개념 적용 — 기술적, 경험-귀추적, 가설-연역적 순환 학습으로 나뉜다. 간이 공기 부상 궤도의 ", "tg": ["1.2.1.3 역학적 에너지 보존과 비보존력", "1.4.1.3 연성 진동, 감쇠·강제 진동과 공명", "E6 과학 수업 모형과 교수 전략", "E3 오개념과 개념 변화", "역학적 에너지 보존", "마찰과 열"], "a": "A·B A: POE(예측-관찰-설명) 수업 모형, B: 가설-연역적 순환 학습 모형 / ㉠ 새로 도입한 개념(마찰에 의해 역학적 에너지가 보존되지 않음)을 다른 상황(생활 속 사례)에 적용하여 개념을 확장·일반화하고 이해를 강화한다. / ㉡ 학생들의 선개념(오개념)을 드러내어 확인하고, 예측과 관찰 결과의 차이로 인지 갈등을 일으켜 개념 변화를 유도(하는 데 효과적)", "th": "../학습지/_썸네일/PTE-2022-B-05.png", "L": [["학생용", "../학습지/2_물리교육론/2022/PTE-2022-B-05_학생용.html"], ["교사용", "../학습지/2_물리교육론/2022/PTE-2022-B-05_교사용.html"], ["원문 PDF", "../문항모음/2022_중등1차_물리_전공B.pdf#page=4"]], "au": false, "bd": false}, {"id": "PTE-2021-A-01", "c": "2021 1차 전공A 1번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2021, "t": "벽을 밀어 미끄러지는 스케이트 선수 — 비고츠키의 비계와 인지 갈등의 유형", "s": "2021학년도 1차 전공A 1번 · 난이도 ★★☆☆☆ · 1.2.1.1 일과 운동에너지 정리 · 비고츠키: 교사의 발문(㉠, ㉡)은 학생이 혼자 도달하지 못하는 수준으로 나아가게 돕는 비계(scaffolding) — 근접 발달 영역 안에서의 도움. ㉢: ‘일 = 힘 × 이동 거리’와 ‘일 = 에너지 전달’이라는", "tg": ["1.2.1.1 일과 운동에너지 정리", "E2 학습 이론", "E3 오개념과 개념 변화", "일과 에너지", "힘이 한 일", "에너지 전달"], "a": "㉠·㉡ 비계(scaffolding) 설정 — 근접 발달 영역 안에서 학생이 스스로 더 높은 수준의 이해에 도달하도록 돕는 언어적 도움 / ㉢ 개념–개념 갈등 (기존 개념과 새로운 개념 사이의 인지 갈등)", "th": "../학습지/_썸네일/PTE-2021-A-01.png", "L": [["학생용", "../학습지/2_물리교육론/2021/PTE-2021-A-01_학생용.html"], ["교사용", "../학습지/2_물리교육론/2021/PTE-2021-A-01_교사용.html"], ["원문 PDF", "../문항모음/2021_중등1차_물리_전공A.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2021-A-05", "c": "2021 1차 전공A 5번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2021, "t": "두 수레의 분리 실험으로 운동량 보존 확인 — 통제 변인, 비례 논리, 분석적 채점", "s": "2021학년도 1차 전공A 5번 · 난이도 ★★☆☆☆ · 1.2.2.1 선운동량과 충격량 · 분리 후 두 수레가 같은 시간 동안 등속으로 움직이게 하면 이동 거리 ∝ 속력 → m_{\\rm A}d_{\\rm A}=m_{\\rm B}d_{\\rm B}로 운동량 보존 확인. 이를 이해하려면 비례 논리(형식적 조작기).", "tg": ["1.2.2.1 선운동량과 충격량", "1.2.2.2 1·2차원 탄성 및 비탄성 충돌", "E4 과학 탐구와 과학적 사고", "E2 학습 이론", "E7 실험 지도와 평가", "운동량 보존", "실험 설계", "비례"], "a": "㉠ ㉠ 두 수레가 분리된 후 책에 충돌할 때까지 걸린 시간(이동 시간). 과정 (마)에서 수레의 출발 위치를 바꾸어 가며 두 수레가 책과 동시에 충돌하는(충돌 소리가 동시에 들리는) 위치를 찾아 두 수레의 운동 시간을 같게 한다. / ㉡ 비례 논리(비례적 추론) / ㉢ 평가 요소(실험 수행, 자료 수집 및 분석과 해석, 결과 정리 및 결론 도출)를 분리하여 각 요소마다 우수·양호·미흡 수준별 점수를 부여하고 합산하는 분석적 채점 기준표로 수정한다(예: 각 3·2·1점, 우수·우수·양호 → 8점).", "th": "../학습지/_썸네일/PTE-2021-A-05.png", "L": [["학생용", "../학습지/2_물리교육론/2021/PTE-2021-A-05_학생용.html"], ["교사용", "../학습지/2_물리교육론/2021/PTE-2021-A-05_교사용.html"], ["원문 PDF", "../문항모음/2021_중등1차_물리_전공A.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2021-A-06", "c": "2021 1차 전공A 6번", "mj": "물리교육론", "ms": ["물리교육론", "현대물리학", "전자기학"], "g": "물리교육론", "y": 2021, "t": "자석으로 문지른 쇠못 — 유추를 이용한 설명 가설 설정 지도", "s": "2021학년도 1차 전공A 6번 · 난이도 ★★☆☆☆ · 5.2.2.3 고체물리 기초 (에너지 밴드와 반도체) · 인과적 의문에 대한 설명 가설을 세우기 위해 유사한 다른 현상(자석 조각을 담은 시험관)을 관찰하고 대응 관계를 찾아 원리를 옮겨 오는 것 = 유추(analogy). 도출 가설: 쇠못 안의 작은 자석(자기 구역)들이", "tg": ["5.2.2.3 고체물리 기초 (에너지 밴드와 반도체)", "3.2.2.1 자기력과 로렌츠 힘", "E4 과학 탐구와 과학적 사고", "자석", "자성체", "가설 세우기"], "a": "(1) 유추(analogy, 유추적 추론) / ㉠·㉡ ㉠ 쇠못을 문지른 현상과 자석 조각을 담은 시험관을 문지른 현상에서 서로 대응되는(유사한) 점은 무엇인가? ㉡ 시험관 속 자석 조각들은 문지르기 전과 후에 각각 어떻게 배열되어 있었기에 클립을 끌어당기게 되었는가? / ㉢ 쇠못 내부에는 작은 자석(자기 구역)들이 무질서하게 배열되어 있다가, 자석으로 문지르면 한 방향으로 정렬되어 쇠못이 자석의 성질을 갖게 된다.", "th": "../학습지/_썸네일/PTE-2021-A-06.png", "L": [["학생용", "../학습지/2_물리교육론/2021/PTE-2021-A-06_학생용.html"], ["교사용", "../학습지/2_물리교육론/2021/PTE-2021-A-06_교사용.html"], ["원문 PDF", "../문항모음/2021_중등1차_물리_전공A.pdf#page=4"]], "au": false, "bd": false}, {"id": "PTE-2021-B-01", "c": "2021 1차 전공B 1번", "mj": "물리교육론", "ms": ["물리교육론", "현대물리학"], "g": "물리교육론", "y": 2021, "t": "선 스펙트럼 수업 — 성취기준의 ‘불연속적인 에너지 준위’와 오수벨의 선행조직자", "s": "2021학년도 1차 전공B 1번 · 난이도 ★☆☆☆☆ · 5.2.2.1 보어 원자 모형과 수소 스펙트럼 · [12물리Ⅰ02-02] 원자 내의 전자는 불연속적인(양자화된) 에너지 준위를 가지고 있음을 스펙트럼 관찰로 설명. 선행조직자 = 새 내용보다 포괄적인 도입 내용 — 절차 1 ‘스펙트럼 개념 소개’(빛의 색은 파장, ", "tg": ["5.2.2.1 보어 원자 모형과 수소 스펙트럼", "E1 과학과 교육과정", "E2 학습 이론", "스펙트럼", "에너지 준위", "원자 모형"], "a": "㉠ 불연속적인(양자화된) 에너지 준위 / 선행조직자 절차 1 ‘스펙트럼 개념 소개’: 햇빛이 프리즘을 통과해 색에 따라 나뉜 띠가 스펙트럼이며, 빛의 색은 파장에 의해 결정되고 파장은 빛의 에너지와 관련 있다는 내용", "th": "../학습지/_썸네일/PTE-2021-B-01.png", "L": [["학생용", "../학습지/2_물리교육론/2021/PTE-2021-B-01_학생용.html"], ["교사용", "../학습지/2_물리교육론/2021/PTE-2021-B-01_교사용.html"], ["원문 PDF", "../문항모음/2021_중등1차_물리_전공B.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2021-B-03", "c": "2021 1차 전공B 3번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2021, "t": "진폭에 따른 단진자 주기 측정 — 10회 왕복 측정, 실험 주의점, 증거 기반 논증", "s": "2021학년도 1차 전공B 3번 · 난이도 ★★☆☆☆ · 1.4.1.2 단진자와 물리 진자 · 10회 왕복 시간 측정 → 초시계 시작·정지의 반응 시간 오차가 10회에 한 번만 들어가 주기의 상대 오차가 1/10. 실제로 큰 진폭에서는 주기가 길어진다: T\\approx T_0\\left(1+\\dfrac{\\the", "tg": ["1.4.1.2 단진자와 물리 진자", "E4 과학 탐구와 과학적 사고", "E7 실험 지도와 평가", "E1 과학과 교육과정", "단진자", "측정과 오차", "실험 결론"], "a": "(1) 초시계를 누르는 시점의 오차(반응 시간)는 측정 횟수와 관계없이 한 번만 포함되므로, 10회 왕복 시간을 재어 10으로 나누면 주기 측정의 오차(상대 오차)를 1/10로 줄일 수 있다. / (2) 진폭이 커지면 주기가 길어지므로(결과 20.1 → 21.1 s), 단진자의 주기를 측정할 때는 실과 연직선의 각도를 작게(약 10° 이하) 해야 한다. (또는: 추를 가만히 놓아 한 연직면에서 진동하게 하고, 최저점 통과 시점에 시간을 잰다.) / (3) 증거에 기초한 토론과 논증 — 두 학생이 같은 실험 결과(증거)를 근거로 각자의 결론(주기 일정 / 진폭이 클수록 증가)을 주장하고, 상대의 해석(오차라는 주장)을 반박하고 있기 때문", "th": "../학습지/_썸네일/PTE-2021-B-03.png", "L": [["학생용", "../학습지/2_물리교육론/2021/PTE-2021-B-03_학생용.html"], ["교사용", "../학습지/2_물리교육론/2021/PTE-2021-B-03_교사용.html"], ["원문 PDF", "../문항모음/2021_중등1차_물리_전공B.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2021-B-04", "c": "2021 1차 전공B 4번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2021, "t": "전구와 가변 저항의 병렬 회로 — 포퍼와 라카토스로 본 학생 반응, 건전지 내부 저항", "s": "2021학년도 1차 전공B 4번 · 난이도 ★★☆☆☆ · 3.2.1.2 키르히호프의 법칙과 직·병렬 회로 · A: 반증 사례 → 자신의 가설 폐기 = 포퍼의 반증주의. B: 옴의 법칙(견고한 핵)은 유지하고 다른 설명(보조 가설)을 찾음 = 라카토스. 내부 저항 r이 있으면 가변 저항 ↑ → 전체 전류 ↓ → Ir ↓ → ", "tg": ["3.2.1.2 키르히호프의 법칙과 직·병렬 회로", "3.2.1.1 전류, 저항, 옴의 법칙", "E5 과학의 본성과 과학사", "E3 오개념과 개념 변화", "E7 실험 지도와 평가", "병렬 회로", "옴의 법칙", "전지의 내부 저항"], "a": "㉠·㉡ ㉠ 반증 사례가 나타나자 자신의 가설(생각)을 폐기하고 새로운 가설을 찾으려 하므로 포퍼의 반증주의에 가깝다. ㉡ 불일치 사례에도 옴의 법칙(견고한 핵)은 유지하고, 결과를 설명할 다른 이유(보조 가설·보호대)를 찾으려 하므로 라카토스의 연구 프로그램 이론에 가깝다. / ㉢ 내부 저항을 무시할 수 없으면 가변 저항값을 크게 할 때 전구가 더 밝아진다. 합성 저항이 커져 전체 전류가 줄면 내부 저항에서의 전압 강하(Ir)가 줄어 단자 전압(전구 양단 전압 = ℰ − Ir)이 커지기 때문이다.", "th": "../학습지/_썸네일/PTE-2021-B-04.png", "L": [["학생용", "../학습지/2_물리교육론/2021/PTE-2021-B-04_학생용.html"], ["교사용", "../학습지/2_물리교육론/2021/PTE-2021-B-04_교사용.html"], ["원문 PDF", "../문항모음/2021_중등1차_물리_전공B.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2021-B-05", "c": "2021 1차 전공B 5번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2021, "t": "정지 마찰력 오개념과 비유 전략 — 정착 예(요철), 포스너의 그럴듯함, 다리 연결 비유", "s": "2021학년도 1차 전공B 5번 · 난이도 ★★☆☆☆ · 1.1.2.3 마찰력과 구심력 운동 · 정착 예(anchoring example): 학생이 직관적으로 옳게 이해하는 상황 — 맞물린 두 요철(위 요철을 당길 때 아래 요철이 반대 방향으로 같은 크기로 방해). 학생 B는 상자와 요철이 비슷하다고 받아들이지", "tg": ["1.1.2.3 마찰력과 구심력 운동", "E3 오개념과 개념 변화", "E6 과학 수업 모형과 교수 전략", "마찰력", "힘의 평형", "비유"], "a": "(1) 바닥에 고정된 아래쪽 요철과 맞물린 위쪽 요철을 오른쪽으로 당기는 상황(아래 요철이 같은 크기의 힘으로 반대 방향으로 방해함) / (2) 그럴듯함(plausibility). 학생 A는 요철과 상자 상황이 닮았다고 받아들였지만, 학생 B는 비유를 이해하면서도 ‘요철은 튀어나온 부분에서만, 상자는 바닥 전체에서 힘을 받는다’며 두 상황이 같다고 믿지 못하므로, 비유가 학생 B에게 그럴듯하게(믿을 만하게) 받아들여져야 한다. / (3) 면 전체에 작은 요철이 무수히 있는 상황: 거친 사포 두 장(또는 칫솔 두 개의 솔)을 맞대고 위쪽을 당기는 상황, 상자 바닥과 바닥면을 확대하면 미세한 요철이 면 전체에서 맞물려 있는 그림", "th": "../학습지/_썸네일/PTE-2021-B-05.png", "L": [["학생용", "../학습지/2_물리교육론/2021/PTE-2021-B-05_학생용.html"], ["교사용", "../학습지/2_물리교육론/2021/PTE-2021-B-05_교사용.html"], ["원문 PDF", "../문항모음/2021_중등1차_물리_전공B.pdf#page=4"]], "au": false, "bd": false}, {"id": "PTE-2020-A-01", "c": "2020 1차 전공A 1번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2020, "t": "2015 개정 물리학Ⅱ 내용 체계 — 자기력선과 과학적 의사소통 능력", "s": "2020학년도 1차 전공A 1번 · 난이도 ★☆☆☆☆ · 3.2.2.2 비오-사바르 법칙과 앙페르 법칙 · 2015 개정 과학과 핵심역량: 과학적 사고력, 과학적 탐구 능력, 과학적 문제 해결력, 과학적 의사소통 능력, 과학적 참여와 평생 학습 능력. 물리학Ⅱ 내용 요소 ‘전류에 의한 자기장, 자기력선’.", "tg": ["3.2.2.2 비오-사바르 법칙과 앙페르 법칙", "E1 과학과 교육과정", "교육과정", "자기력선", "핵심역량"], "a": "㉠ 자기력선 / ㉡ 과학적 의사소통 능력", "th": "../학습지/_썸네일/PTE-2020-A-01.png", "L": [["학생용", "../학습지/2_물리교육론/2020/PTE-2020-A-01_학생용.html"], ["교사용", "../학습지/2_물리교육론/2020/PTE-2020-A-01_교사용.html"], ["원문 PDF", "../문항모음/2020_중등1차_물리_전공A.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2020-A-05", "c": "2020 1차 전공A 5번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학", "파동 및 광학"], "g": "물리교육론", "y": 2020, "t": "태양 전지 탐구 계획서 평가 — 조작적 정의와 전압 측정 방법", "s": "2020학년도 1차 전공A 5번 · 난이도 ★★☆☆☆ · 3.2.1.1 전류, 저항, 옴의 법칙 · 조작적 정의: 측정하기 어려운 변인(빛의 세기)을 측정·조작 가능한 절차(태양 전지 면의 기울기 각도)로 정의. 측정: 전압은 측정 대상(저항기)에 병렬, 전류는 직렬.", "tg": ["3.2.1.1 전류, 저항, 옴의 법칙", "4.2.1.1 반사의 법칙과 스넬의 법칙", "E4 과학 탐구와 과학적 사고", "E7 실험 지도와 평가", "탐구 설계", "변인", "전압계·전류계 연결"], "a": "(1) 근거: (마) ‘태양 전지 면과 수평면이 이루는 각도를 0°, 30°, 60°로 변화시키며(거리 일정)’. 이유: 직접 측정하기 어려운 조작 변인 ‘빛의 세기’를 각도기로 측정할 수 있는 ‘태양 전지 면의 기울기 각도’로 정의했기 때문(각도가 클수록 태양 전지 면이 받는 빛의 세기가 감소). / (2) 근거: (라). 수정: ‘디지털 멀티미터를 저항기(태양 전지)에 병렬로 연결하여 전압을 측정한다.’", "th": "../학습지/_썸네일/PTE-2020-A-05.png", "L": [["학생용", "../학습지/2_물리교육론/2020/PTE-2020-A-05_학생용.html"], ["교사용", "../학습지/2_물리교육론/2020/PTE-2020-A-05_교사용.html"], ["원문 PDF", "../문항모음/2020_중등1차_물리_전공A.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2020-A-06", "c": "2020 1차 전공A 6번", "mj": "물리교육론", "ms": ["물리교육론", "파동 및 광학"], "g": "물리교육론", "y": 2020, "t": "결정적 실험 — 베이컨의 조건, 라카토스의 연구 프로그램, 쿤의 변칙 사례", "s": "2020학년도 1차 전공A 6번 · 난이도 ★★☆☆☆ · 4.2.1.1 반사의 법칙과 스넬의 법칙 · 결정적 실험: 경쟁하는 두 이론이 서로 다른 결과를 예측하고, 실험 결과가 한 이론의 예측과만 일치할 때. 라카토스: 연구 프로그램 = 견고한 핵 + 보호대(보조 가설) → 반증되면 보호대를 수정. 쿤: 패러다임으로", "tg": ["4.2.1.1 반사의 법칙과 스넬의 법칙", "E5 과학의 본성과 과학사", "과학의 본성", "과학사", "이론 선택"], "a": "㉠ 두 이론 중 한 이론의 예측과는 일치하고 다른 이론의 예측과는 일치하지 않(는 결과가 나오)면 — 즉 두 이론이 서로 다른 결과를 예측하고 실험 결과가 그중 하나와만 일치 / ㉡ 라카토스에 따르면 이론(연구 프로그램)은 견고한 핵과 이를 둘러싼 보호대(보조 가설)로 이루어져 있어, 반증 사례가 나오면 견고한 핵이 아니라 보호대의 보조 가설을 수정하여 반증을 흡수하므로 곧바로 폐기되지 않는다(프로그램은 진보적/퇴행적인지로 장기적으로 평가됨). / ㉢ 변칙 사례 (이상 현상, anomaly)", "th": "../학습지/_썸네일/PTE-2020-A-06.png", "L": [["학생용", "../학습지/2_물리교육론/2020/PTE-2020-A-06_학생용.html"], ["교사  바르게 변환하여 나타냄 / ㉣ 그래프에서 이동 거리가 속력의 제곱에 비례한다는 관계를 찾고, 이를 근거로 수레가 등가속도 운동을 했다는 결론을 제시함", "th": "../학습지/_썸네일/PTE-2019-B-01.png", "L": [["학생용", "../학습지/2_물리교육론/2019/PTE-2019-B-01_학생용.html"], ["교사용", "../학습지/2_물리교육론/2019/PTE-2019-B-01_교사용.html"], ["원문 PDF", "../문항모음/2019_중등1차_물리_전공B.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2019-B-02", "c": "2019 1차 전공B 2번", "mj": "물리교육론", "ms": ["물리교육론", "파동 및 광학"], "g": "물리교육론", "y": 2019, "t": "빛과 그림자 오개념과 발생학습 모형 — 직선 광원이 만드는 원형 물체의 그림자", "s": "2019학년도 1차 전공B 2번 · 난이도 ★★☆☆☆ · 4.2.1.1 반사의 법칙과 스넬의 법칙 · 오개념 ㉠: ‘그림자의 모양은 (광원과 관계없이) 항상 물체의 모양과 같다’. 실제로 그림자는 광원의 각 점에서 물체에 가려진 영역들의 겹침이므로 광원의 모양·크기에 영향을 받는다 — 직선 광원이면 원형 물체의 그림", "tg": ["4.2.1.1 반사의 법칙과 스넬의 법칙", "E3 오개념과 개념 변화", "E6 과학 수업 모형과 교수 전략", "빛의 직진", "그림자"], "a": "㉠ 그림자(또는 구멍을 지난 빛)의 모양은 광원의 모양과 관계없이 항상 물체(구멍)의 모양과 같다 / 도전 단계 ① 초점 단계에서 작성한 모둠별 예상과 이유를 발표하고 서로 비교·토론한다. ② 시범 실험으로 실제 그림자를 관찰해 예상과 비교(인지 갈등)하고, 교사가 직선 광원을 점광원들의 모임으로 보고 각 점광원에서 빛의 직진으로 생긴 그림자들이 겹쳐 길쭉한 모양이 됨을 작도로 제시한다. / 그림자 놀이 그림자는 빛이 직진하다 물체에 가려 생기며, 광원의 각 점이 만든 그림자의 겹침이다. 그림자 놀이에서는 광원이 매우 작아(점광원) 그림자들이 거의 일치하므로 물체 모양과 같은 그림자가 생긴다. 광원의 크기·모양이 커지면 그림자 모양도 달라진다.", "th": "../학습지/_썸네일/PTE-2019-B-02.png", "L": [["학생용", "../학습지/2_물리교육론/2019/PTE-2019-B-02_학생용.html"], ["교사용", "../학습지/2_물리교육론/2019/PTE-2019-B-02_교사용.html"], ["원문 PDF", "../문항모음/2019_중등1차_물리_전공B.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2019-B-08", "c": "2019 1차 전공B 8번", "mj": "물리교육론", "ms": ["물리교육론", "현대물리학", "전자기학"], "g": "물리교육론", "y": 2019, "t": "수업 상황과 20세기 초 원자 모형 발전사 — 모형의 개발과 사용, 유추적 사고, 라카토스 연구 프로그램", "s": "2019학년도 1차 전공B 8번 · 난이도 ★★★☆☆ · 5.2.2.1 보어 원자 모형과 수소 스펙트럼 · (가) 학생은 기체 분자를 알갱이로 표현 → 기능 모형의 개발과 사용; 러더퍼드의 태양계 원자 모형(보이지 않는 원자 구조를 설명). (나) 앙페르 법칙의 관계를 유도 전류에 옮김 → 유추적 사고(친숙한 근원 영역의", "tg": ["5.2.2.1 보어 원자 모형과 수소 스펙트럼", "3.1.1.1 쿨롱의 법칙과 전하 보존", "E5 과학의 본성과 과학사", "E4 과학 탐구와 과학적 사고", "E3 오개념과 개념 변화", "원자 모형", "과학사", "정전기 유도"], "a": "(가) 모형의 개발과 사용. 러더퍼드가 α 입자 산란을 설명하기 위해 무거운 핵 주위를 전자가 도는 태양계 원자 모형을 제안한 사례 — 모형이 보이지 않는 원자 구조를 표현하여 관찰 현상 리교육론/2018/PTE-2018-B-02_학생용.html"], ["교사용", "../학습지/2_물리교육론/2018/PTE-2018-B-02_교사용.html"], ["원문 PDF", "../문항모음/2018_중등1차_물리_전공B.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2018-B-08", "c": "2018 1차 전공B 8번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2018, "t": "‘가속도에 영향을 주는 요인’ 수업 — 가설 검증 학습 모형, 피아제·오수벨 관점, 변인 통제", "s": "2018학년도 1차 전공B 8번 · 난이도 ★★★☆☆ · 1.1.2.1 관성계와 제1·2·3법칙 · 수업은 가설 검증(탐구) 학습 모형: 탐색 및 문제 파악 → 가설 설정 → 실험 설계 → 실험 → 가설 검증(자료 해석) → 적용. ㉠ 가설: ‘질량이 일정할 때 물체에 작용하는 힘이 클수록 가속도가 크다(가속도는 ", "tg": ["1.1.2.1 관성계와 제1·2·3법칙", "E6 과학 수업 모형과 교수 전략", "E2 학습 이론", "E4 과학 탐구와 과학적 사고", "뉴턴 제2법칙", "변인 통제", "실험 설계"], "a": "(1) 가설 검증 학습 모형(문제 파악–가설 설정–실험 설계–실험–가설 검증–적용). ㉠: 질량이 일정할 때 물체에 작용하는 힘이 클수록 물체의 가속도가 크다. / (2) 기존 오개념으로 실험 결과를 동화하지 못해 인지 불평형(인지 갈등)이 생기고, 인지 구조를 조절하여 힘과 가속도의 관계를 받아들이며 새로운 평형에 이르는 평형화 과정으로 개념을 획득한다. / (3) 학생의 인지 구조에 이미 있는 일상 경험(관련 정착 지식)과 새 개념을 연결해 학습 과제가 학생에게 의미를 갖게(심리적 유의미가를 갖게) 하기 위해서이다. / (4) 변인 통제는 형식적 조작기의 사고 능력이 필요한데, 학생들이 아직 구체적 조작기 수준에 머물러 있기 때문이다. / (5) 조작변인: 힘(매단 추의 무게), 종속변인: 가속도, 통제", "th": "../학습지/_썸네일/PTE-2018-B-08.png", "L": [["학생용", "../학습지/2_물리교육론/2018/PTE-2018-B-08_학생용.html"], ["교사용", "../학습지/2_물리교육론/2018/PTE-2018-B-08_교사용.html"], ["원문 PDF", "../문항모음/2018_중등1차_물리_전공B.pdf#page=5"]], "au": false, "bd": false}, {"id": "PTE-2017-A-01", "c": "2017 1차 전공A 1번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2017, "t": "2015 개정 과학과 교육과정 — ‘과학’ 교과의 성격(핵심 역량)과 내용 체계(핵심 개념)", "s": "2017학년도 1차 전공A 1번 · 난이도 ★☆☆☆☆ · 1.1.1.2 등가속도 직선운동 및 자유낙하 · 2015 개정 교육과정은 과학과 핵심 역량(과학적 사고력, 과학적 탐구 능력, 과학적 문제 해결력, 과학적 의사소통 능력, 과학적 참여와 평생 학습 능력)을 기르는 것을 성격에 밝히고, 내용 체계를 영역 – 핵심 개", "tg": ["1.1.1.2 등가속도 직선운동 및 자유낙하", "1.1.2.1 관성계와 제1·2·3법칙", "E1 과학과 교육과정", "과학과 교육과정", "등속 운동", "자유 낙하"], "a": "㉠ 핵심 역량 / ㉡ 핵심 개념", "th": "../학습지/_썸네일/PTE-2017-A-01.png", "L": [["학생용", "../학습지/2_물리교육론/2017/PTE-2017-A-01_학생용.html"], ["교사용", "../학습지/2_물리교육론/2017/PTE-2017-A-01_교사용.html"], ["원문 PDF", "../문항모음/2017_중등1차_물리_전공A.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2017-A-09", "c": "2017 1차 전공A 9번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2017, "t": "단진자에 작용하는 힘 평가 — 평가 기준표 보완(장력과 중력의 상대적 크기)과 분석적 채점의 이점", "s": "2017학년도 1차 전공A 9번 · 난이도 ★★☆☆☆ · 1.4.1.2 단진자와 물리 진자 · 평가 목표가 ‘힘의 상대적인 크기와 방향’이므로, 기준표에 장력과 중력의 크기 비교가 있어야 한다: 최고점 A·B에서 T=mg\\cos\\theta_0\\lt mg, 최저점 O에서 T=mg(3-2\\cos\\theta_0)\\", "tg": ["1.4.1.2 단진자와 물리 진자", "1.1.2.2 중력, 수직항력, 장력", "E7 실험 지도와 평가", "E3 오개념과 개념 변화", "단진자", "장력과 중력", "원운동"], "a": "(1) ① A, B에서 장력의 크기를 중력의 크기보다 작게 그렸는가? ② O에서 장력의 크기를 중력의 크기보다 크게(또는 A·B의 장력보다 크게) 그렸는가? / (2) 채점 기준이 구체적이어서 채점의 객관성(신뢰도)이 높아지고, 학생이 어떤 요소를 이해하지 못했는지(예: 최저점에서 장력 = 중력이라는 오개념) 구체적으로 진단해 피드백할 수 있다.", "th": "../학습지/_썸네일/PTE-2017-A-09.png", "L": [["학생용", "../학습지/2_물리교육론/2017/PTE-2017-A-09_학생용.html"], ["교사용", "../학습지/2_물리교육론/2017/PTE-2017-A-09_교사용.html"], ["원문 PDF", "../문항모음/2017_중등1차_물리_전공A.pdf#page=5"]], "au": false, "bd": false}, {"id": "PTE-2017-B-01", "c": "2017 1차 전공B 1번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학", "역학"], "g": "물리교육론", "y": 2017, "t": "마찰력에 이어 자기력 배우기 — 오수벨 동화 이론의 병렬적(조합적) 학습", "s": "2017학년도 1차 전공B 1번 · 난이도 ★★☆☆☆ · 3.2.2.1 자기력과 로렌츠 힘 · 오수벨 동화 이론의 유의미 학습 유형: 종속적(하위) 학습(새 개념이 기존의 상위 개념 아래로 포섭), 상위적 학습(새 개념이 기존 개념들을 포괄), 병렬적(조합적) 학습(새 개념이 기존 개념과 같은 수준에서 공통점", "tg": ["3.2.2.1 자기력과 로렌츠 힘", "1.1.2.3 마찰력과 구심력 운동", "E2 학습 이론", "자기력", "마찰력", "힘의 종류"], "a": "(1) 병렬적 학습(조합적 학습, combinatorial learning) / (2) 마찰력과 자기력은 모두 ‘힘’의 하위 개념으로 위계가 같다. 새 개념(자기력)이 기존 개념(마찰력)에 포섭되거나 그것을 포괄하지 않고, 공통점(물체 사이에 작용, 운동과 관련)과 차이점(자석이 있어야 하고 떨어져서도 작용)을 비교하며 대등한 수준에서 관련지어 학습되므로 병렬적 학습이다.", "th": "../학습지/_썸네일/PTE-2017-B-01.png", "L": [["학생용", "../학습지/2_물리교육론/2017/PTE-2017-B-01_학생용.html"], ["교사용", "../학습지/2_물리교육론/2017/PTE-2017-B-01_교사용.html"], ["원문 PDF", "../문항모음/2017_중등1차_물리_전공B.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2017-B-02", "c": "2017 1차 전공B 2번", "mj": "물리교육론", "ms": ["물리교육론", "열역학 및 통계물리", "역학"], "g": "물리교육론", "y": 2017, "t": "‘미래 사회의 에너지 문제’ 탐구 — 직소(Jigsaw) 협동 학습과 기초 탐구 과정(의사소통)", "s": "2017학년도 1차 전공B 2번 · 난이도 ★★☆☆☆ · 2.1.2.2 열전달 메커니즘 (전도, 대류, 복사) · 직소(Jigsaw): 모집단(원래 모둠)의 각 구성원이 서로 다른 소주제를 맡아 같은 주제의 전문가 집단에서 조사·토의한 뒤 원래 모둠으로 돌아가 가르치고 공유한다 — 구성원 간 상호 의존성. 기초 탐구 과정(관찰·", "tg": ["2.1.2.2 열전달 메커니즘 (전도, 대류, 복사)", "1.2.1.3 역학적 에너지 보존과 비보존력", "E6 과학 수업 모형과 교수 전략", "E4 과학 탐구와 과학적 사고", "에너지 문제", "화석 연료", "협동 학습"], "a": "(1) 직소(Jigsaw) 모형 / (2) 의사소통 / (3) 모둠원마다 서로 다른 주제를 조사했기 때문에, 전문가 집단에서 발표·토의하고 원래 모둠으로 돌아가 자신이 조사한 내용을 다른 모둠원에게 설명하고 서로의 생각을 이해·존중하며 토의(대표 발표)해야 주제 4를 해결할 수 있다. 즉 정보를 주고받는 의사소통이 적극적 상호 작용의 바탕이다.", "th": "../학습지/_썸네일/PTE-2017-B-02.png", "L": [["학생용", "../학습지/2_물리교육론/2017/PTE-2017-B-02_학생용.html"], ["교사용", "../학습지/2_물리교육론/2017/PTE-2017-B-02_교사용.html"], ["원문 PDF", "../문항모음/2017_중등1차_물리_전공B.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2017-B-08", "c": "2017 1차 전공B 8번", "mj": "물리교육론", "ms": ["물리교육론", "현대물리학"], "g": "물리교육론", "y": 2017, "t": "광전 효과를 ‘바구니 속 구슬’로 설명하기 — 비유 수업 전략의 장점·한계·효과적 사용 조건", "s": "2017학년도 1차 전공B 8번 · 난이도 ★★★☆☆ · 5.1.2.2 광전 효과와 광자 · 비유(analogy): 낯선 목표 개념(광전 효과)을 친숙한 비유물(구슬 맞히기)과 구조적으로 대응시켜 설명하는 전략. 장점: 추상적·비가시적 개념을 구체화해 이해와 흥미를 돕는다. 한계: 대응하지 않는 속성이 오개", "tg": ["5.1.2.2 광전 효과와 광자", "E6 과학 수업 모형과 교수 전략", "E3 오개념과 개념 변화", "광전 효과", "일함수", "빛의 입자성"], "a": "(1) 비유(유추) 전략 — 낯선 목표 개념(광전 효과)을 학생에게 친숙한 비유물(구슬 맞히기)과 대응시켜 설명하는 전략 / (2) 눈에 보이지 않는 추상적 개념(일함수, 임계 진동수)을 친숙한 구슬·바구니 높이로 구체화하여, ‘문턱 에너지를 넘어야 전자가 나오고 빛의 세기(구슬의 수)와는 무관하다’는 관계를 쉽게 이해하게 한다(흥미·동기 유발). / (3) 비유물과 목표물의 대응하지 않는 속성 때문에 오개념이 생길 수 있다. 예: 임계 진동수를 구슬의 ‘속력’에 대응시켜 ‘진동수가 큰 빛은 더 빠르다’고 생각하거나, 충돌 후에도 남는 구슬처럼 광자가 흡수되지 않고 튕겨 나간다고 생각할 수 있다. / (4) ① 학생이 비유물(구슬, 바구니)에 친숙해야 한다. ② 비유물과 목표 개념의 대응 관계를 명확히 하고", "th": "../학습지/_썸네일/PTE-2017-B-08.png", "L": [["학생용", "../학습지/2_물리교육론/2017/PTE-2017-B-08_학생용.html"], ["교사용", "../학습지/2_물리교육론/2017/PTE-2017-B-08_교사용.html"], ["원문 PDF", "../문항모음/2017_중등1차_물리_전공B.pdf#page=5"]], "au": false, "bd": false}, {"id": "PTE-2016-A-01", "c": "2016 1차 전공A 1번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2016, "t": "정전기 유도 수업 — 5E 모형 단계 배열과 참여 단계 (2) 고무풍선 하나는 털가죽, 다른 하나는 비닐 랩(PVC)으로 문질러 가까이하면 서로 끌어당긴다 — 같은 고무풍선이 상대에 따라 (−)도 (+)도 되므로 ‘고무풍선은 본래 음전기’라는 생각과 상충", "th": "../학습지/_썸네일/PTE-2014-A-16.png", "L": [["학생용", "../학습지/2_물리교육론/2014/PTE-2014-A-16_학생용.html"], ["교사용", "../학습지/2_물리교육론/2014/PTE-2014-A-16_교사용.html"], ["원문 PDF", "../문항모음/2014_중등1차_물리_전공A.pdf#page=5"]], "au": false, "bd": false}, {"id": "PTE-2014-A-17", "c": "2014 1차 전공A 17번", "mj": "물리교육론", "ms": ["물리교육론", "파동 및 광학"], "g": "물리교육론", "y": 2014, "t": "볼록렌즈에 의한 상 — 순환학습 모형의 빠진 단계(개념 도입) 설계 (서술형 2번)", "s": "2014학년도 1차 전공A 17번 · 난이도 ★★☆☆☆ · 4.2.1.3 렌즈 방정식과 광학 기기 · 순환학습(Karplus): 탐색(학생이 구체적 경험·자료 수집) → 개념 도입(교사가 탐색 결과를 바탕으로 새 개념·용어를 도입·설명) → 개념 적용(새 상황에 적용). 단계 A는 물방울 렌즈 관찰(B) 결과를 정리", "tg": ["4.2.1.3 렌즈 방정식과 광학 기기", "E6 과학 수업 모형과 교수 전략", "볼록 렌즈", "상의 배율"], "a": "(1) 개념 도입 단계 (용어 도입 단계) / (2) B에서 관찰한 결과(물방울·렌즈에 따라 확대 정도가 다름)를 학생이 발표하게 하고, 교사가 이를 바탕으로 볼록 렌즈의 초점·초점거리·상의 배율 개념과 렌즈 공식(1/a + 1/b = 1/f, m = b/a)을 도입·설명한다", "th": "../학습지/_썸네일/PTE-2014-A-17.png", "L": [["학생용", "../학습지/2_물리교육론/2014/PTE-2014-A-17_학생용.html"], ["교사용", "../학습지/2_물리교육론/2014/PTE-2014-A-17_교사용.html"], ["원문 PDF", "../문항모음/2014_중등1차_물리_전공A.pdf#page=6"]], "au": false, "bd": false}, {"id": "PTE-2014-B-01", "c": "2014 1차 전공B 1번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2014, "t": "“무거운 물체가 먼저 떨어진다” — 라카토스의 발견법과 개념 변화가 일어나지 않은 이유", "s": "2014학년도 1차 전공B 1번 · 난이도 ★★★☆☆ · 1.1.1.2 등가속도 직선운동 및 자유낙하 · 라카토스 연구프로그램: 견고한 핵(포기하지 않는 핵심 가정) + 보호대(보조 가설). 부정적 발견법 = 반증을 핵이 아닌 보호대로 돌려 핵을 지키라는 규칙, 긍정적 발견법 = 보호대를 수정·발전시켜 프로그램을 확장하", "tg": ["1.1.1.2 등가속도 직선운동 및 자유낙하", "1.1.2.1 관성계와 제1·2·3법칙", "E5 과학의 본성과 과학사", "E3 오개념과 개념 변화", "자유 낙하", "공기 저항"], "a": "(1) 부정적 발견법 — 영희: 반증 사례를 예외로 처리하여 견고한 핵을 반증으로부터 보호(핵을 수정하지 않음) / 긍정적 발견법 — 민수: 보조 가설(공기 저항)로 보호대를 수정·확장하여 반증을 설명하고 새로운 예측을 제시 / (2) ① 영희처럼 반증 사례를 예외로 처리하여 인지 갈등을 느끼지 않음(갈등 회피·무시) ② 민수처럼 갈등을 느껴도 보조 가설(공기 저항)을 도입해 갈등을 해소하여 기존 개념(견고한 핵)을 그대로 유지함", "th": "../학습지/_썸네일/PTE-2014-B-01.png", "L": [["학생용", "../학습지/2_물리교육론/2014/PTE-2014-B-01_학생용.html"], ["교사용", "../학습지/2_물리교육론/2014/PTE-2014-B-01_교사용.html"], ["원문 PDF", "../문항모음/2014_중등1차_물리_전공B.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2013-2-1-01", "c": "2013 2차 논술형 1교시 1번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2013, "t": "에너지 오개념과 초인지를 통한 개념 변화 수업 + 도르래의 회전과 일–에너지 정리", "s": "2013학년도 2차 논술형 1교시 1번 · 난이도 ★★★☆☆ · 1.2.1.1 일과 운동에너지 정리 · 과학적 에너지 개념: 에너지는 보존되며 형태만 바뀐다(‘소모’ ✗), 힘과 에너지는 다른 물리량(벡터 N vs 스칼라 J). 초인지 개념 변화: (가) 자기 생각 인식 → (나) 정보와 비교·점검 → (다) 갈등 해", "tg": ["1.2.1.1 일과 운동에너지 정리", "1.3.1.2 관성모멘트와 회전운동에너지", "1.2.1.3 역학적 에너지 보존과 비보존력", "E3 오개념과 개념 변화", "E2 학습 이론", "E6 과학 수업 모형과 교수 전략", "에너지", "오개념", "초인지", "도르래", "일과 에너지"], "a": "1-1 ⑴ 영희: 에너지가 ‘소모’되어 사라진다는 생각 — 에너지는 보존되고 형태만 전환된다. 민수: 힘과 에너지를 같은 것으로 봄 — 힘은 작용(N, 벡터), 에너지는 일을 할 수 있는 능력(J, 스칼라), 힘이 한 일만큼 에너지가 전달된다. (철수의 진술은 음식의 화학 에너지가 몸으로 전달·저장되는 것으로 과학적 설명이 가능) / 1-1 ⑵ (가) 인식 — “에너지에 대한 내 생각은 무엇인가?” (나) 점검 — “내 생각이 제시된 정보(에너지 보존)와 맞는가, 어디가 모순인가?” (다) 조절 — “모순을 해결하려면 어떤 근거·활동이 필요한가, 생각을 어떻게 고칠까?” (라) 평가·반성 — “새 개념으로 처음 현상을 설명할 수 있는가, 내 생각은 어떻게 바뀌었나?” / 1-1 ⑶ ① 에너지 전환 실험·시연", "th": "../학습지/_썸네일/PTE-2013-2-1-01.png", "L": [["학생용", "../학습지/2_물리교육론/2013/PTE-2013-2-1-01_학생용.html"], ["교사용", "../학습지/2_물리교육론/2013/PTE-2013-2-1-01_교사용.html"]], "au": false, "bd": false}, {"id": "PTE-2013-2-2-03", "c": "2013 2차 논술형 2교시 3번", "mj": "물리교육론", "ms": ["물리교육론", "현대물리학", "파동 및 광학"], "g": "물리교육론", "y": 2013, "t": "데이비슨–저머 실험 수업의 반성 — 모의실험·귀추·순환학습, 5E 재구성, 비고츠키 모둠 활동 + 정방 결정의 X선 회절", "s": "2013학년도 2차 논술형 2교시 3번 · 난이도 ★★★☆☆ · 5.2.1.1 드브로이 파장과 물질파 · 순환학습(탐색–개념 소개–개념 적용) → 5E(참여–탐색–설명–정교화–평가). 귀추: 유사한 현상(X선 회절)의 설명을 빌려 가설(전자의 파동성) 생성 — 원천(source) 지식이 필요. 비고츠키: 근접발달영역(Z", "tg": ["5.2.1.1 드브로이 파장과 물질파", "4.2.2.3 단일 슬릿 회절과 회절 격자", "5.1.2.3 X선 생산과 컴프턴 산란", "E6 과학 수업 모형과 교수 전략", "E2 학습 이론", "E4 과학 탐구와 과학적 사고", "물질파", "X선 회절", "수업 모형", "협동 학습"], "a": "3-1 ⑴ ① 모의실험: 흥미 위주로 끝나 X선 회절 사진·실험 결과와 연결되지 않아 참여도 저하(시각화가 오히려 ‘전자가 출렁이며 진행’한다는 오해 유발). ② 귀추적 사고: 빌려 올 설명(X선 회절·파동의 회절 조건)에 대한 사전 지식과 유사성 발견을 돕는 비계가 부족해 일부 학생이 가설을 생성하지 \,dB/dt+B\\,dA/dt), A=lx → \\mathcal E=Blv. 장치: 균일 자기장 전자석(+테슬라미터), ㄷ자 레일과 미끄럼 막대, 전압 센서. 실험 1: A ", "th": "../학습지/_썸네일/PTE-2009-2-2-03.png", "L": [["학생용", "../학습지/2_물리교육론/2009/PTE-2009-2-2-03_학생용.html"], ["교사용", "../학습지/2_물리교육론/2009/PTE-2009-2-2-03_교사용.html"]], "au": false, "bd": false}, {"id": "PTE-2008-01", "c": "2008 전공 서술형 1번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2008, "t": "과학적 가설의 조건 — 검증 가능성과 ‘잠정적 설명’으로 가설 아닌 진술 가려내기", "s": "2008학년도 전공 서술형 1번 · 난이도 ★★☆☆☆ · 1.1.1.2 등가속도 직선운동 및 자유낙하 · 과학적 가설 = 관찰된 현상(문제)에 대한 잠정적인 설명·답으로, 실험·관찰로 검증(반증) 가능해야 한다. A: 태양계 밖 우주 전체를 조사할 수 없어 ‘존재하지 않는다’를 검증할 수 없음(+ 자료 조사로 ‘증명’하", "tg": ["1.1.1.2 등가속도 직선운동 및 자유낙하", "E4 과학 탐구와 과학적 사고", "E5 과학의 본성과 과학사", "가설", "탐구", "자유 낙하"], "a": "① 학생 A 학생 A — 태양계 밖 우주 전체를 조사할 수 없어 ‘지적 생명체가 존재하지 않는다’는 진술은 실험·관찰로 검증할 수 없다(자료 조사로는 증명 불가). 과학적 가설은 경험적으로 검증 가능해야 한다. / ② 학생 C 학생 C — 4 ℃에서 밀도가 최대라는 것은 이미 실험으로 확인한 결과(관찰 사실)를 진술한 것으로, 검증 전의 잠정적 설명이 아니라 실험의 결론이다. (B는 검증 가능하므로 가설로 성립 — 실험 결과 기각될 뿐)", "th": "../학습지/_썸네일/PTE-2008-01.png", "L": [["학생용", "../학습지/2_물리교육론/2008/PTE-2008-01_학생용.html"], ["교사용", "../학습지/2_물리교육론/2008/PTE-2008-01_교사용.html"], ["원문 PDF", "../문항모음/2008_중등1차_물리_전공%20문제.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2008-02", "c": "2008 전공 서술형 2번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2008, "t": "진자의 주기 탐구 — 가설 진술과 변인 통제가 잘못된 실험 설계 고치기", "s": "2008학년도 전공 서술형 2번 · 난이도 ★☆☆☆☆ · 1.4.1.2 단진자와 물리 진자 · 한 번에 하나의 변인만 바꾸고(조작 변인) 나머지는 같게 유지(통제 변인)해야 결과의 원인을 판단할 수 있다. 가설 A: ‘실의 길이가 길수록 진자의 주기가 길어질 것이다’(조작 변인: 실의 길이, 종속 변인: 주기", "tg": ["1.4.1.2 단진자와 물리 진자", "E4 과학 탐구와 과학적 사고", "E7 실험 지도와 평가", "진자", "변인 통제", "가설"], "a": "가설 A “(추의 질량과 진폭이 같을 때) 실의 길이가 길수록 진자의 주기가 길어질 것이다.” — 조작 변인: 실의 길이, 종속 변인: 진자의 주기 / 수정된 실험 설계 추의 질량을 한 가지(예: 100 g)로 같게 하고(통제 변인), 실의 길이만 10, 20, 30, 40 cm로 바꾸어 4개의 진자를 만든 뒤, 같은 진폭에서 놓아 각각의 주기를 측정한다.", "th": "../학습지/_썸네일/PTE-2008-02.png", "L": [["학생용", "../학습지/2_물리교육론/2008/PTE-2008-02_학생용.html"], ["교사용", "../학습지/2_물리교육론/2008/PTE-2008-02_교사용.html"], ["원문 PDF", "../문항모음/2008_중등1차_물리_전공%20문제.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2008-03", "c": "2008 전공 서술형 3번", "mj": "물리교육론", "ms": ["물리교육론", "파동 및 광학"], "g": "물리교육론", "y": 2008, "t": "빛과 그림자 수업을 PEOE(예상–설명1–관찰–설명2) 모형으로 재구성하기", "s": "2008학년도 전공 서술형 3번 · 난이도 ★★☆☆☆ · 4.2.1.1 반사의 법칙과 스넬의 법칙 · PEOE: 예상(결과를 예측) → 설명 1(예상의 이유) → 관찰(실제 결과) → 설명 2(예상과 관찰의 차이를 설명하며 개념 수정). 물리: 크기가 있는 광원은 점광원의 모임 — 각 점광원이 만든 그림자가 겹쳐 그", "tg": ["4.2.1.1 반사의 법칙과 스넬의 법칙", "E6 과학 수업 모형과 교수 전략", "E3 오개념과 개념 변화", "빛의 직진", "그림자", "광원"], "a": "예상 단계 점광원이 아닌 광원으로 원형 물체를 비추면, 그림자의 모양은 물체의 모양(원형)과 똑같을 것이라고 예상한다. / 설명1 단계 그림자는 직진하는 빛을 물체가 가려서 생기므로, 그림자의 모양은 물체의 모양과 같을 것이라고 예상의 이유를 설명한다. / 관찰 단계 직선 모양의 광원으로 원형 물체를 비추었더니, 예상과 달리 스크린에 직선 모양(광원과 같은 방향으로 긴)의 그림자가 생겼다. / 설명2 단계 직선 모양의 광원은 점광원이 연속해서 이어진 것이므로, 각 점광원이 만든 원형 그림자가 위아래로 이어져 직선 모양의 그림자가 된다. 따라서 A: ‘그림자의 모양은 물체의 모양뿐 아니라 광원의 모양에 의해서도 결정된다.’", "th": "../학습지/_썸네일/PTE-2008-03.png", "L": [["학생용", "../학습지/2_물리교육론/2008/PTE-2008-03_학생용.html"], ["교사용", "../학습지/2_물리교육론/2008/PTE-2008-03_교사용.html"], ["원문 PDF", "../문항모음/2008_중등1차_물리_전공%20문제.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2008-04", "c": "2008 전공 서술형 4번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2008, "t": "건전지 병렬 연결 시범의 실패 — 내부 저항과 실험 조건 바꾸기", "s": "2008학년도 전공 서술형 4번 · 난이도 ★★☆☆☆ · 3.2.1.2 키르히호프의 법칙과 직·병렬 회로 · 실제 건전지 = 기전력 \\varepsilon + 내부 저항 r. 회로 1: I_1=\\dfrac{\\varepsilon}{R+r}, 회로 2(같은 전지 2개 병렬): I_2=\\dfrac{\\varepsilon}{R+r/2", "tg": ["3.2.1.2 키르히호프의 법칙과 직·병렬 회로", "3.2.1.1 전류, 저항, 옴의 법칙", "E7 실험 지도와 평가", "E5 과학의 본성과 과학사", "전지의 연결", "전류", "저항"], "a": "이유 건전지에는 내부 저항이 있는데, 외부 저항(1 Ω)이 내부 저항에 비해 충분히 크지 않아 병렬 연결로 전체 내부 저항이 절반으로 줄어든 효과가 커서 회로 전체 저항이 줄었기 때문이다(I_2=\\varepsilon/(R+r/2)&gt;I_1=\\varepsilon/(R+r)). / 바꿀 실험 조건 외부 저항을 건전지의 내부 저항보다 훨씬 큰 것(예: 1 Ω → 100 Ω 정도)으로 바꾸어 내부 저항의 영향을 무시할 수 있게 한다(전류계는 mA 범위로).", "th": "../학습지/_썸네일/PTE-2008-04.png", "L": [["학생용", "../학습지/2_물리교육론/2008/PTE-2008-04_학생용.html"], ["교사용", "../학습지/2_물리교육론/2008/PTE-2008-04_교사용.html"], ["원문 PDF", "../문항모음/2008_중등1차_물리_전공%20문제.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2008-05", "c": "2008 전공 서술형 5번", "mj": "물리교육론", "ms": ["물리교육론", "현대물리학"], "g": "물리교육론", "y": 2008, "t": "유리는 고체인가 — 분류 기준의 차이와 사회적 구성주의 관점의 교사 설명", "s": "2008학년도 전공 서술형 5번 · 난이도 ★★☆☆☆ · 5.2.2.3 고체물리 기초 (에너지 밴드와 반도체) · A의 기준: 단단하고 일정한 모양·크기 → 유리는 고체. B의 기준: 결정이 있어야 고체 → 유리는 고체 아님. 기준(정의)이 달라 논쟁. 사회적 구성주의: 과학 개념과 분류는 과학자 공동체가 사회적 상호작용·협상을", "tg": ["5.2.2.3 고체물리 기초 (에너지 밴드와 반도체)", "E2 학습 이론", "E5 과학의 본성과 과학사", "고체와 액체", "결정", "유리"], "a": "논쟁의 이유 학생 A는 ‘단단하고 일정한 모양·크기’를, 학생 B는 ‘결정의 유무’를 고체의 기준으로 삼아, 고체를 정의(분류)하는 기준이 서로 달랐기 때문이다. / 교사의 설명 “고체를 어떤 기준으로 정의하느냐에 따라 판단이 달라질 수 있어요. 과학 개념은 과학자 사회의 합의로 정해지는데, 현재 과학자들은 유리를 결정 구조는 없지만 단단하고 모양이 일정한 ‘비결정질 고체’로 분류하기로 합의했으니 A의 생각은 틀리지 않았어요.”", "th": "../학습지/_썸네일/PTE-2008-05.png", "L": [["학생용", "../학습지/2_물리교육론/2008/PTE-2008-05_학생용.html"], ["교사용", "../학습지/2_물리교육론/2008/PTE-2008-05_교사용.html"], ["원문 PDF", "../문항모음/2008_중등1차_물리_전공%20문제.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2008-06", "c": "2008 전공 서술형 6번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2008, "t": "표를 그래프로 — 속력–운동에너지 그래프 그리기와 지역별 강수량 그래프의 오류", "s": "2008학년도 전공 서술형 6번 · 난이도 ★☆☆☆☆ · 1.2.1.1 일과 운동에너지 정리 · 그래프 형식은 변인의 종류로 정한다: 두 변인이 모두 연속이면 점을 찍고 경향을 나타내는 매끄러운 선(꺾은선 X), 독립 변인이 범주(불연속)이면 막대그래프. 축에는 변인 이름과 단위. &lt;표 1&gt;은 E_k", "tg": ["1.2.1.1 일과 운동에너지 정리", "E4 과학 탐구와 과학적 사고", "그래프", "운동 에너지", "탐구 기능"], "a": "[그림 1] 그래프 가로축에 속력(m/s), 세로축에 운동에너지(J)를 단위와 함께 쓰고 고른 눈금을 매긴 뒤, 다섯 점을 찍어 원점을 지나는 매끄러운 곡선(포물선, E_k=2v^2)으로 연결한다. / [그림 2]의 오류 ① 지역은 불연속(범주) 변인인데 꺾은선 그래프로 나타냈다 → 막대그래프로 나타내야 한다. ② 세로축(강수량)에 단위(cm)가 표시되지 않았다.", "th": "../학습지/_썸네일/PTE-2008-06.png", "L": [["학생용", "../학습지/2_물리교육론/2008/PTE-2008-06_학생용.html"], ["교사용", "../학습지/2_물리교육론/2008/PTE-2008-06_교사용.html"], ["원문 PDF", "../문항모음/2008_중등1차_물리_전공%20문제.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2008-07", "c": "2008 전공 서술형 7번", "mj": "물리교육론", "ms": ["물리교육론"], "g": "물리교육론", "y": 2008, "t": "식물 서식 자료로 가설 생성하기 — 귀추적 추론(가설 생성 3단계)", "s": "2008학년도 전공 서술형 7번 · 난이도 ★★☆☆☆ · 귀추(abduction): ① 놀라운 현상 P 관찰 → ② ‘가설 H가 참이라면 P가 설명된다’ → ③ ‘그러므로 H가 참일 가능성이 있다’. 이 문항: P = ‘B 지역에 ㉠, ㉡이 서식하지 않는다’, H = ‘㉠", "tg": ["E4 과학 탐구와 과학적 사고", "E5 과학의 본성과 과학사", "가설", "자료 해석", "추론"], "a": "이유 ㉠은 기온이 높은 지역(A, C)에서만 서식하는데 B 지역은 연중 기온이 낮고(3~8 ℃), ㉡은 강수량이 적은 지역(C, D)에서만 서식하는데 B 지역은 강수량이 많기(5·7월 30, 26 cm) 때문이다. / 단계 1 B 지역에는 식물 ㉠과 ㉡이 서식하지 않는 현상(P)이 관찰되었다. / 단계 2 만일 ‘㉠은 기온이 낮은 곳에서, ㉡은 강수량이 많은 곳에서 서식할 수 없다’는 가설 H가 참이라면, 기온이 낮고 강수량이 많은 B 지역에 ㉠과 ㉡이 서식하지 않는 현상 P가 설명된다. / 단계 3 그러므로 ‘㉠은 기온이 낮은 곳에서, ㉡은 강수량이 많은 곳에서 서식할 수 없다’는 가설 H가 참일 가능성이 있다.", "th": "../학습지/_썸네일/PTE-2008-07.png", "L": [["학생용", "../학습지/2_물리교육론/2008/PTE-2008-07_학생용.html"], ["교사용", "../학습지/2_물리교육론/2008/PTE-2008-07_교사용.html"], ["원문 PDF", "../문항모음/2008_중등1차_물리_전공%20문제.pdf#page=4"]], "au": false, "bd": false}, {"id": "PTE-2007-01", "c": "2007 전공 서술형 1번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2007, "t": "명왕성의 재분류 — 과학자 공동체의 합의와 쿤 이전 과학철학의 한계", "s": "2007학년도 전공 서술형 1번 · 난이도 ★★☆☆☆ · 1.4.2.2 케플러 법칙과 궤도 운동 · 2006년 IAU 총회는 행성의 정의(① 태양 공전 ② 정역학 평형의 둥근 모양 ③ 궤도 주변의 다른 천체를 ‘청소’)를 표결로 정하고 명왕성을 왜소행성으로 재분류했다. 과학 지식(분류 체계)은 새로운 관측 증거(카", "tg": ["1.4.2.2 케플러 법칙과 궤도 운동", "1.4.2.1 만유인력 법칙과 중력 퍼텐셜", "E5 과학의 본성과 과학사", "과학의 본성", "태양계", "과학 지식의 변화"], "a": "설명 명왕성 재분류는 새로운 관측(카이퍼대 천체 발견)을 계기로 과학자 공동체(IAU)가 토론·표결로 개념을 다시 정한 것으로, 과학 지식이 공동체의 합의라는 사회적 과정을 통해 형성·변화함(잠정성)을 보여 준다. 쿤 이전의 귀납주의·논리실증주의·반증주의는 지식이 관찰과 논리(검증·반증)만으로 객관적·누적적으로 정당화된다고 보아, 과학자 공동체의 합의와 개념 틀(패러다임)의 역할을 설명하지 못한다. / 사례 예) 2018년 국제도량형총회가 표결로 킬로그램을 플랑크 상수로 재정의 — 과학자 공동체의 합의로 측정 기준(과학 지식)이 바뀜. (대륙 이동설 → 판 구조론의 수용 등도 가능)", "th": "../학습지/_썸네일/PTE-2007-01.png", "L": [["학생용", "../학습지/2_물리교육론/2007/PTE-2007-01_학생용.html"], ["교사용", "../학습지/2_물리교육론/2007/PTE-2007-01_교사용.html"], ["원문 PDF", "../문항모음/2007_중등1차_물리_전공%20문제.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2007-02", "c": "2007 전공 서술형 2번", "mj": "물리교육론", "ms": ["물리교육론", "열역학 및 통계물리"], "g": "물리교육론", "y": 2007, "t": "에탄올 끓는점 측정 모둠 제: 동화로 설명되지 않는 경험 → ", "tg": ["3.2.2.3 패러데이 전자기 유도 법칙과 렌츠의 법칙", "E2 학습 이론", "E6 과학 수업 모형과 교수 전략", "순환 학습", "전자기 유도", "학습 이론"], "a": "5-1 개념 도입(용어 도입) 단계 — 학생들이 활동 1·2의 결과를 발표·토의하게 한 뒤, 교사가 이를 정리하며 ‘전자기 유도’, ‘유도 전류(유도 기전력)’, ‘자기 선속의 변화’ 등의 용어와 패러데이 법칙을 도입·설명한다. / 5-2 활동 1·2의 탐색에서 기존 인지 구조(전류는 전지가 있어야 흐른다)로 설명되지 않는 현상을 겪어 생긴 인지적 불평형이, 활동 3에서 전자기 유도 개념을 받아들여 인지 구조를 재구성하는 조절을 통해 해소되어, 새로운 개념이 통합된 평형 상태(평형화)에 도달하기를 기대한다.", "th": "../학습지/_썸네일/PTE-2006-05.png", "L": [["학생용", "../학습지/2_물리교육론/2006/PTE-2006-05_학생용.html"], ["교사용", "../학습지/2_물리교육론/2006/PTE-2006-05_교사용.html"], ["원문 PDF", "../문항모음/2006_중등1차_물리_전공%20문제.hwp.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2006-06", "c": "2006 전공 서술형 6번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2006, "t": "운동량과 충격량의 STS 수업 — 문제로의 초대 단계와 실행 단계", "s": "2006학년도 전공 서술형 6번 · 난이도 ★★☆☆☆ · 1.2.2.1 선운동량과 충격량 · F\\Delta t=m\\Delta v: 같은 운동량 변화(충격량)라도 충돌 시간 \\Delta t가 길면 평균 힘이 작다 → 에어백·안전벨트·헬멧·운동장 매트. STS 모형(Yager): 문제로의 초대(실생활·사회 문제", "tg": ["1.2.2.1 선운동량과 충격량", "E6 과학 수업 모형과 교수 전략", "충격량", "STS", "안전장치"], "a": "6-1 문제로의 초대 단계 — 자동차 충돌 실험 영상(에어백·안전벨트 유무 비교)이나 교통사고 기사를 보여 주고, 학생들이 “같은 속력으로 충돌해도 에어백이 있으면 왜 덜 다칠까?”와 같은 질문을 스스로 제기하게 한다. 근거: 학생 주변의 실생활·사회 문제에서 출발하여 흥미와 학습의 필요성을 느끼고 스스로 문제를 인식하게 하는 것이 STS 수업의 출발점이기 때문이다. / 6-2 실행(행동하기) 단계 — 충격량과 충돌 시간의 관계를 근거로 안전벨트·헬멧 착용을 권장하는 캠페인을 기획·실행하거나, 달걀 보호 장치·충격 흡수 장치를 설계·제작하여 발표하고 학교 주변 안전시설 개선을 건의한다. 근거: 학습한 과학 지식을 개인적·사회적 의사 결정과 행동으로 옮기게 하여 과학적 소양(실천 능력)을 기르는 것이 STS ", "th": "../학습지/_썸네일/PTE-2006-06.png", "L": [["학생용", "../학습지/2_물리교육론/2006/PTE-2006-06_학생용.html"], ["교사용", "../학습지/2_물리교육론/2006/PTE-2006-06_교사용.html"], ["원문 PDF", "../문항모음/2006_중등1차_물리_전공%20문제.hwp.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2006-07", "c": "2006 전공 서술형 7번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2006, "t": "나선형 교육과정 — 9학년·물리Ⅰ·물리Ⅱ의 ‘전류와 자기장’ 학습 내용의 폭과 깊이", "s": "2006학년도 전공 서술형 7번 · 난이도 ★★☆☆☆ · 3.2.2.1 자기력과 로렌츠 힘 · 나선형 교육과정(브루너): 같은 핵심 개념을 학년이 올라가며 반복하되 폭(다루는 범위)과 깊이(추상화·정량화 수준)를 넓힌다. 공통: 전류와 자기장의 상호 작용(자기장 속 전류가 받는 힘). 9학년 정성적 확인 → ", "tg": ["3.2.2.1 자기력과 로렌츠 힘", "3.2.2.2 비오-사바르 법칙과 앙페르 법칙", "E1 과학과 교육과정", "E2 학습 이론", "교육과정", "자기력", "전류와 자기장"], "a": "7-1 자기장 속에서 전류(운동하는 전하)가 받는 힘 — 전류와 자기장의 상호 작용(자기력) / 7-2 9학년에서는 도선 주위 자기장과 자기장 속 도선이 힘을 받는 현상을 정성적으로 확인·이해하고, 물리Ⅰ에서는 그 힘의 크기와 방향을 결정하는 요인(전류, 자기장의 세기, 도선 길이, 방향)을 탐구하여 정량적 관계(F=BIL\\sin\\theta, 왼손 법칙)로 깊어지며, 물리Ⅱ에서는 평행한 두 도선 사이의 힘(전류가 만든 자기장과 전류의 상호 작용)으로 폭이 넓어지고 운동 전하가 받는 힘(F=qvB)으로 미시적 원리까지 일반화되어 깊이가 더해진다.", "th": "../학습지/_썸네일/PTE-2006-07.png", "L": [["학생용", "../학습지/2_물리교육론/2006/PTE-2006-07_학생용.html"], ["교사용", "../학습지/2_물리교육론/2006/PTE-2006-07_교사용.html"], ["원문 PDF", "../문항모음/2006_중등1차_물리_전공%20문제.hwp.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2006-08", "c": "2006 전공 서술형 8번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2006, "t": "학생의 ‘힘과 운동’ 개념도에서 선개념 찾기와 인지 갈등 상황", "s": "2006학년도 전공 서술형 8번 · 난이도 ★★☆☆☆ · 1.1.2.1 관성계와 제1·2·3법칙 · 뉴턴: 힘은 운동의 변화(가속도)의 원인, \\vec F_{\\rm net}=m\\vec a. 등속 운동에는 알짜힘 0. 학생의 선개념: ① 물체 안에 ‘운동하려는 힘’이 있다가 소모된다(임페투스) — 위로 던진 공이 느", "tg": ["1.1.2.1 관성계와 제1·2·3법칙", "1.1.2.2 중력, 수직항력, 장력", "E3 오개념과 개념 변화", "힘과 운동", "오개념", "관성"], "a": "8-1 ① 운동하는 물체는 ‘운동하려는 힘’을 가지고 있으며, 이 힘이 소모되면 속력이 줄어든다(위로 던진 공이 점점 느려지는 것은 공의 힘이 소모되기 때문) — 임페투스 개념. ② 등속으로 운동하는 물체에는 운동 방향으로 일정한 크기의 (알짜)힘이 계속 작용한다(운동을 유지하려면 힘이 필요하다). [그 밖에: 정지한 물체에는 힘이 작용하지 않는다] / 8-2 상황: 마찰이 거의 없는 공기 부상 궤도에서 수레를 잠시 밀었다 놓기 전에, 손을 뗀 뒤의 운동을 예측하게 하고 관찰하게 한다. 근거: 학생은 ‘밀어 준 힘이 소모되어 곧 멈춘다(등속으로 가려면 계속 힘이 필요하다)’고 예측하지만, 실제로 수레는 힘을 받지 않고도 거의 같은 속력으로 계속 움직이므로 예측과 관찰이 모순되어 인지 갈등이 일어난다(느려지는", "th": "../학습지/_썸네일/PTE-2006-08.png", "L": [["학생용", "../학습지/2_물리교육론/2006/PTE-2006-08_학생용.html"], ["교사용", "../학습지/2_물리교육론/2006/PTE-2006-08_교사용.html"], ["원문 PDF", "../문항모음/2006_중등1차_물리_전공%20문제.hwp.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2005-01", "c": "2005 전공 서술형 1번", "mj": "물리교육론", "ms": ["물리교육론"], "g": "물리교육론", "y": 2005, "t": "제7차 교육과정의 수준별 교육과정 — 심화·보충형과 과목 선택형", "s": "2005학년도 전공 서술형 1번 · 난이도 ★☆☆☆☆ · 제7차 교육과정의 수준별 교육과정 유형: 단계형(수학·영어 일부), 심화·보충형(국민 공통 기본 교육과정의 과학 등), 과목 선택형(고2·3 선택 중심). 중·고 과학과 → 심화·보충형(7~10학년 = 중1~고1) ", "tg": ["E1 과학과 교육과정", "교육과정", "수준별 수업"], "a": "1 ① 심화·보충형 수준별 교육과정 — 7~10학년(중1~고1) ② 과목 선택형 수준별 교육과정 — 11~12학년(고2~고3)", "th": "../학습지/_썸네일/PTE-2005-01.png", "L": [["학생용", "../학습지/2_물리교육론/2005/PTE-2005-01_학생용.html"], ["교사용", "../학습지/2_물리교육론/2005/PTE-2005-01_교사용.html"], ["원문 PDF", "../문항모음/2005_중등1차_물리_전공%20문제.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2005-02", "c": "2005 전공 서술형 2번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2005, "t": "가설 설정 능력의 평가 — 선다형보다 수행평가가 적절한 이유와 채점 준거", "s": "2005학년도 전공 서술형 2번 · 난이도 ★★☆☆☆ · 1.4.1.2 단진자와 물리 진자 · 가설 설정 능력 = 문제에 대한 잠정적 답을 스스로 만들어 진술하는 능력 → 정해진 답을 고르는 선다형으로는 타당하게 측정하기 어렵고, 학생이 직접 진술한 결과·과정을 보는 수행평가가 적절. 채점 준거: 독립·종속 ", "tg": ["1.4.1.2 단진자와 물리 진자", "E7 실험 지도와 평가", "E4 과학 탐구와 과학적 사고", "탐구 능력 평가", "가설", "단진자"], "a": "이유 가설 설정 능력은 학생이 스스로 가설을 만들어 진술하는 능력인데, 선다형은 제시된 답 중에서 고르게 하므로(재인) 이 능력을 직접 측정할 수 없어 타당도가 낮다. 수행평가는 학생이 직접 가설을 설정·진술하는 과정과 결과를 평가하므로 측정하려는 능력을 타당하게 평가할 수 있다. / 채점 준거 ① 독립변인(실의 길이)과 종속변인(진자의 주기) 사이의 관계가 명확하게 진술되었는가 ② 실험을 통해 검증할 수 있는(측정 가능한) 형태로 진술되었는가", "th": "../학습지/_썸네일/PTE-2005-02.png", "L": [["학생용", "../학습지/2_물리교육론/2005/PTE-2005-02_학생용.html"], ["교사용", "../학습지/2_물리교육론/2005/PTE-2005-02_교사용.html"], ["원문 PDF", "../문항모음/2005_중등1차_물리_전공%20문제.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2005-03", "c": "2005 전공 서술형 3번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2005, "t": "밀도 개념 수업 — 행동주의 vs 구성주의 교수·학습 절차", "s": "2005학년도 전공 서술형 3번 · 난이도 ★★☆☆☆ · 1.3.2.2 유체 정역학 (압력, 파스칼, 아르키메데스 원리) · 행동주의: 공식 암기 → 반복 연습(자극–반응 강화). 구성주의: 학생의 선개념에서 출발해 직접 탐구·토의로 지식을 스스로 구성(교사는 안내자). 밀도 \\rho=m/V: 같은 물질이면 크기와 상관없이 일정한 물질의 ", "tg": ["1.3.2.2 유체 정역학 (압력, 파스칼, 아르키메데스 원리)", "E2 학습 이론", "E3 오개념과 개념 변화", "E6 과학 수업 모형과 교수 전략", "학습 이론", "밀도", "개념 변화"], "a": "절차 ① 큰 나무토막과 작은 쇠못 등이 뜨고 가라앉는 것을 예상·설명하게 하여 학생의 선개념을 드러낸다(인지 갈등). ② 모둠별로 여러 물질의 질량과 부피를 직접 측정·그래프화하고 토의하여 질량/부피가 물질마다 일정함(밀도)을 스스로 찾게 한다. ③ 밀도 개념을 새 상황(물질 구별, 부침)에 적용하고 처음 생각과 비교·반성하게 한다. / 이유 학생의 선개념에서 출발하여, 학생이 직접 측정·토의하는 활동과 동료와의 상호작용을 통해 밀도 개념을 스스로 구성하고(교사는 안내자) 새 상황에 적용하게 하므로 구성주의 학습 이론에 따른 절차이다.", "th": "../학습지/_썸네일/PTE-2005-03.png", "L": [["학생용", "../학습지/2_물리교육론/2005/PTE-2005-03_학생용.html"], ["교사용", "../학습지/2_물리교육론/2005/PTE-2005-03_교사용.html"], ["원문 PDF", "../문항모음/2005_중등1차_물리_전공%20문제.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2005-04", "c": "2005 전공 서술형 4번", "mj": "물리교육론", "ms": ["물리교육론", "파동 및 광학"], "g": "물리교육론", "y": 2005, "t": "반으로 자른 볼록 렌즈의 상 작도 — 직접 풀고 채점 준거 세우기", "s": "2005학년도 전공 서술형 4번 · 난이도 ★★☆☆☆ · 4.2.1.3 렌즈 방정식과 광학 기기 · 렌즈의 각 부분은 물체의 한 점에서 나온 빛을 모두 같은 상점으로 모은다 → 렌즈를 반으로 잘라도 상 전체가 그대로 생기고 밝기만 줄어든다. 물체가 2f에 있으면 \\dfrac1a+\\dfrac1b=\\dfrac1f → ", "tg": ["4.2.1.3 렌즈 방정식과 광학 기기", "4.2.1.1 반사의 법칙과 스넬의 법칙", "E7 실험 지도와 평가", "E3 오개념과 개념 변화", "렌즈와 상", "굴절", "광선 작도"], "a": "작도 렌즈 오른쪽 2F′(렌즈에서 2f) 위치에 물체와 같은 크기의 거꾸로 선 실상이 완전하게 생긴다(반쪽 렌즈이므로 밝기만 약해짐). 광선은 렌즈의 앞·뒤 두 경계면에서 각각 굴절하도록 그린다. / 채점 준거 ① 광선이 렌즈의 두 경계면(공기→유리, 유리→공기)에서 각각 스넬 법칙에 맞는 방향으로 굴절하도록 작도했는가 ② 상의 위치(2F′)와 크기(같음)·방향(거꾸로 선 실상)을 옳게, 그리고 반쪽 렌즈라도 상 전체가 맺히도록 나타냈는가", "th": "../학습지/_썸네일/PTE-2005-04.png", "L": [["학생용", "../학습지/2_물리교육론/2005/PTE-2005-04_학생용.html"], ["교사용", "../학습지/2_물리교육론/2005/PTE-2005-04_교사용.html"], ["원문 PDF", "../문항모음/2005_중등1차_물리_전공%20문제.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2005-05", "c": "2005 전공 서술형 5번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2005, "t": "자유 낙하 시범과 인지 갈등 — 관찰의 이론 의존성", "s": "2005학년도 전공 서술형 5번 · 난이도 ★★☆☆☆ · 1.1.1.2 등가속도 직선운동 및 자유낙하 · 관찰의 이론 의존성(핸슨): 관찰은 관찰자가 가진 이론·개념에 의해 영향을 받는다 — 같은 현상도 무엇을 아느냐에 따라 다르게 ‘보인다’. 선개념을 가진 학생은 가속 운동을 보여 주어도 선개념에 맞게 관찰·해석하므로", "tg": ["1.1.1.2 등가속도 직선운동 및 자유낙하", "1.1.2.1 관성계와 제1·2·3법칙", "E5 과학의 본성과 과학사", "E3 오개념과 개념 변화", "과학의 본성", "오개념", "자유 낙하"], "a": "5 학생들은 자신의 선개념(힘은 속력에 비례, 중력은 일정 → 일정한 속력으로 떨어질 것)이라는 이론의 틀을 통해 낙하 운동을 관찰하므로, 물체가 가속 운동하는 것을 보더라도 이를 가속 운동으로 인식하지 못하거나 선개념에 맞게 해석하여 자신의 생각과 모순되는 증거로 받아들이지 않았기 때문이다(관찰이 관찰자의 이론에 의존).", "th": "../학습지/_썸네일/PTE-2005-05.png", "L": [["학생용", "../학습지/2_물리교육론/2005/PTE-2005-05_학생용.html"], ["교사용", "../학습지/2_물리교육론/2005/PTE-2005-05_교사용.html"], ["원문 PDF", "../문항모음/2005_중등1차_물리_전공%20문제.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2005-06", "c": "2005 전공 서술형 6번", "mj": "물리교육론", "ms": ["물리교육론", "현대물리학"], "g": "물리교육론", "y": 2005, "t": "보어 원자 모형의 수정 — 라카토스의 과학적 연구 프로그램", "s": "2005학년도 전공 서술형 6번 · 난이도 ★★☆☆☆ · 5.2.2.1 보어 원자 모형과 수소 스펙트럼 · 라카토스: 과학 이론은 연구 프로그램 — 반증에서 보호되는 견고한 핵(러더퍼드 유핵 모형) + 수정 가능한 보호대(보조 가설). 부정적 발견법: 핵을 건드리지 말라. 긍정적 발견법: 보호대를 어떻게 고치고 발전시킬지", "tg": ["5.2.2.1 보어 원자 모형과 수소 스펙트럼", "E5 과학의 본성과 과학사", "과학의 본성", "보어 원자 모형", "선 스펙트럼"], "a": "라카토스 이론 긍정적 발견법 (견고한 핵인 유핵 모형은 유지하고 보호대를 수정·발전시키는 연구 프로그램의 지침) / 이유 견고한 핵인 러더퍼드의 유핵 모형은 포기하지 않고 유지하면서, 반증 사례를 설명하기 위해 보호대의 보조 가설(두 양성자 핵 주위의 전자 He⁺, 환산 질량)을 수정·추가하여 반증 사례를 확증 사례로 바꾸었기 때문이다.", "th": "../학습지/_썸네일/PTE-2005-06.png", "L": [["학생용", "../학습지/2_물리교육론/2005/PTE-2005-06_학생용.html"], ["교사용", "../학습지/2_물리교육론/2005/PTE-2005-06_교사용.html"], ["원문 PDF", "../문항모음/2005_중등1차_물리_전공%20문제.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2005-07", "c": "2005 전공 서술형 7번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2005, "t": "힘·질량·가속도 실험의 탐구 과정 — 변인 통제와 자료 변환", "s": "2005학년도 전공 서술형 7번 · 난이도 ★★☆☆☆ · 1.1.2.1 관성계와 제1·2·3법칙 · 단계 1(힘만 바꿈, 질량 고정)·단계 2(질량만 바꿈, 힘 고정) → 공통: 변인 통제. 단계 3: 종이테이프를 일정 시간 간격(예: 6타점 = 0.1 s)으로 잘라 붙여 속력–시간 그래프로 만들고 가속도를 구해 ", "tg": ["1.1.2.1 관성계와 제1·2·3법칙", "1.1.1.2 등가속도 직선운동 및 자유낙하", "E4 과학 탐구와 과학적 사고", "E7 실험 지도와 평가", "탐구 과정", "가속도 법칙", "실험"], "a": "단계1·2 공통 변인 통제 / 단계3 활동 종이테이프를 일정한 시간 간격(예: 0.1초 = 6타점)으로 잘라 붙여 속력–시간 그래프를 그리고, 그 기울기로 각 경우의 가속도를 구한 다음, 힘–가속도 및 질량–가속도(또는 1/질량–가속도) 관계를 표와 그래프로 나타낸다. / 단계3 탐구과정 자료 변환", "th": "../학습지/_썸네일/PTE-2005-07.png", "L": [["학생용", "../학습지/2_물리교육론/2005/PTE-2005-07_학생용.html"], ["교사용", "../학습지/2_물리교육론/2005/PTE-2005-07_교사용.html"], ["원문 PDF", "../문항모음/2005_중등1차_물리_전공%20문제.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2005-08", "c": "2005 전공 서술형 8번", "mj": "물리교육론", "ms": ["물리교육론"], "g": "물리교육론", "y": 2005, "t": "물리 학습 태도 검사 — 의미 분석법 결과 해석과 리커트 척도 변환", "s": "2005학년도 전공 서술형 8번 · 난이도 ★★☆☆☆ · 의미 분석법(semantic differential): 양극의 형용사 쌍(재미있다–지루하다) 사이 7단계. 점수는 서열(순위) 척도 — 순서는 말할 수 있으나 1점 차이가 같은 크기의 태도 차이라는 보장은 없다. 리", "tg": ["E7 실험 지도와 평가", "태도 검사", "척도"], "a": "평가 세 학급 모두 평균이 중간값(4)보다 커서 물리 학습을 대체로 재미있다고 느끼며, 긍정적인 정도는 C > B > A 순이다(A는 중립에 가까움). 그러나 의미 분석법 점수는 서열 척도이므로 평균이 1점씩 차이 난다고 해서 학급 간 태도 차이가 같은 크기라고(또는 비율로) 해석할 수는 없다. / 변환 “물리 공부는 재미있다.” — 매우 그렇다 / 그렇다 / 보통이다 / 그렇지 않다 / 전혀 그렇지 않다 (5~1점)", "th": "../학습지/_썸네일/PTE-2005-08.png", "L": [["학생용", "../학습지/2_물리교육론/2005/PTE-2005-08_학생용.html"], ["교사용", "../학습지/2_물리교육론/2005/PTE-2005-08_교사용.html"], ["원문 PDF", "../문항모음/2005_중등1차_물리_전공%20문제.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2004-01", "c": "2004 전공 서술형 1번", "mj": "물리교육론", "ms": ["물리교육론", "파동 및 광학", "전자기학"], "g": "물리교육론", "y": 2004, "t": "제7차 과학과 교육과정 내용 체계표 — 지식 영역(에너지·물질)과 탐구 활동", "s": "2004학년도 전공 서술형 1번 · 난이도 ★☆☆☆☆ · 4.1.1.1 파동의 기본 특성 · 제7차 과학 내용 체계 = 지식 4영역(에너지, 물질, 생명, 지구) + 탐구(탐구 과정: 기초·통합 탐구 과정 / 탐구 활동: 토의, 실험, 조사, 견학, 과제 연구 등). 파동·전류의 작용은 에너지, 분자의 운동", "tg": ["4.1.1.1 파동의 기본 특성", "3.2.1.1 전류, 저항, 옴의 법칙", "E1 과학과 교육과정", "교육과정", "과학 내용 체계"], "a": "A 에너지 / B 물질 / C 탐구 활동", "th": "../학습지/_썸네일/PTE-2004-01.png", "L": [["학생용", "../학습지/2_물리교육론/2004/PTE-2004-01_학생용.html"], ["교사용", "../학습지/2_물리교육론/2004/PTE-2004-01_교사용.html"], ["원문 PDF", "../문항모음/2004_중등1차_물리_전공%20문제.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2004-02", "c": "2004 전공 서술형 2번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2004, "t": "전류를 물의 흐름에 비유하기 — ‘전류 소모’ 오개념과 비유의 한계", "s": "2004학년도 전공 서술형 2번 · 난이도 ★★☆☆☆ · 3.2.1.1 전류, 저항, 옴의 법칙 · 닫힌 회로에서 전류는 어디서나 같다(전하 보존). 전구에서 ‘소모’되는 것은 전하가 아니라 에너지(P=VI). 물 비유: 펌프 = 전지(압력 차 = 전압), 좁은 관 = 저항, 유량 = 전류. 한계: 관을 자르면 물", "tg": ["3.2.1.1 전류, 저항, 옴의 법칙", "3.2.1.2 키르히호프의 법칙과 직·병렬 회로", "E3 오개념과 개념 변화", "E6 과학 수업 모형과 교수 전략", "전류", "전기 회로", "비유 모형"], "a": "2-1 닫힌 수도관에서 물은 없어지지 않아 좁은 관(전구)을 지나기 전과 후의 물의 양(유량)이 같다는 점 — 전류도 전구 앞뒤에서 같다. 좁은 관에서 소모되는 것은 물이 아니라 펌프가 준 에너지(압력 차)이듯, 전구에서 소모되는 것은 전류가 아니라 전기 에너지임을 활용한다. / 2-2 도선을 끊으면 전류가 흐르지 않지만, 수도관을 자르면 물은 밖으로 쏟아져 계속 흐른다.", "th": "../학습지/_썸네일/PTE-2004-02.png", "L": [["학생용", "../학습지/2_물리교육론/2004/PTE-2004-02_학생용.html"], ["교사용", "../학습지/2_물리교육론/2004/PTE-2004-02_교사용.html"], ["원문 PDF", "../문항모음/2004_중등1차_물리_전공%20문제.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2004-03", "c": "2004 전공 서술형 3번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2004, "t": "훅 법칙 실험 그래프와 쿤의 과학관 — 변칙 사례와 자료 왜곡", "s": "2004학년도 전공 서술형 3번 · 난이도 ★★☆☆☆ · 1.4.1.1 단진동 (용수철 진자) · 쿤: 전과학 → 정상 과학(패러다임 안의 퍼즐 풀이) → 변칙 사례 누적 → 위기 → 과학 혁명 → 새 정상 과학. (가) = 패러다임(훅 법칙)을 받아들인 채 맞지 않는 자료(변칙 사례)를 만난 정상 과학 단계. ", "tg": ["1.4.1.1 단진동 (용수철 진자)", "E5 과학의 본성과 과학사", "E4 과학 탐구와 과학적 사고", "과학의 본성", "훅의 법칙", "그래프 해석"], "a": "3-1 정상 과학 단계 — 패러다임(훅의 법칙) 안에서 퍼즐 풀이를 하다가 이에 맞지 않는 변칙 사례를 만난 상태 / 3-2 쿤은 변칙 사례를 패러다임 안의 퍼즐로 풀거나, 누적되면 위기·혁명을 거쳐 이론이 바뀐다고 보았으나, 학생들은 자료를 왜곡해 변칙 사례를 감추었다.", "th": "../학습지/_썸네일/PTE-2004-03.png", "L": [["학생용", "../학습지/2_물리교육론/2004/PTE-2004-03_학생용.html"], ["교사용", "../학습지/2_물리교육론/2004/PTE-2004-03_교사용.html"], ["원문 PDF", "../문항모음/2004_중등1차_물리_전공%20문제.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2004-04", "c": "2004 전공 서술형 4번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2004, "t": "‘힘이 빠져서 멈춘다’ — 드라이아이스 시범 실험과 포스너의 개념 변화 조건", "s": "2004학년도 전공 서술형 4번 · 난이도 ★★☆☆☆ · 1.1.2.1 관성계와 제1·2·3법칙 · 포스너 개념 변화 조건: ㉮ 현재 개념에 대한 불만족 ㉯ 새 개념의 이해 가능성 ㉰ 그럴듯함(경험·다른 지식과 부합) ㉱ 유용성(새 상황 설명). 드라이아이스 시범 = 기존 개념으로 설명 안 되는 사례 → ㉮. 학생", "tg": ["1.1.2.1 관성계와 제1·2·3법칙", "1.1.2.3 마찰력과 구심력 운동", "E3 오개념과 개념 변화", "관성의 법칙", "마찰력", "개념 변화"], "a": "4-1 ㉮ (현재 개념에 대한 불만족) — 기존 개념(힘이 빠져서 멈춤)으로 설명할 수 없는 현상을 보여 인지 갈등을 일으키기 위함 / 4-2 ㉰ (새 개념의 그럴듯함) — 학생은 설명을 이해했지만 ‘계속 가는 물체’가 자신의 경험과 맞지 않아 믿을 만하다고 느끼지 못함", "th": "../학습지/_썸네일/PTE-2004-04.png", "L": [["학생용", "../학습지/2_물리교육론/2004/PTE-2004-04_학생용.html"], ["교사용", "../학습지/2_물리교육론/2004/PTE-2004-04_교사용.html"], ["원문 PDF", "../문항모음/2004_ <script>
(function(){

function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
var S={q:'',mj:'all',g:'all',yr:'all',sort:store('sort')||'topic',view:store('view')||'grid',ans:store('ans')==='1',click:+(store('click')||0),lim:PAGE}, F=[];
(function(){ var h=location.hash.slice(1); if(!h) return; h.split('&').forEach(function(p){ var kv=p.split('='), v=decodeURIComponent(kv[1]||'');
  if(kv[0]==='t'&&MJ[v]) S.mj=v; if(kv[0]==='g') S.g=v; if(kv[0]==='q') S.q=v.toLowerCase(); if(kv[0]==='y') S.yr=v; }); })();
/* hero */
(function(){
  var n=IT.length, cnt={}, ys=IT.map(function(i){return i.y}), y0=Math.min.apply(0,ys), y1=Math.max.apply(0,ys);
  IT.forEach(function(it){cnt[it.mj]=(cnt[it.mj]||0)+1});

/* controls */
