<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>객관식 문항 지도</title>
<style>
:root{--bg:#f4f5fa;--panel:#fff;--panel2:#f8f9fc;--ink:#1b1f2a;--muted:#5b6475;--faint:#8a93a6;--line:#e3e6ef;--accent:#3b3486;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 6px 18px rgba(20,24,40,.06);--shadow2:0 4px 10px rgba(20,24,40,.08),0 18px 40px rgba(20,24,40,.14);
  --thumb:#fff;--chip:#eef0f7;--radius:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1220;--panel:#171b2c;--panel2:#1d2236;--ink:#e8eaf3;--muted:#a7aec4;--faint:#7c849c;
  --line:#2a3048;--accent:#a99ff5;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--shadow2:0 6px 14px rgba(0,0,0,.45),0 22px 44px rgba(0,0,0,.5);--thumb:#f7f8fb;--chip:#242a42}}
:root[data-theme="dark"]{--bg:#0f1220;--panel:#171b2c;--panel2:#1d2236;--ink:#e8eaf3;--muted:#a7aec4;--faint:#7c849c;
  --line:#2a3048;--accent:#a99ff5;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--shadow2:0 6px 14px rgba(0,0,0,.45),0 22px 44px rgba(0,0,0,.5);--thumb:#f7f8fb;--chip:#242a42}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none} button{font:inherit;color:inherit}
.wrap{max-width:1480px;margin:0 auto;padding:0 20px}
.hero{background:radial-gradient(1200px 400px at 10% -10%,rgba(255,255,255,.12),transparent 60%),linear-gradient(135deg,#1b1f2a,#2b2766 55%,#5b4fc4);color:#fff;padding:30px 0 24px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:22px 22px;pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:700}
.hero h1{margin:6px 0 4px;font-size:clamp(24px,3.2vw,38px);font-weight:900;letter-spacing:-.02em}
.hero p{margin:0;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:20px}
.stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:26px;font-weight:900;line-height:1.1}.stat span{font-size:12.5px;opacity:.8}
.dist{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:18px;background:rgba(255,255,255,.12)}.dist i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px;cursor:pointer}.legend span:hover{text-decoration:underline}
.legend em{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:12px;padding-bottom:12px}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:15px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--panel2)}
.tabs,.chips{display:flex;gap:6px;flex-wrap:wrap}
.tab,.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;cursor:pointer;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.chip{padding:5px 11px;font-size:12.5px}
.tab .n,.chip .n{font-size:11.5px;font-weight:800;background:var(--chip);border-radius:99px;padding:0 7px;color:var(--muted)}
.tab:hover,.chip:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.tab.on,.chip.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.tab.on .n,.chip.on .n{background:rgba(255,255,255,.25);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel,.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;font-size:13.5px;color:var(--ink);cursor:pointer}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.row2{width:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row2 .lab{font-size:12px;color:var(--faint);font-weight:800}
.main{display:grid;grid-template-columns:250px 1fr;gap:24px;padding-top:22px;padding-bottom:60px}
.side{position:sticky;top:130px;align-self:start;max-height:calc(100vh - 150px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px;box-shadow:var(--shadow)}
.side h4{margin:4px 6px 10px;font-size:12px;letter-spacing:.1em;color:var(--faint)}
.tree .mj{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;cursor:pointer;font-weight:800;font-size:14px}
.tree .mj:hover,.tree .mn:hover{background:var(--panel2)}
.tree .dot{width:10px;height:10px;border-radius:3px}
.tree .cnt{margin-left:auto;font-size:12px;color:var(--faint);font-weight:700}
.tree .mn{display:flex;gap:8px;padding:5px 8px 5px 26px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.tree .mn.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink);font-weight:700}
.tree .mn.zero{opacity:.38}
.result-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;color:var(--muted);font-size:14px}.result-line b{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:700;color:var(--ink)}
.pill button{border:0;background:none;cursor:pointer;color:var(--faint);padding:0;font-size:14px}
.sec{margin:0 0 30px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--line)}
.sec-h .ic{font-size:22px}.sec-h h2{margin:0;font-size:22px;font-weight:900}.sec-h .cnt{margin-left:auto;font-weight:800;color:var(--faint);font-size:13px}
.minor-h{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}
.minor-h h3{margin:0;font-size:16px;font-weight:800}.minor-h .desc{color:var(--faint);font-size:12.5px}
.minor-h .code{font-size:12px;font-weight:800;color:#fff;background:var(--c);border-radius:6px;padding:1px 7px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s,border-color .18s;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow2);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c);z-index:1}
.thumb{display:block;background:var(--thumb);aspect-ratio:16/11;position:relative;border-bottom:1px solid var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .25s}
.card:hover .thumb img{transform:scale(1.04)}
.thumb .noimg{display:flex;align-items:center;justify-content:center;height:100%;font-size:40px;opacity:.35}
.thumb .go{position:absolute;right:8px;bottom:8px;background:rgba(27,31,42,.82);color:#fff;font-size:11.5px;font-weight:700;border-radius:8px;padding:3px 8px;opacity:0;transition:opacity .18s}
.card:hover .thumb .go{opacity:1}
.badge{position:absolute;left:10px;top:12px;font-size:11.5px;font-weight:800;color:#fff;background:var(--c);border-radius:7px;padding:2px 7px;box-shadow:0 2px 6px rgba(0,0,0,.18);z-index:2;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{padding:11px 13px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);font-weight:700;flex-wrap:wrap}
.meta .rc{font-size:10.5px;background:var(--chip);border-radius:6px;padding:0 6px}
.meta .rc.deep{background:#ffd84d;color:#3b2f00;font-weight:800}
.ko{font-weight:800;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.en{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:4px}.tags span{font-size:11.5px;background:var(--chip);color:var(--muted);border-radius:6px;padding:1px 7px;font-weight:600}
.tags span.tp{color:#fff;background:var(--tc)}
.ans{display:none;font-size:12.5px;background:color-mix(in srgb,#2e9e5b 14%,transparent);border-radius:8px;padding:5px 8px;font-weight:700}
body.show-ans .ans{display:block}
.acts{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.acts a,.acts button{flex:1;text-align:center;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:6px 4px;font-size:12.5px;font-weight:800;cursor:pointer}
.acts a:hover,.acts button:hover{background:var(--c);border-color:var(--c);color:#fff}.acts .pv{flex:0 0 38px}
body.list .grid{grid-template-columns:1fr}
body.list .card{flex-direction:row}
body.list .card::before{width:4px;height:auto;bottom:0;right:auto}
body.list .thumb{width:170px;flex:0 0 170px;aspect-ratio:auto;border-bottom:0;border-right:1px solid var(--line)}
body.list .ko{-webkit-line-clamp:1;min-height:0}body.list .acts{max-width:330px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}.empty b{display:block;font-size:40px;margin-bottom:8px}
.more{display:block;margin:18px auto 0;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 22px;font-weight:800;cursor:pointer}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,12,24,.55);backdrop-filter:blur(4px)}
.modal.on{display:flex}
.mbox{background:var(--panel);border-radius:20px;max-width:1000px;width:100%;max-height:calc(100vh - 40px);overflow:auto;box-shadow:var(--shadow2);display:grid;grid-template-columns:1.1fr 1fr;position:relative}
.mfig{background:var(--thumb);padding:18px;display:flex;align-items:flex-start;justify-content:center;border-right:1px solid var(--line);position:relative}
.mfig img{width:100%;height:auto;max-height:76vh;object-fit:contain;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.mfig::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.mtxt{padding:24px 24px 20px;display:flex;flex-direction:column;gap:10px}
.mtxt .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mtxt h3{margin:2px 0 0;font-size:21px;font-weight:900;line-height:1.35}
.mtxt .en{white-space:normal;font-size:14px}
.mtxt .mans{display:none;background:color-mix(in srgb,#2e9e5b 14%,transparent);border-radius:12px;padding:10px 14px;font-weight:800}
.mtxt.reveal .mans{display:block}
.mtxt .note{font-size:12.5px;color:var(--faint)}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.mbtns a,.mbtns button{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:9px 14px;font-weight:800;font-size:14px;cursor:pointer}
.mbtns .pri{background:var(--c);border-color:var(--c);color:#fff}
.mclose{position:absolute;right:12px;top:10px;border:0;background:var(--panel2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;z-index:2}
.mnav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:var(--panel);box-shadow:var(--shadow2);width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:18px;z-index:51}
.mnav.prev{left:14px}.mnav.next{right:14px}
.foot{color:var(--faint);font-size:12.5px;padding:24px 0 40px;text-align:center}.foot a{color:var(--accent);font-weight:700}
.top-btn{position:fixed;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:var(--shadow2);cursor:pointer;font-size:18px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.top-btn.on{opacity:1;pointer-events:auto}
@media (max-width:980px){.bar{position:static}.main{grid-template-columns:1fr}.side{position:static;max-height:none}.mbox{grid-template-columns:1fr}.mfig{border-right:0;border-bottom:1px solid var(--line)}.mnav{display:none}}
@media (max-width:560px){.wrap{padding:0 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ko{font-size:13px}.tags,.en{display:none}body.list .thumb{width:100px;flex-basis:100px}}
.card .ans{display:none!important} #ansBtn{display:none!important}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="kicker">Teacher Certification Exam · 중등교사 임용시험 물리 기출</div>
  <h1>객관식 문항 지도</h1><p id="heroSub"></p>
  <div class="stats" id="stats"></div><div class="dist" id="dist"></div><div class="legend" id="legend"></div>
</div></header>
<div class="bar"><div class="wrap">
  <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="제목·학년도·분류·태그로 찾기 (예: 퍼텐셜, 2003, 오수벨, 1.4.1.1)" autocomplete="off"><kbd>/</kbd></label>
  <div class="tools">
    <select class="sel" id="yf" title="연도"></select>
    <select class="sel" id="sort" title="정렬"><option value="topic">주제별 묶음</option><option value="new">최신순</option><option value="old">오래된 순</option><option value="group">갈래순</option></select>
    <button class="tbtn" id="vGrid" title="카드 보기">▦</button><button class="tbtn" id="vList" title="목록 보기">☰</button>
    <button class="tbtn" id="ansBtn" title="카드에 정답 표시">정답</button>
    <select class="sel" id="clickTo" title="썸네일 클릭 시 여는 자료"><option value="0">클릭 → 학생용</option><option value="1">클릭 → 교사용</option><option value="2">클릭 → 원문 PDF</option></select>
    <button class="tbtn" id="rand" title="무작위 문제">🎲</button><button class="tbtn" id="theme" title="밝게/어둡게">◐</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="row2"><span class="lab" id="glab"></span><div class="chips" id="chips"></div></div>
</div></div>
<div class="wrap main" id="mainWrap">
  <aside class="side"><h4>주제 › <span id="glab2"></span></h4><div class="tree" id="tree"></div></aside>
  <section><div class="result-line" id="resLine"></div><div id="content"></div></section>
</div>
<div class="foot wrap" id="foot"></div>
<div class="modal" id="modal" aria-hidden="true">
  <button class="mnav prev" id="mPrev" title="이전 (←)">‹</button>
  <div class="mbox" id="mbox" role="dialog" aria-modal="true"><button class="mclose" id="mClose" title="닫기 (Esc)">×</button><div class="mfig" id="mFig"></div><div class="mtxt" id="mTxt"></div></div>
  <button class="mnav next" id="mNext" title="다음 (→)">›</button>

var tm; $('q').value=S.q; $('q').oninput=function(){ clearTimeout(tm); var v=this.value; tm=setTimeout(function(){ S.q=v.trim().toLowerCase(); render(); },120); };
$('rand').onclick=function(){ var L=F.length?F:IT; openModal(L[Math.floor(Math.random()*L.length)].i); };
var th=store('theme'); if(th) document.documentElement.dataset.theme=th;
$('theme').onclick=function(){ var cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'), nx=cur==='dark'?'light':'dark'; document.documentElement.dataset.theme=nx; store('theme',nx); };
addEventListener('scroll',function(){ $('topBtn').classList.toggle('on',scrollY>600); },{passive:true});
$('topBtn').onclick=function(){ scrollTo({top:0}); };
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&document.activeElement!==$('q')){ e.preventDefault(); $('q').focus(); }
  if(!$('modal').classList.contains('on')) return;
  if(e.key==='Escape') closeModal(); if(e.key==='ArrowRight') step(1); if(e.key==='ArrowLeft') step(-1);
});
/* filter */
function match(it,ignoreMj,ignoreG){
  if(!ignoreMj&&S.mj!=='all'&&it.ms.indexOf(S.mj)<0) return false;
  if(!ignoreG&&S.g!=='all'&&it.g!==S.g) return false;
  if(S.yr!=='all'&&String(it.y)!==S.yr) return false;
  if(S.q){ var ws=S.q.split(/\s+/); for(var i=0;i<ws.length;i++) if(it._t.indexOf(ws[i])<0) return false; }
  return true;
}
var GI={}; D.groups.forEach(function(g,i){GI[g]=i});
function sorter(a,b){
  switch(S.sort){ case 'old': return a.y-b.y||a.i-b.i; case 'group': return (GI[a.g]-GI[b.g])||(b.y-a.y)||a.i-b.i; default: return b.y-a.y||a.i-b.i; }
}
/* render */
function card(it){
  var m=MJ[it.mj]||D.majors[0], first=it.L[Math.min(S.click,it.L.length-1)]||['',''];
  return '<article class="card" style="--c:'+m.color+'">'+
    '<a class="thumb" href="'+esc(first[1])+'" target="_blank">'+(it.th?'<img loading="lazy" src="'+esc(it.th)+'" alt="">':'<span class="noimg">'+m.icon+'</span>')+'<span class="go">'+esc(first[0])+' 열기 ↗</span></a>'+
    '<span class="badge">'+esc(it.c)+'</span>'+
    '<div class="cb"><div class="meta"><span>'+it.y+'</span><span>'+esc(it.g)+'</span>'+(it.bd?'<span class="rc" title="여러 문항을 한 학습지에 묶음">객관식 묶음</span>':'')+(it.au?'<span class="rc" title="키워드 자동 분류">자동분류</span>':'')+(it.L[0]&&it.L[0][1].indexOf('/심화/')>=0?'<span class="rc deep" title="한국어 문제·AI 풀이·모의실험이 있는 심화 학습지">✦ 심화</span>':'')+'</div>'+
    '<div class="ko">'+esc(it.t)+'</div><div class="en">'+esc(it.s)+'</div>'+
    '<div class="tags">'+it.ms.map(function(t){var x=MJ[t];return x?'<span class="tp" style="--tc:'+x.color+'">'+esc(t)+'</span>':''}).join('')+it.tg.slice(0,3).map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'</div>'+
    (it.a?'<div class="ans">정답: '+esc(it.a)+'</div>':'')+
    '<div class="acts">'+it.L.slice(0,2).map(function(l){return '<a href="'+esc(l[1])+'" target="_blank">'+esc(l[0])+'</a>'}).join('')+'<button class="pv" data-pv="'+it.i+'" title="미리보기">🔍</button></div>'+
    '</div></article>';
}
function render(){
  F=IT.filter(function(it){return match(it)}).sort(sorter); S.lim=PAGE;
  var base=IT.filter(function(it){return match(it,true,false)}), cm={}; base.forEach(function(it){ it.ms.forEach(function(t){cm[t]=(cm[t]||0)+1}) });
  var h='<button class="tab'+(S.mj==='all'?' on':'')+'" data-mj="all">전체 <span class="n">'+base.length+'</span></button>';
  D.majors.forEach(function(m){ h+='<button class="tab'+(S.mj===m.k?' on':'')+'" data-mj="'+esc(m.k)+'" style="--c:'+m.color+'">'+m.icon+' '+m.name+' <span class="n">'+(cm[m.k]||0)+'</span></button>'; });
  $('tabs').innerHTML=h;
  var gb=IT.filter(function(it){return match(it,false,true)}), cg={}; gb.forEach(function(it){cg[it.g]=(cg[it.g]||0)+1});
  $('chips').innerHTML='<button class="chip'+(S.g==='all'?' on':'')+'" data-g="all">전체 <span class="n">'+gb.length+'</span></button>'+D.groups.map(function(g){return '<button class="chip'+(S.g===g?' on':'')+'" data-g="'+esc(g)+'">'+esc(g)+' <span class="n">'+(cg[g]||0)+'</span></button>'}).join('');
  var tr=IT.filter(function(it){return match(it,true,true)}), t='';
  D.majors.forEach(function(m){
    var inM=tr.filter(function(it){return it.ms.indexOf(m.k)>=0}); if(!inM.length) return;
    t+='<div class="mj" data-mj="'+esc(m.k)+'"><span class="dot" style="background:'+m.color+'"></span>'+m.icon+' '+m.name+'<span class="cnt">'+inM.length+'</span></div>';
    D.groups.forEach(function(g){ var c=inM.filter(function(it){return it.g===g}).length; if(c) t+='<div class="mn'+(S.mj===m.k&&S.g===g?' on':'')+'" data-mj="'+esc(m.k)+'" data-g="'+esc(g)+'">'+esc(g)+'<span class="cnt">'+c+'</span></div>'; });
  });
  $('tree').innerHTML=t;
  var pills=[]; if(S.mj!=='all') pills.push(['mj',S.mj]); if(S.g!=='all') pills.push(['g',S.g]); if(S.yr!=='all') pills.push(['yr',S.yr+'년']); if(S.q) pills.push(['q','“'+S.q+'”']);
  $('resLine').innerHTML='<span><b>'+F.length+'</b>개 문항</span>'+pills.map(function(p){return '<span class="pill">'+esc(p[1])+' <button data-clr="'+p[0]+'">×</button></span>'}).join('')+(pills.length?'<span class="pill"><button data-clr="all">모두 지우기</button></span>':'');
  draw();
}
function draw(){
  if(!F.length){ $('content').innerHTML='<div class="empty"><b>🔭</b>조건에 맞는 문항이 없습니다.</div>'; return; }
  var h='', shown=0, lim=S.lim;
  if(S.sort==='topic'){
    D.majors.forEach(function(m){
      if(shown>=lim) return;
      var inM=F.filter(function(it){return it.mj===m.k}); if(!inM.length) return;
      h+='<section class="sec"><div class="sec-h"><span class="ic">'+m.icon+'</span><h2 style="color:'+m.color+'">'+m.name+'</h2><span class="cnt">'+inM.length+'문항</span></div>';
      D.groups.forEach(function(g){
        if(shown>=lim) return;
        var inG=inM.filter(function(it){return it.g===g}); if(!inG.length) return;
        var part=inG.slice(0,Math.max(0,lim-shown)); shown+=part.length;
        h+='<div class="minor-h" style="--c:'+m.color+'"><span class="code">'+esc(g)+'</span><h3>'+esc(g)+'</h3><span class="desc">'+inG.length+'문항</span></div><div class="grid">'+part.map(card).join('')+'</div>';
      });
      h+='</section>';
    });
  } else { var part=F.slice(0,lim); shown=part.length; h='<div class="grid">'+part.map(card).join('')+'</div>'; }
  if(shown<F.length) h+='<button class="more" id="more">더 보기 ('+shown+' / '+F.length+')</button>';
  $('content').innerHTML=h;
  if($('more')) $('more').onclick=function(){ S.lim+=PAGE; draw(); };
}
$('tree').onclick=function(e){ var a=e.target.closest('[data-mj]'); if(!a) return; S.mj=a.dataset.mj; S.g=a.dataset.g||'all'; render(); $('mainWrap').scrollIntoView(); };
$('resLine').onclick=function(e){ var b=e.target.closest('[data-clr]'); if(!b) return; var k=b.dataset.clr;
  if(k==='mj'||k==='all') S.mj='all'; if(k==='g'||k==='all') S.g='all'; if(k==='yr'||k==='all'){ S.yr='all'; $('yf').value='all'; } if(k==='q'||k==='all'){ S.q=''; $('q').value=''; } render(); };
/* modal */
var CUR=null;
function openModal(i){
  var it=IT[i]; if(!it) return; CUR=i; var m=MJ[it.mj]||D.majors[0];
  $('mbox').style.setProperty('--c',m.color);
  $('mFig').innerHTML=it.th?'<img src="'+esc(it.th)+'" alt="">':'<span style="font-size:80px;opacity:.3">'+m.icon+'</span>';
  $('mTxt').className='mtxt';
  $('mTxt').innerHTML='<div class="top"><span class="badge" style="position:static;--c:'+m.color+'">'+esc(it.c)+'</span><span class="pill">'+it.ms.map(function(t){return (MJ[t]?MJ[t].icon+' ':'')+esc(t)}).join(' · ')+'</span></div>'+
    '<h3>'+esc(it.t)+'</h3><div class="en">'+esc(it.s)+'</div>'+
    '<div class="tags">'+it.tg.map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'</div>'+
    (it.a?'<div class="mans">정답: '+esc(it.a)+'</div>':'')+
    (it.bd?'<div class="note">이 문항은 여러 문항이 묶인 시험지 PDF 안에 있습니다. 미리보기는 시험지 첫 쪽입니다.</div>':'')+
    (it.au?'<div class="note">주제는 키워드로 자동 분류했습니다.</div>':'')+
    '<div class="mbtns">'+it.L.map(function(l,j){return '<a class="'+(j===0?'pri':'')+'" href="'+esc(l[1])+'" target="_blank">'+esc(l[0])+' 열기 ↗</a>'}).join('')+(it.a?'<button id="mRev">정답 보기</button>':'')+'</div>';
  if($('mRev')) $('mRev').onclick=function(){ $('mTxt').classList.toggle('reveal'); this.textContent=$('mTxt').classList.contains('reveal')?'정답 숨기기':'정답 보기'; };
  $('modal').classList.add('on'); $('modal').setAttribute('aria-hidden','false'); document.body.style.overflow='hidden';
}
function closeModal(){ $('modal').classList.remove('on'); $('modal').setAttribute('aria-hidden','true'); document.body.style.overflow=''; }
function step(d){ var L=F.length?F:IT, k=-1; for(var j=0;j<L.length;j++) if(L[j].i===CUR) k=j; if(k<0) return; openModal(L[(k+d+L.length)%L.length].i); }
$('content').addEventListener('click',function(e){ var b=e.target.closest('[data-pv]'); if(b) openModal(+b.dataset.pv); });
$('mClose').onclick=closeModal; $('mPrev').onclick=function(){step(-1)}; $('mNext').onclick=function(){step(1)};
$('modal').onclick=function(e){ if(e.target===$('modal')) closeModal(); };
render();
})();
</script>
</body>
</html>
