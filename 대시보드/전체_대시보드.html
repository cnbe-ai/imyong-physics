<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>임용 물리 전체 문항 검색</title>
<style>
:root{--bg:#f4f5fa;--panel:#fff;--panel2:#f8f9fc;--ink:#1b1f2a;--muted:#5b6475;--faint:#8a93a6;--line:#e3e6ef;--accent:#3b3486;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 6px 18px rgba(20,24,40,.06);--shadow2:0 4px 10px rgba(20,24,40,.08),0 18px 40px rgba(20,24,40,.14);
  --thumb:#fff;--chip:#eef0f7;--radius:16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1220;--panel:#171b2c;--panel2:#1d2236;--ink:#e8eaf3;--muted:#a7aec4;--faint:#7c849c;
  --line:#2a3048;--accent:#a99ff5;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--shadow2:0 6px 14px rgba(0,0,0,.45),0 22px 44px rgba(0,0,0,.5);--thumb:#f7f8fb;--chip:#242a42}}
:root[data-theme="dark"]{--bg:#0f1220;--panel:#171b2c;--panel2:#1d2236;--ink:#e8eaf3;--muted:#a7aec4;--faint:#7c849c;
  --line:#2a3048;--accent:#a99ff5;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--shadow2:0 6px 14px rgba(0,0,0,.45),0 22px 44px rgba(0,0,0,.5);--thumb:#f7f8fb;--chip:#242a42}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none} button{font:inherit;color:inherit}
.wrap{max-width:1480px;margin:0 auto;padding:0 20px}
.hero{background:radial-gradient(1200px 400px at 10% -10%,rgba(255,255,255,.12),transparent 60%),linear-gradient(135deg,#1b1f2a,#2b2766 55%,#5b4fc4);color:#fff;padding:30px 0 24px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:22px 22px;pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:700}
.hero h1{margin:6px 0 4px;font-size:clamp(24px,3.2vw,38px);font-weight:900;letter-spacing:-.02em}
.hero p{margin:0;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:20px}
.stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:26px;font-weight:900;line-height:1.1}.stat span{font-size:12.5px;opacity:.8}
.dist{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:18px;background:rgba(255,255,255,.12)}.dist i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px;cursor:pointer}.legend span:hover{text-decoration:underline}
.legend em{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-top:12px;padding-bottom:12px}
.search{flex:1 1 260px;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:15px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--panel2)}
.tabs,.chips{display:flex;gap:6px;flex-wrap:wrap}
.tab,.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;cursor:pointer;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.chip{padding:5px 11px;font-size:12.5px}
.tab .n,.chip .n{font-size:11.5px;font-weight:800;background:var(--chip);border-radius:99px;padding:0 7px;color:var(--muted)}
.tab:hover,.chip:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.tab.on,.chip.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.tab.on .n,.chip.on .n{background:rgba(255,255,255,.25);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel,.tbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;font-size:13.5px;color:var(--ink);cursor:pointer}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.row2{width:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row2 .lab{font-size:12px;color:var(--faint);font-weight:800}
.main{display:grid;grid-template-columns:250px 1fr;gap:24px;padding-top:22px;padding-bottom:60px}
.side{position:sticky;top:130px;align-self:start;max-height:calc(100vh - 150px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px;box-shadow:var(--shadow)}
.side h4{margin:4px 6px 10px;font-size:12px;letter-spacing:.1em;color:var(--faint)}
.tree .mj{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;cursor:pointer;font-weight:800;font-size:14px}
.tree .mj:hover,.tree .mn:hover{background:var(--panel2)}
.tree .dot{width:10px;height:10px;border-radius:3px}
.tree .cnt{margin-left:auto;font-size:12px;color:var(--faint);font-weight:700}
.tree .mn{display:flex;gap:8px;padding:5px 8px 5px 26px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.tree .mn.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink);font-weight:700}
.tree .mn.zero{opacity:.38}
.result-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;color:var(--muted);font-size:14px}.result-line b{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:700;color:var(--ink)}
.pill button{border:0;background:none;cursor:pointer;color:var(--faint);padding:0;font-size:14px}
.sec{margin:0 0 30px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--line)}
.sec-h .ic{font-size:22px}.sec-h h2{margin:0;font-size:22px;font-weight:900}.sec-h .cnt{margin-left:auto;font-weight:800;color:var(--faint);font-size:13px}
.minor-h{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px}
.minor-h h3{margin:0;font-size:16px;font-weight:800}.minor-h .desc{color:var(--faint);font-size:12.5px}
.minor-h .code{font-size:12px;font-weight:800;color:#fff;background:var(--c);border-radius:6px;padding:1px 7px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s,border-color .18s;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow2);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c);z-index:1}
.thumb{display:block;background:var(--thumb);aspect-ratio:16/11;position:relative;border-bottom:1px solid var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .25s}
.card:hover .thumb img{transform:scale(1.04)}
.thumb .noimg{display:flex;align-items:center;justify-content:center;height:100%;font-size:40px;opacity:.35}
.thumb .go{position:absolute;right:8px;bottom:8px;background:rgba(27,31,42,.82);color:#fff;font-size:11.5px;font-weight:700;border-radius:8px;padding:3px 8px;opacity:0;transition:opacity .18s}
.card:hover .thumb .go{opacity:1}
.badge{position:absolute;left:10px;top:12px;font-size:11.5px;font-weight:800;color:#fff;background:var(--c);border-radius:7px;padding:2px 7px;box-shadow:0 2px 6px rgba(0,0,0,.18);z-index:2;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{padding:11px 13px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);font-weight:700;flex-wrap:wrap}
.meta .rc{font-size:10.5px;background:var(--chip);border-radius:6px;padding:0 6px}
.meta .rc.deep{background:#ffd84d;color:#3b2f00;font-weight:800}
.ko{font-weight:800;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.en{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:4px}.tags span{font-size:11.5px;background:var(--chip);color:var(--muted);border-radius:6px;padding:1px 7px;font-weight:600}
.tags span.tp{color:#fff;background:var(--tc)}
.ans{display:none;font-size:12.5px;background:color-mix(in srgb,#2e9e5b 14%,transparent);border-radius:8px;padding:5px 8px;font-weight:700}
body.show-ans .ans{display:block}
.acts{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.acts a,.acts button{flex:1;text-align:center;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:6px 4px;font-size:12.5px;font-weight:800;cursor:pointer}
.acts a:hover,.acts button:hover{background:var(--c);border-color:var(--c);color:#fff}.acts .pv{flex:0 0 38px}
body.list .grid{grid-template-columns:1fr}
body.list .card{flex-direction:row}
body.list .card::before{width:4px;height:auto;bottom:0;right:auto}
body.list .thumb{width:170px;flex:0 0 170px;aspect-ratio:auto;border-bottom:0;border-right:1px solid var(--line)}
body.list .ko{-webkit-line-clamp:1;min-height:0}body.list .acts{max-width:330px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}.empty b{display:block;font-size:40px;margin-bottom:8px}
.more{display:block;margin:18px auto 0;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 22px;font-weight:800;cursor:pointer}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,12,24,.55);backdrop-filter:blur(4px)}
.modal.on{display:flex}
.mbox{background:var(--panel);border-radius:20px;max-width:1000px;width:100%;max-height:calc(100vh - 40px);overflow:auto;box-shadow:var(--shadow2);display:grid;grid-template-columns:1.1fr 1fr;position:relative}
.mfig{background:var(--thumb);padding:18px;display:flex;align-items:flex-start;justify-content:center;border-right:1px solid var(--line);position:relative}
.mfig img{width:100%;height:auto;max-height:76vh;object-fit:contain;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.mfig::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.mtxt{padding:24px 24px 20px;display:flex;flex-direction:column;gap:10px}
.mtxt .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mtxt h3{margin:2px 0 0;font-size:21px;font-weight:900;line-height:1.35}
.mtxt .en{white-space:normal;font-size:14px}
.mtxt .mans{display:none;background:color-mix(in srgb,#2e9e5b 14%,transparent);border-radius:12px;padding:10px 14px;font-weight:800}
.mtxt.reveal .mans{display:block}
.mtxt .note{font-size:12.5px;color:var(--faint)}
.mbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.mbtns a,.mbtns button{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:9px 14px;font-weight:800;font-size:14px;cursor:pointer}
.mbtns .pri{background:var(--c);border-color:var(--c);color:#fff}
.mclose{position:absolute;right:12px;top:10px;border:0;background:var(--panel2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;z-index:2}
.mnav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:var(--panel);box-shadow:var(--shadow2);width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:18px;z-index:51}
.mnav.prev{left:14px}.mnav.next{right:14px}
.foot{color:var(--faint);font-size:12.5px;padding:24px 0 40px;text-align:center}.foot a{color:var(--accent);font-weight:700}
.top-btn{position:fixed;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;box-shadow:var(--shadow2);cursor:pointer;font-size:18px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.top-btn.on{opacity:1;pointer-events:auto}
@media (max-width:980px){.bar{position:static}.main{grid-template-columns:1fr}.side{position:static;max-height:none}.mbox{grid-template-columns:1fr}.mfig{border-right:0;border-bottom:1px solid var(--line)}.mnav{display:none}}
@media (max-width:560px){.wrap{padding:0 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ko{font-size:13px}.tags,.en{display:none}body.list .thumb{width:100px;flex-basis:100px}}
.card .ans{display:none!important} #ansBtn{display:none!important}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="kicker">Teacher Certification Exam · 중등교사 임용시험 물리 기출</div>
  <h1>임용 물리 전체 문항 검색</h1><p id="heroSub"></p>
  <div class="stats" id="stats"></div><div class="dist" id="dist"></div><div class="legend" id="legend"></div>
</div></header>
<div class="bar"><div class="wrap">
  <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="제목·학년도·분류·태그로 찾기 (예: 퍼텐셜, 2003, 오수벨, 1.4.1.1)" autocomplete="off"><kbd>/</kbd></label>
  <div class="tools">
    <select class="sel" id="yf" title="연도"></select>
    <select class="sel" id="sort" title="정렬"><option value="topic">주제별 묶음</option><option value="new">최신순</option><option value="old">오래된 순</option><option value="group">갈래순</option></select>
    <button class="tbtn" id="vGrid" title="카드 보기">▦</button><button class="tbtn" id="vList" title="목록 보기">☰</button>
    <button class="tbtn" id="ansBtn" title="카드에 정답 표시">정답</button>
    <select class="sel" id="clickTo" title="썸네일 클릭 시 여는 자료"><option value="0">클릭 → 학생용</option><option value="1">클릭 → 교사용</option><option value="2">클릭 → 원문 PDF</option></select>
    <button class="tbtn" id="rand" title="무작위 문제">🎲</button><button class="tbtn" id="theme" title="밝게/어둡게">◐</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="row2"><span class="lab" id="glab"></span><div class="chips" id="chips"></div></div>
</div></div>
<div class="wrap main" id="mainWrap">
  <aside class="side"><h4>주제 › <span id="glab2"></span></h4><div class="tree" id="tree"></div></aside>
  <section><div class="result-line" id="resLine"></div><div id="content"></div></section>
</div>
<div class="foot wrap" id="foot"></div>
<div class="modal" id="modal" aria-hidden="true">
  <button class="mnav prev" id="mPrev" title="이전 (←)">‹</button>
  <div class="mbox" id="mbox" role="dialog" aria-modal="true"><button class="mclose" id="mClose" title="닫기 (Esc)">×</button><div class="mfig" id="mFig"></div><div class="mtxt" id="mTxt"></div></div>
  <button class="mnav next" id="mNext" title="다음 (→)">›</button>

재), 보어 가설의 발머 계열 설명과 새 계열 예측의 확인. (다): 아스페의 벨 부등식 검증 실험은 두 ", "tg": ["5.2.2.1 보어 원자 모형과 수소 스펙트럼", "E5 과학의 본성과 과학사", "과학사", "양자 역학"], "a": "㉠㉡ 가설(이론)을 검증하여 과학 지식으로 정당화(입증)하는 역할 — 예: 1908년 페랭이 물 분자의 크기를 측정해 원자의 존재가 받아들여졌다(또는 보어 가설로 예측한 수소 스펙트럼 계열이 실험으로 확인됨). / (다) 아스페의 벨 부등식 검증 실험 — 두 경쟁 이론(숨은 변수 결정론과 양자 역학)이 서로 다른 결과를 예측하며, 실험 결과 벨 부등식이 성립하지 않고 양자 역학의 예측값과 일치하여 결정론을 반증하고 양자적 실체를 받아들이게 했기 때문", "th": "../학습지/_썸네일/PTE-2026-A-06.png", "L": [["학생용", "../학습지/2_물리교육론/2026/PTE-2026-A-06_학생용.html"], ["교사용", "../학습지/2_물리교육론/2026/PTE-2026-A-06_교사용.html"], ["원문 PDF", "../문항모음/2026_중등1차_물리_전공A.pdf#page=4"]], "au": false, "bd": false}, {"id": "PTE-2026-A-07", "c": "2026 1차 전공A 7번", "mj": "물리교육론", "ms": ["물리교육론", "파동 및 광학"], "g": "물리교육론", "y": 2026, "t": "볼록 렌즈 수업 — 로슨의 서술적 순환학습, 교육과정 범위, 초점 거리 측정 방법", "s": "2026학년도 1차 전공A 7번 · 난이도 ★★☆☆☆ · 4.2.1.3 렌즈 방정식과 광학 기기 · 로슨의 순환학습: 서술적(관찰·규칙성 서술), 경험–귀추적(원인 가설 생성), 가설–연역적(가설 검증). 탐색에서 관찰로 규칙성만 찾음 → 서술적 순환학습. 초점 거리: 먼 광원의 평행광을 한 점에 모으는 거리, 또", "tg": ["4.2.1.3 렌즈 방정식과 광학 기기", "E6 과학 수업 모형과 교수 전략", "E1 과학과 교육과정", "볼록 렌즈", "초점 거리"], "a": "㉠ 서술적 순환학습 — 탐색 단계에서 렌즈와 물체 사이 거리를 바꾸며 상을 관찰하고 규칙성을 찾아 서술할 뿐, 가설을 세우거나 검증하는 과정이 없기 때문 / ㉡ 적절하지 않다. 2022 개정 과학과 교육과정 ‘물리학’에서는 볼록 렌즈(단일 렌즈)에 의해 상이 맺히는 과정을 다루며, 복합 렌즈에 의한 상은 다루지 않도록 하고 있기 때문이다. / ㉢ ① 멀리 있는 광원(태양 등)에서 오는 평행광을 렌즈로 모아 가장 작고 밝은 점이 생기는 렌즈–스크린 거리를 측정한다. ② 물체와 같은 크기의 실상이 맺히는 위치를 찾아 렌즈–물체 거리(2f)의 절반을 초점 거리로 한다.", "th": "../학습지/_썸네일/PTE-2026-A-07.png", "L": [["학생용", "../학습지/2_물리교육론/2026/PTE-2026-A-07_학생용.html"], ["교사용", "../학습지/2_물리교육론/2026/PTE-2026-A-07_교사용.html"], ["원문 PDF", "../문항모음/2026_중등1차_물리_전공A.pdf#page=5"]], "au": false, "bd": false}, {"id": "PTE-2026-B-03", "c": "2026 1차 전공B 3번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2026, "t": "저항과 전압의 관계 실험 설계 — 변인 통제, 자료 해석, 비고츠키의 발달 수준", "s": "2026학년도 1차 전공B 3번 · 난이도 ★★☆☆☆ · 3.2.1.1 전류, 저항, 옴의 법칙 · 저항–전압 관계를 보려면 전류를 일정하게(통제 변인) — 직렬 연결. 결과: 전류가 같을 때 전압은 저항에 비례. 비고츠키: 실제적 발달 수준(혼자 해결) vs 잠재적 발달 수준(도움으로 해결).", "tg": ["3.2.1.1 전류, 저항, 옴의 법칙 \right], U=\\tfrac\\alpha2(2y_1+y_3)^2+\\tfrac", "tg": ["1.4.1.3 연성 진동, 감쇠·강제 진동과 공명", "연결된 진동", "단진동"], "a": "(1) L=\\dfrac m2\\left[\\dot y_1^2+\\dot y_3^2+(\\dot y_1+\\dot y_3)^2\\right]-\\dfrac\\alpha2\\left[(2y_1+y_3)^2+(y_1+2y_3)^2\\right] / (2) m(2\\ddot y_1+\\ddot y_3)=-\\alpha(5y_1+4y_3) / (3) \\omega=\\sqrt{\\dfrac{3\\alpha}{m}} (진동수 f=\\dfrac{1}{2\\pi}\\sqrt{\\dfrac{3\\alpha}{m}})", "th": "../학습지/_썸네일/PTE-2024-B-11.png", "L": [["학생용", "../학습지/1_내용학/2024/PTE-2024-B-11_학생용.html"], ["교사용", "../학습지/1_내용학/2024/PTE-2024-B-11_교사용.html"], ["원문 PDF", "../문항모음/2024_중등1차_물리_전공B.pdf#page=7"]], "au": false, "bd": false}, {"id": "PTE-2024-A-05", "c": "2024 1차 전공A 5번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2024, "t": "밀리컨의 기름방울 실험과 자료 선별 논쟁 — 가설 연역적 탐구와 가치·태도 요소", "s": "2024학년도 1차 전공A 5번 · 난이도 ★★☆☆☆ · 3.1.1.1 쿨롱의 법칙과 전하 보존 · 가설을 먼저 세우고(모든 전하는 기본 전하량의 배수) 그로부터 예측되는 결과를 실험으로 검증 → 가설 연역적 탐구. (나)에는 자료 선별의 정당성 논쟁(과학 활동의 윤리성)과 ‘아름다운 결과’(과학의 심미적 가치)가", "tg": ["3.1.1.1 쿨롱의 법칙과 전하 보존", "E4 과학 탐구와 과학적 사고", "E5 과학의 본성과 과학사", "E1 과학과 교육과정", "과학사", "탐구 방법", "연구 윤리"], "a": "㉠ 가설 연역적 탐구 방법 — 밀리컨이 ‘모든 전하는 기본 전하량의 배수’라는 가설을 먼저 세우고, 기름방울 실험 결과로 이 가설을 검증했기 때문 / (나) ① 과학 활동의 윤리성: 140회 중 가설을 뒷받침하는 58회 자료만 골라 발표하면서 모든 결과를 수록했다고 거짓으로 적음 ② 과학의 심미적 가치: ‘아름다운 결과’ — 잘 통제된 실험 결과가 기본 전하량의 존재를 명확하고 단순하게 보여 줌(“발표할 만큼 아름다움”)", "th": "../학습지/_썸네일/PTE-2024-A-05.png", "L": [["학생용", "../학습지/2_물리교육론/2024/PTE-2024-A-05_학생용.html"], ["교사용", "../학습지/2_물리교육론/2024/PTE-2024-A-05_교사용.html"], ["원문 PDF", "../문항모음/2024_중등1차_물리_전공A.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2024-A-06", "c": "2024 1차 전공A 6번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2024, "t": "전동기로 옴의 법칙 확인하기 — 역기전력, 포퍼·쿤·라카토스의 과학철학", "s": "2024학년도 1차 전공A 6번 · 난이도 ★★★☆☆ · 3.2.2.3 패러데이 전자기 유도 법칙과 렌츠의 법칙 · 회전하는 전동기 코일에는 전자기 유도로 역기전력 \\varepsilon=k\\omega가 생겨 I=\\dfrac{V-\\varepsilon}{R}로 전류가 줄어든다(멈추면 V/I\\approx R). 반증주의는 반증 사례 하", "tg": ["3.2.2.3 패러데이 전자기 유도 법칙과 렌츠의 법칙", "3.2.1.1 전류, 저항, 옴의 법칙", "E5 과학의 본성과 과학사", "E4 과학 탐구와 과학적 사고", "옴의 법칙", "전자기 유도", "과학의 본성"], "a": "㉠ 회전하는 전동기에서 전자기 유도로 역기전력이 생겨 전류가 V/R보다 작아진다(회전하지 않으면 역기전력이 없어 V/I\\approx R). 반증주의의 한계: 반증 사례가 이론이 아니라 보조 가설(전동기를 순수 저항으로 본 가정)·실험 조건의 문제일 수 있는데 이를 구분하지 못하고 이론을 성급히 폐기하게 된다. / B·C 공통점(쿤): 두 학생 모두 옴의 법칙(패러다임)을 유지하며 변칙 사례를 패러다임 안에서 해결하려는 정상과학의 태도를 보인다. 차이점(라카토스): 둘 다 견고한 핵(옴의 법칙)을 지키지만, B는 ‘오차’라는 임시방편으로 변칙을 덮어 새 예측이 없는 퇴행적 태도, C는 보호대(보조 가설)를 수정해 새로운 예측을 하고 추가 실험으로 검증하려는 전진적 태도이다.", "th": "../학습지/_썸네일/PTE-2024-A-06.png", "L": [["학생용", "../학습지/2_물리교육론/2024/PTE-2024-A-06_학생용.html"], ["교사용", "../학습지/2_물리교육론/2024/PTE-2024-A-06_교사용.html"], ["원문 PDF", "../문항모음/2024_중등1차_물리_전공A.pdf#page=4"]], "au": false, "bd": false}, {"id": "PTE-2024-A-07", "c": "2024 1차 전공A 7번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2024, "t": "되돌아오는 부메랑 — 귀추적 추론으로 가설 세우기와 가설 평가·검증 실험 설계", "s": "2024학년도 1차 전공A 7번 · 난이도 ★★☆☆☆ · 1.3.1.3 각운동량 보존과 롤링 운동 · 귀추: 놀라운 현상 → 유사 사례 탐색 → 그 사례의 원리를 빌려 ‘이 현상도 그렇다면 설명된다’는 가설 생성. 좋은 가설의 조건: 관찰 사실을 인과적으로 설명(설명력), 기존 과학 이론과 정합, 검증 가능성 등.", "tg": ["1.3.1.3 각운동량 보존과 롤링 운동", "1.3.2.3 유체 동역학 (연속 방정식, 베르누이 방정식)", "E4 과학 탐구와 과학적 사고", "가설 세우기", "세차 운동", "양력"], "a": "㉠ ① 가설이 관찰 사실(부메랑이 처음엔 똑바로 서서 회전하다 점차 기울어진 채 회전)과 일치하며 진행 방향이 휘어 되돌아오는 현상을 인과적으로 설명한다(설명력). ② 이미 인정된 과학 원리인 각운동량 보존 법칙(세차 운동)에 근거하여 기존 과학 지식과 정합한다. / ㉡ ㉡: 부메랑 날개 단면이 비행기 날개처럼 위는 볼록하고 아래는 평평하여, 날아갈 때 두 면 사이의 압력 차(양력)로 볼록한 면 쪽으로 힘을 받아 진행 방향이 휘어 되돌아온다. 실험: 날개 단면만 다른(볼록–평평 / 양면 평평) 두 부메랑을 크기·질량·던지는 속력·각도·회전을 같게 하여 던지고 경로가 휘는 정도와 되돌아오는지를 비교한다.", "th": "../학습지/_썸네일/PTE-2024-A-07.png", "L": [["학생용", "../학습지/2_물리교육론/2024/PTE-2024-A-07_학생용.html"], ["교사용", "../학습지/2_물리교육론/2024/PTE-2024-A-07_교사용.html"], ["원문 PDF", "../문항모음/2024_중등1차_물리_전공A.pdf#page=4"]], "au": false, "bd": false}, {"id": "PTE-2024-B-03", "c": "2024 1차 전공B 3번", "mj": "물리교육론", "ms": ["물리교육론", "현대물리학"], "g": "물리교육론", "y": 2024, "t": "특수상대성 이론 수업 지도안 — 드라이버의 개념변화 학습 모형, 포스너의 개념변화 조건, GPS 시간 보정", "s": "2024학년도 1차 전공B 3번 · 난이도 ★★☆☆☆ · 5.1.1.2 시간 지연과 길이 수축 · 드라이버(R. Driver) 모형: 오리엔테이션 rac12mr^2\\sin^2\\theta_0\\dot\\phi^2-mgr\\cos\\theta_0+Mg(l-r) / (2) (m+M)\\ddot r=mr\\sin^2\\theta_0\\dot\\phi^2-(m\\cos\\theta_0+M)g / (3) L_z=mr_0^2\\sin^2\\theta_0\\dot\\phi=\\sin\\theta_0\\sqrt{m(m\\cos\\theta_0+M)gr_0^3}", "th": "../학습지/_썸네일/PTE-2022-B-10.png", "L": [["학생용", "../학습지/1_내용학/2022/PTE-2022-B-10_학생용.html"], ["교사용", "../학습지/1_내용학/2022/PTE-2022-B-10_교사용.html"], ["원문 PDF", "../문항모음/2022_중등1차_물리_전공B.pdf#page=7"]], "au": false, "bd": false}, {"id": "PTE-2022-B-11", "c": "2022 1차 전공B 11번", "mj": "열역학 및 통계물리", "ms": ["열역학 및 통계물리"], "g": "내용학", "y": 2022, "t": "단원자 이상 기체의 다섯 과정 순환 — 방출된 열과 한 일", "s": "2022학년도 1차 전공B 11번 · 난이도 ★★☆☆☆ · 2.2.2.1 열역학 제1법칙과 열역학적 과정 · 단원자: \\Delta U=\\tfrac32\\Delta(PV). 정적 Q=\\tfrac32V\\Delta P, 정압 Q=\\tfrac52P\\Delta V, 등온 Q=W=PV\\ln(V_f/V_i). D→E→A: Q=-6-7.5", "tg": ["2.2.2.1 열역학 제1법칙과 열역학적 과정", "2.2.2.3 열기관, 냉동기, 카르노 사이클", "2.2.1.1 이상기체 방정식", "P-V 그래프", "열과 일", "내부 에너지"], "a": "(1) \\dfrac{|Q_{\\rm out}|}{P_0V_0}=\\dfrac{27}{2}=13.5 / (2) \\dfrac{|W|}{P_0V_0}=1+8\\ln2\\approx6.55", "th": "../학습지/_썸네일/PTE-2022-B-11.png", "L": [["학생용", "../학습지/1_내용학/2022/PTE-2022-B-11_학생용.html"], ["교사용", "../학습지/1_내용학/2022/PTE-2022-B-11_교사용.html"], ["원문 PDF", "../문항모음/2022_중등1차_물리_전공B.pdf#page=7"]], "au": false, "bd": false}, {"id": "PTE-2022-A-05", "c": "2022 1차 전공A 5번", "mj": "물리교육론", "ms": ["물리교육론", "열역학 및 통계물리"], "g": "물리교육론", "y": 2022, "t": "단열 컵 오개념과 라카토스의 긍정적 발견법 — 입자 그리기로 사우나 화상 설명하기", "s": "2022학년도 1차 전공A 5번 · 난이도 ★★☆☆☆ · 2.1.2.2 열전달 메커니즘 (전도, 대류, 복사) · 단열 성능은 재질의 열전도도로 결정되며 뜨거운 것·차가운 것 모두에 똑같이 작용한다. 라카토스: 반례가 나와도 학습자는 핵심부를 지키려 보호대(보조 가설)를 고친다 — 긍정적 발견법. 80 ℃ 공기는 물보다 입자가 ", "tg": ["2.1.2.2 열전달 메커니즘 (전도, 대류, 복사)", "2.2.1.2 기체 분자의 RMS 속도와 내부에너지", "E3 오개념과 개념 변화", "E5 과학의 본성과 과학사", "열의 이동", "단열", "입자 모형"], "a": "오개념 단열이 잘 되는 재질이 찬물·뜨거운 물에 따라 다르다고 생각함 — ‘스테인리스(금속) 컵은 차가움을 잘 유지하고, 스타이로폼 컵은 따뜻함을 잘 유지한다’는 오개념 (실제로는 스타이로폼이 두 경우 모두 단열이 가장 잘 됨) / 라카토스 학생의 오개념은 라카토스의 견고한 핵에 해당한다. 긍정적 발견법에 따라 학생은 [활동 1]의 결과(변칙 사례)를 접해도 핵을 버리지 않고 보호대(보조 가설: 컵 두께·측정 시간 등)를 수정·보완하여 설명하므로, 반례 실험만으로는 오개념이 바뀌지 않을 수 있다. / ㉠ 입자 사이의 거리(같은 부피 속 입자의 개수, 밀도) — 물 입자는 빽빽하게, 공기 입자는 듬성듬성하게 그린다. / ㉡ 눈에 보이지 않는 입자의 분포(밀도 차이)를 시각적으로 표현해, 같은 온도라도 공기는 ", "th": "../학습지/_썸네일/PTE-2022-A-05.png", "L": [["학생용", "../학습지/2_물리교육론/2022/PTE-2022-A-05_학생용.html"], ["교사용", "../학습지/2_물리교육론/2022/PTE-2022-A-05_교사용.html"], ["원문 PDF", "../문항모음/2022_중등1차_물리_전공A.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2022-A-06", "c": "2022 1차 전공A 6번", "mj": "물리교육론", "ms": ["물리교육론", "역학", "파동 및 광학"], "g": "물리교육론", "y": 2022, "t": "압력 탐구 활동의 귀납적 사고와 뉴턴 입자설의 귀추적 사고 — 포퍼로 본 파동설의 지지", "s": "2022학년도 1차 전공A 6번 · 난이도 ★★☆☆☆ · 1.3.2.3 유체 동역학 (연속 방정식, 베르누이 방정식) · 귀납: 여러 관찰 사례에서 공통 규칙성을 찾아 일반화. 귀추: 관찰된 현상을 설명할 수 있는 가설(원인, 보이지 않는 실체)을 제안. 포퍼: 이론은 증명되지 않으며, 반증 가능한 대담한 예측이 반증 시험을 견디면 확", "tg": ["1.3.2.3 유체 동역학 (연속 방정식, 베르누이 방정식)", "4.2.1.1 반사의 법칙과 스넬의 법칙", "E4 과학 탐구와 과학적 사고", "E5 과학의 본성과 과학사", "과학적 사고", "빛의 본성 과학사", "유체의 압력"], "a": "㉠·㉡ ㉠ 귀납적 사고, ㉡ 귀추적 사고 / 차이점 귀납은 여러 관찰 사례로부터 공통 규칙성을 찾아 일반화하는 것(결론이 관찰 가능한 현상 수준)이고, 귀추는 관찰된 현상을 설명하기 위해 그 원인이 되는 가설(관찰할 수 없는 실체 포함)을 제안하는 것이다. / ㉢ 포퍼에 따르면 이론은 증명될 수 없고 반증 시도를 견딜 때 잠정적으로 지지된다. 파동설은 ‘빛은 물에서 더 느리게 진행한다’는 반증 가능한 예측을 했고, 피조·푸코의 실험에서 반증되지 않고 살아남았으므로(확인·입증됨) 지지되었다. 반대 예측을 한 입자설은 반증되었다.", "th": "../학습지/_썸네일/PTE-2022-A-06.png", "L": [["학생용", "../학습지/2_물리교육론/2022/PTE-2022-A-06_학생용.html"], ["교사용", "../학습지/2_물리교육론/2022/PTE-2022-A-06_교사용.html"], ["원문 PDF", "../문항모음/2022_중등1차_물리_전공A.pdf#page=4"]], "au": false, "bd": false}, {"id": "PTE-2022-A-07", "c": "2022 1차 전공A 7번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2022, "t": "솔레노이드 시뮬레이션 수업 — 통합 탐구 과정(변인 통제·자료 변환)과 관찰 체크리스트 평가", "s": "2022학년도 1차 전공A 7번 · 난이도 ★★☆☆☆ · 3.2.2.2 비오-사바르 법칙과 앙페르 법칙 · 통합 탐구 과정: 문제 인식, 가설 설정, 변인 통제, 자료 변환, 자료 해석, 결론 도출, 일반화. 긴 솔레노이드 내부 B=\\mu_0nI — 반지름과 무관, 단위 길이당 감은 수와 전류에 비례.", "tg": ["3.2.2.2 비오-사바르 법칙과 앙페르 법칙", "E4 과학 탐구와 과학적 사고", "E7 실험 지도와 평가", "솔레노이드 자기장", "탐구 과정", "시뮬레이션"], "a": "㉠·㉡ ㉠ 변인 통제, ㉡ 자료 변환 / ㉢ 예비 교사가 전류가 다른데 자기장의 세기가 같은 두 시뮬레이션(솔레노이드 A, B) 결과를 비교해 보여 주며 그 이유를 묻는, 모의 실험과 관련된 문제 상황을 제시했기 때문 / ㉣ 학생 A가 ‘자기장은 반지름과 무관할 것’, 학생 B가 ‘단위 길이당 감은 수에 비례할 것’이라고 시뮬레이션 전에 예측했기 때문", "th": "../학습지/_썸네일/PTE-2022-A-07.png", "L": [["학생용", "../학습지/2_물리교육론/2022/PTE-2022-A-07_학생용.html"], ["교사용", "../학습지/2_물리교육론/2022/PTE-2022-A-07_교사용.html"], ["원문 PDF", "../문항모음/2022_중등1차_물리_전공A.pdf#page=5"]], "au": false, "bd": false}, {"id": "PTE-2022-B-03", "c": "2022 1차 전공B 3번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2022, "t": "드라이버의 개념 변화 학습 모형 — 부도체의 정전기 유도(유전 분극)와 피아제의 평형화", "s": "2022학년도 1차 전공B 3번 · 난이도 ★★☆☆☆ · 3.1.1.1 쿨롱의 법칙과 전하 보존 · 드라이버 모형: 오리엔테이션 → 생각의 표현 → 생각의 재구성(명료화와 교환 → 갈등 상황에의 노출 → 새로운 생각의 구성 → 새로운 생각의 평가) → 생각의 적용 → 생각 변화의 검토. 부도체에서도 대전체 가까이에", "tg": ["3.1.1.1 쿨롱의 법칙과 전하 보존", "3.1.2.3 축전기(커패시터)와 유전체", "E3 오개념과 개념 변화", "E2 학습 이론", "E6 과학 수업 모형과 교수 전략", "정전기 유도", "도체와 부도체", "검전기"], "a": "(다) 학생들이 자신의 생각을 발표하여 명료화하고, 다른 학생의 생각과 비교·교환하면서 자신과 다른 생각이 있음을 인식하게 한다(생각의 명료화와 교환). / (라) 갈등 상황에의 노출 — 시범 실험은 부도체에서도 금속박이 벌어지는 결과를 보여 학생의 예측과 불일치하는 상황을 제시해 인지 갈등(기존 생각에 대한 불만족)을 일으킨다. / 피아제 (다)에서 학생 B는 ‘부도체는 정전기 유도가 없다’는 기존 인지 구조로 평형 상태였으나, (라)의 시범 실험 결과가 기존 구조로 동화되지 않아 인지적 불평형이 생겼다. (마)·(바)에서 새 개념을 받아들여 인지 구조를 수정(조절)하고, (사)·(아)에서 적용·검토하며 새로운 평형에 이르렀다(평형화).", "th": "../학습지/_썸네일/PTE-2022-B-03.png", "L": [["학생용", "../학습지/2_물리교육론/2022/PTE-2022-B-03_학생용.html"], ["교사용", "../학습지/2_물리교육론/2022/PTE-2022-B-03_교사용.html"], ["원문 PDF", "../문항모음/2022_중등1차_물리_전공B.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2022-B-04", "c": "2022 1차 전공B 4번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2022, "t": "물리학Ⅰ 핵심역량과 충격 흡수 장치 설계 과제 — 정보 수집 과제와 모형화 안내", "s": "2022학년도 1차 전공B 4번 · 난이도 ★★☆☆☆ · 1.2.2.1 선운동량과 충격량 · 2015 개정 과학과 핵심역량: 과학적 사고력, 과학적 탐구 능력, 과학적 문제 해결력, 과학적 의사소통 능력, 과학적 참여와 평생 학습 능력. 충격량 I=F_{\\rm 평균}\\Delta t=\\Delta p — 같은 ", "tg": ["1.2.2.1 선운동량과 충격량", "E1 과학과 교육과정", "E6 과학 수업 모형과 교수 전략", "충격량", "안전장치", "문제 해결"], "a": "㉠ 과학적 문제 해결력 / ㉡ ① 생활 속 충격 흡수 장치(에어백, 범퍼, 매트, 놀이터 고무 바닥 등)의 사례를 조사한다. ② 조사한 장치들이 충돌 시간을 늘려 같은 충격량에서 움. ㉢: ‘일 = 힘 × 이동 거리’와 ‘일 = 에너지 전달’이라는", "tg": ["1.2.1.1 일과 운동에너지 정리", "E2 학습 이론", "E3 오개념과 개념 변화", "일과 에너지", "힘이 한 일", "에너지 전달"], "a": "㉠·㉡ 비계(scaffolding) 설정 — 근접 발달 영역 안에서 학생이 스스로 더 높은 수준의 이해에 도달하도록 돕는 언어적 도움 / ㉢ 개념–개념 갈등 (기존 개념과 새로운 개념 사이의 인지 갈등)", "th": "../학습지/_썸네일/PTE-2021-A-01.png", "L": [["학생용", "../학습지/2_물리교육론/2021/PTE-2021-A-01_학생용.html"], ["교사용", "../학습지/2_물리교육론/2021/PTE-2021-A-01_교사용.html"], ["원문 PDF", "../문항모음/2021_중등1차_물리_전공A.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2021-A-05", "c": "2021 1차 전공A 5번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2021, "t": "두 수레의 분리 실험으로 운동량 보존 확인 — 통제 변인, 비례 논리, 분석적 채점", "s": "2021학년도 1차 전공A 5번 · 난이도 ★★☆☆☆ · 1.2.2.1 선운동량과 충격량 · 분리 후 두 수레가 같은 시간 동안 등속으로 움직이게 하면 이동 거리 ∝ 속력 → m_{\\rm A}d_{\\rm A}=m_{\\rm B}d_{\\rm B}로 운동량 보존 확인. 이를 이해하려면 비례 논리(형식적 조작기).", "tg": ["1.2.2.1 선운동량과 충격량", "1.2.2.2 1·2차원 탄성 및 비탄성 충돌", "E4 과학 탐구와 과학적 사고", "E2 학습 이론", "E7 실험 지도와 평가", "운동량 보존", "실험 설계", "비례"], "a": "㉠ ㉠ 두 수레가 분리된 후 책에 충돌할 때까지 걸린 시간(이동 시간). 과정 (마)에서 수레의 출발 위치를 바꾸어 가며 두 수레가 책과 동시에 충돌하는(충돌 소리가 동시에 들리는) 위치를 찾아 두 수레의 운동 시간을 같게 한다. / ㉡ 비례 논리(비례적 추론) / ㉢ 평가 요소(실험 수행, 자료 수집 및 분석과 해석, 결과 정리 및 결론 도출)를 분리하여 각 요소마다 우수·양호·미흡 수준별 점수를 부여하고 합산하는 분석적 채점 기준표로 수정한다(예: 각 3·2·1점, 우수·우수·양호 → 8점).", "th": "../학습지/_썸네일/PTE-2021-A-05.png", "L": [["학생용", "../학습지/2_물리교육론/2021/PTE-2021-A-05_학생용.html"], ["교사용", "../학습지/2_물리교육론/2021/PTE-2021-A-05_교사용.html"], ["원문 PDF", "../문항모음/2021_중등1차_물리_전공A.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2021-A-06", "c": "2021 1차 전공A 6번", "mj": "물리교육론", "ms": ["물리교육론", "현대물리학", "전자기학"], "g": "물리교육론", "y": 2021, "t": "자석으로 문지른 쇠못 — 유추를 이용한 설명 가설 설정 지도", "s": "2021학년도 1차 전공A 6번 · 난이도 ★★☆☆☆ · 5.2.2.3 고체물리 기초 (에너지 밴드와 반도체) · 인과적 의문에 대한 설명 가설을 세우기 위해 유사한 다른 현상(자석 조각을 담은 시험관)을 관찰하고 대응 관계를 찾아 원리를 옮겨 오는 것 = 유추(analogy). 도출 가설: 쇠못 안의 작은 자석(자기 구역)들이", "tg": ["5.2.2.3 고체물리 기초 (에너지 밴드와 반도체)", "3.2.2.1 자기력과 로렌츠 힘", "E4 과학 탐구와 과학적 사고", "자석", "자성체", "가설 세우기"], "a": "(1) 유추(analogy, 유추적 추론) / ㉠·㉡ ㉠ 쇠못을 문지른 현상과 자석 조각을 담은 시험관을 문지른 현상에서 서로 대응되는(유사한) 점은 무엇인가? ㉡ 시험관 속 자석 조각들은 문지르기 전과 후에 각각 어떻게 배열되어 있었기에 클립을 끌어당기게 되었는가? / ㉢ 쇠못 내부에는 작은 자석(자기 구역)들이 무질서하게 배열되어 있다가, 자석으로 문지르면 한 방향으로 정렬되어 쇠못이 자석의 성질을 갖게 된다.", "th": "../학습지/_썸네일/PTE-2021-A-06.png", "L": [["학생용", "../학습지/2_물리교육론/2021/PTE-2021-A-06_학생용.html"], ["교사용", "../학습지/2_물리교육론/2021/PTE-2021-A-06_교사용.html"], ["원문 PDF", "../문항모음/2021_중등1차_물리_전공A.pdf#page=4"]], "au": false, "bd": false}, {"id": "PTE-2021-B-01", "c": "2021 1차 전공B 1번", "mj": "물리교육론", "ms": ["물리교육론", "현대물리학"], "g": "물리교육론", "y": 2021, "t": "선 스펙트럼 수업 — 성취기준의 ‘불연속적인 에너지 준위’와 오수벨의 선행조직자", "s": "2021학년도 1차 전공B 1번 · 난이도 ★☆☆☆☆ · 5.2.2.1 보어 원자 모형과 수소 스펙트럼 · [12물리Ⅰ02-02] 원자 내의 전자는 불연속적인(양자화된) 에너지 준위를 가지고 있음을 스펙트럼 관찰로 설명. 선행조직자 = 새 내용보다 포괄적인 도입 내용 — 절차 1 ‘스펙트럼 개념 소개’(빛의 색은 파장, ", "tg": ["5.2.2.1 보어 원자 모형과 수소 스펙트럼", "E1 과학과 교육과정", "E2 학습 이론", "스펙트럼", "에너지 준위", "원자 모형"], "a": "㉠ 불연속적인(양자화된) 에너지 준위 / 선행조직자 절차 1 ‘스펙트럼 개념 소개’: 햇빛이 프리즘을 통과해 색에 따라 나뉜 띠가 스펙트럼이며, 빛의 색은 파장에 의해 결정되고 파장은 빛의 에너지와 관련 있다는 내용", "th": "../학습지/_썸네일/PTE-2021-B-01.png", "L": [["학생용", "../학습지/2_물리교육론/2021/PTE-2021-B-01_학생용.html"], ["교사용", "../학습지/2_물리교육론/2021/PTE-2021-B-01_교사용.html"], ["원문 PDF", "../문항모음/2021_중등1차_물리_전공B.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2021-B-03", "c": "2021 1차 전공B 3번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2021, "t": "진폭에 따른 단진자 주기 측정 — 10회 왕복 측정, 실험 주의점, 증거 기반 논증", "s": "2021학년도 1차 전공B 3번 · 난이도 ★★☆☆☆ · 1.4.1.2 단진자와 물리 진자 · 10회 왕복 시간 측정 → 초시계 시작·정지의 반응 시간 오차가 10회에 한 번만 들어가 주기의 상대 오차가 1/10. 실제로 큰 진폭에서는 주기가 길어진다: T\\approx T_0\\left(1+\\dfrac{\\the", "tg": ["1.4.1.2 단진자와 물리 진자", "E4 과학 탐구와 과학적 사고", "E7 실험 지도와 평가", "E1 과학과 교육과정", "단진자", "측정과 오차", "실험 결론"], "a": "(1) 초시계를 누르는 시점의 오차(반응 시간)는 측정 횟수와 관계없이 한 번만 포함되므로, 10회 왕복 시간을 재어 10으로 나누면 주기 측정의 오차(상대 오차)를 1/10로 줄일 수 있다. / (2) 진폭이 커지면 주기가 길어지므로(결과 20.1 → 21.1 s), 단진자의 주기를 측정할 때는 실과 연직선의 각도를 작게(약 10° 이하) 해야 한다. (또는: 추를 가만히 놓아 한 연직면에서 진동하게 하고, 최저점 통과 시점에 시간을 잰다.) / (3) 증거에 기초한 토론과 논증 — 두 학생이 같은 실험 결과(증거)를 근거로 각자의 결론(주기 일정 / 진폭이 클수록 증가)을 주장하고, 상대의 해석(오차라는 주장)을 반박하고 있기 때문", "th": "../학습지/_썸네일/PTE-2021-B-03.png", "L": [["학생용", "../학습지/2_물리교육론/2021/PTE-2021-B-03_학생용.html"], ["교사용", "../학습지/2_물리교육론/2021/PTE-2021-B-03_교사용.html"], ["원문 PDF", "../문항모음/2021_중등1차_물리_전공B.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2021-B-04", "c": "2021 1차 전공B 4번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2021, "t": "전구와 가변 저항의 병렬 회로 — 포퍼와 라카토스로 본 학생 반응, 건전지 내부 저항", "s": "2021학년도 1차 전공B 4번 · 난이도 ★★☆☆☆ · 3.2.1.2 키르히호프의 법칙과 직·병렬 회로 · A: 반증 사례 → 자신의 가설 폐기 = 포퍼의 반증주의. B: 옴의 법칙(견고한 핵)은 유지하고 다른 설명(보조 가설)을 찾음 = 라카토스. 내부 저항 r이 있으면 가변 저항 ↑ → 전체 전류 ↓ → Ir ↓ → ", "tg": ["3.2.1.2 키르히호프의 법칙과 직·병렬 회로", "3.2.1.1 전류, 저항, 옴의 법칙", "E5 과학의 본성과 과학사", "E3 오개념과 개념 변화", "E7 실험 지도와 평가", "병렬 회로", "옴의 법칙", "전지의 내부 저항"], "a": "㉠·㉡ ㉠ 반증 사례가 나타나자 자신의 가설(생각)을 폐기하고 새로운 가설을 찾으려 하므로 포퍼의 반증주의에 가깝다. ㉡ 불일치 사례에도 옴의 법칙(견고한 핵)은 유지하고, 결과를 설명할 다른 이유(보조 가설·보호대)를 찾으려 하므로 라카토스의 연구 프로그램 이론에 가깝다. / ㉢ 내부 저항을 무시할 수 없으면 가변 저항값을 크게 할 때 전구가 더 밝아진다. 합성 저항이 커져 전체 전류가 줄면 내부 저항에서의 전압 강하(Ir)가 줄어 단자 전압(전구 양단 전압 = ℰ − Ir)이 커지기 때문이다.", "th": "../학습지/_썸네일/PTE-2021-B-04.png", "L": [["학생용", "../학습지/2_물리교육론/2021/PTE-2021-B-04_학생용.html"], ["교사용", "../학습지/2_물리교육론/2021/PTE-2021-B-04_교사용.html"], ["원문 PDF", "../문항모음/2021_중등1차_물리_전공B.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2021-B-05", "c": "2021 1차 전공B 5번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2021, "t": "정지 마찰력 오개념과 비유 전략 — 정착 예(요철), 포스너의 그럴듯함, 다리 연결 비유", "s": "2021학년도 1차 전공B 5번 · 난이도 ★★☆☆☆ · 1.1.2.3 마찰력과 구심력 운동 · 정착 예(anchoring example): 학생이 직관적으로 옳게 이해하는 상황 — 맞물린 두 요철(위 요철을 당길 때 아래 요철이 반대 방향으로 같은 크기로 방해). 학생 B는 상자와 요철이 비슷하다고 받아들이지", "tg": ["1.1.2.3 마찰력과 구심력 운동", "E3 오개념과 개념 변화", "E6 과학 수업 모형과 교수 전략", "마찰력", "힘의 평형", "비유"], "a": "(1) 바닥에 고정된 아래쪽 요철과 맞물린 위쪽 요철을 오른쪽으로 당기는 상황(아래 요철이 같은 크기의 힘으로 반대 방향으로 방해함) / (2) 그럴듯함(plausibility). 학생 A는 요철과 상자 상황이 닮았다고 받아들였지만, 학생 B는 비유를 이해하면서도 ‘요철은 튀어나온 부분에서만, 상자는 바닥 전체에서 힘을 받는다’며 두 상황이 같다고 믿지 못하므로, 비유가 학생 B에게 그럴듯하게(믿을 만하 .2.1.1 전류, 저항, 옴의 법칙", "4.2.1.1 반사의 법칙과 스넬의 법칙", "E4 과학 탐구와 과학적 사고", "E7 실험 지도와 평가", "탐구 설계", "변인", "전압계·전류계 연결"], "a": "(1) 근거: (마) ‘태양 전지 면과 수평면이 이루는 각도를 0°, 30°, 60°로 변화시키며(거리 일정)’. 이유: 직접 측정하기 어려운 조작 변인 ‘빛의 세기’를 각도기로 측정할 수 있는 ‘태양 전지 면의 기울기 각도’로 정의했기 때문(각도가 클수록 태양 전지 면이 받는 빛의 세기가 감소). / (2) 근거: (라). 수정: ‘디지털 멀티미터를 저항기(태양 전지)에 병렬로 연결하여 전압을 측정한다.’", "th": "../학습지/_썸네일/PTE-2020-A-05.png", "L": [["학생용", "../학습지/2_물리교육론/2020/PTE-2020-A-05_학생용.html"], ["교사용", "../학습지/2_물리교육론/2020/PTE-2020-A-05_교사용.html"], ["원문 PDF", "../문항모음/2020_중등1차_물리_전공A.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2020-A-06", "c": "2020 1차 전공A 6번", "mj": "물리교육론", "ms": ["물리교육론", "파동 및 광학"], "g": "물리교육론", "y": 2020, "t": "결정적 실험 — 베이컨의 조건, 라카토스의 연구 프로그램, 쿤의 변칙 사례", "s": "2020학년도 1차 전공A 6번 · 난이도 ★★☆☆☆ · 4.2.1.1 반사의 법칙과 스넬의 법칙 · 결정적 실험: 경쟁하는 두 이론이 서로 다른 결과를 예측하고, 실험 결과가 한 이론의 예측과만 일치할 때. 라카토스: 연구 프로그램 = 견고한 핵 + 보호대(보조 가설) → 반증되면 보호대를 수정. 쿤: 패러다임으로", "tg": ["4.2.1.1 반사의 법칙과 스넬의 법칙", "E5 과학의 본성과 과학사", "과학의 본성", "과학사", "이론 선택"], "a": "㉠ 두 이론 중 한 이론의 예측과는 일치하고 다른 이론의 예측과는 일치하지 않(는 결과가 나오)면 — 즉 두 이론이 서로 다른 결과를 예측하고 실험 결과가 그중 하나와만 일치 / ㉡ 라카토스에 따르면 이론(연구 프로그램)은 견고한 핵과 이를 둘러싼 보호대(보조 가설)로 이루어져 있어, 반증 사례가 나오면 견고한 핵이 아니라 보호대의 보조 가설을 수정하여 반증을 흡수하므로 곧바로 폐기되지 않는다(프로그램은 진보적/퇴행적인지로 장기적으로 평가됨). / ㉢ 변칙 사례 (이상 현상, anomaly)", "th": "../학습지/_썸네일/PTE-2020-A-06.png", "L": [["학생용", "../학습지/2_물리교육론/2020/PTE-2020-A-06_학생용.html"], ["교사용", "../학습지/2_물리교육론/2020/PTE-2020-A-06_교사용.html"], ["원문 PDF", "../문항모음/2020_중등1차_물리_전공A.pdf#page=4"]], "au": false, "bd": false}, {"id": "PTE-2020-A-07", "c": "2020 1차 전공A 7번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2020, "t": "작용 반작용 수업의 모형 선택 — 발견 학습(귀납)과 발생 학습, 포스너의 유용성", "s": "2020학년도 1차 전공A 7번 · 난이도 ★★☆☆☆ · 1.1.2.1 관성계와 제1·2·3법칙 · 발견 학습: 관찰 자료에서 스스로 규칙성 발견 → 귀납적 사고. 발생 학습 모형(오스본·위트록): 예비–초점–도전–적용. 포스너 조건: 불만족·이해 가능성·그럴듯함·유용성.", "tg": ["1.1.2.1 관성계와 제1·2·3법칙", "E6 과학 수업 모형과 교수 전략", "E3 오개념과 개념 변화", "E4 과학 탐구와 과학적 사고", "작용 반작용", "줄다리기", "개념 변화"], "a": "(1) 귀납적 사고. 발견 , "y": 2019, "t": "마찰에 의한 등가속도 운동 실험의 탐구 기능 평가표 — 측정, 자료 변환·해석의 채점 기준", "s": "2019학년도 1차 전공B 1번 · 난이도 ★★☆☆☆ · 1.1.1.2 등가속도 직선운동 및 자유낙하 · 마찰력이 일정하면 감속도 일정 → 등가속도: 0-v^2=-2as → s=\\dfrac{v^2}{2a}. 따라서 이동 거리는 속력의 제곱에 비례하고, 이를 보이는 것이 자료 변환(그래프 작성)과 해석의 핵심. 기초 탐구", "tg": ["1.1.1.2 등가속도 직선운동 및 자유낙하", "1.1.2.3 마찰력과 구심력 운동", "E7 실험 지도와 평가", "E4 과학 탐구와 과학적 사고", "등가속도 운동", "그래프 해석"], "a": "㉠ 등가속도 (직선) 운동 / ㉡ 측정 / ㉢ 측정 자료를 이동 거리–속력의 제곱 그래프(또는 이동 거리–속력 그래프)로 축·단위를 갖추어 바르게 변환하여 나타냄 / ㉣ 그래프에서 이동 거리가 속력의 제곱에 비례한다는 관계를 찾고, 이를 근거로 수레가 등가속도 운동을 했다는 결론을 제시함", "th": "../학습지/_썸네일/PTE-2019-B-01.png", "L": [["학생용", "../학습지/2_물리교육론/2019/PTE-2019-B-01_학생용.html"], ["교사용", "../학습지/2_물리교육론/2019/PTE-2019-B-01_교사용.html"], ["원문 PDF", "../문항모음/2019_중등1차_물리_전공B.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2019-B-02", "c": "2019 1차 전공B 2번", "mj": "물리교육론", "ms": ["물리교육론", "파동 및 광학"], "g": "물리교육론", "y": 2019, "t": "빛과 그림자 오개념과 발생학습 모형 — 직선 광원이 만드는 원형 물체의 그림자", "s": "2019학년도 1차 전공B 2번 · 난이도 ★★☆☆☆ · 4.2.1.1 반사의 법칙과 스넬의 법칙 · 오개념 ㉠: ‘그림자의 모양은 (광원과 관계없이) 항상 물체의 모양과 같다’. 실제로 그림자는 광원의 각 점에서 물체에 가려진 영역들의 겹침이므로 광원의 모양·크기에 영향을 받는다 — 직선 광원이면 원형 물체의 그림", "tg": ["4.2.1.1 반사의 법칙과 스넬의 법칙", "E3 오개념과 개념 변화", "E6 과학 수업 모형과 교수 전략", "빛의 직진", "그림자"], "a": "㉠ 그림자(또는 구멍을 지난 빛)의 모양은 광원의 모양과 관계없이 항상 물체(구멍)의 모양과 같다 / 도전 단계 ① 초점 단계에서 작성한 모둠별 예상과 이유를 발표하고 서로 비교·토론한다. ② 시범 실험으로 실제 그림자를 관찰해 예상과 비교(인지 갈등)하고, 교사가 직선 광원을 점광원들의 모임으로 보고 각 점광원에서 빛의 직진으로 생긴 그림자들이 겹쳐 길쭉한 모양이 됨을 작도로 제시한다. / 그림자 놀이 그림자는 빛이 직진하다 물체에 가려 생기며, 광원의 각 점이 만든 그림자의 겹침이다. 그림자 놀이에서는 광원이 매우 작아(점광원) 그림자들이 거의 일치하므로 물체 모양과 같은 그림자가 생긴다. 광원의 크기·모양이 커지면 그림자 모양도 달라진다.", "th": "../학습지/_썸네일/PTE-2019-B-02.png", "L": [["학생용", "../학습지/2_물리교육론/2019/PTE-2019-B-02_학생용.html"], ["교사용", "../학습지/2_물리교육론/2019/PTE-2019-B-02_교사용.html"], ["원문 PDF", "../문항모음/2019_중등1차_물리_전공B.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2019-B-08", "c": "2019 1차 전공B 8번", "mj": "물리교육론", "ms": ["물리교육론", "현대물리학", "전자기학"], "g": "물리교육론", "y": 2019, "t": "수업 상황과 20세기 초 원자 모형 발전사 — 모형의 개발과 사용, 유추적 사 PTE-2018-B-08", "c": "2018 1차 전공B 8번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2018, "t": "‘가속도에 영향을 주는 요인’ 수업 — 가설 검증 학습 모형, 피아제·오수벨 관점, 변인 통제", "s": "2018학년도 1차 전공B 8번 · 난이도 ★★★☆☆ · 1.1.2.1 관성계와 제1·2·3법칙 · 수업은 가설 검증(탐구) 학습 모형: 탐색 및 문제 파악 → 가설 설정 → 실험 설계 → 실험 → 가설 검증(자료 해석) → 적용. ㉠ 가설: ‘질량이 일정할 때 물체에 작용하는 힘이 클수록 가속도가 크다(가속도는 ", "tg": ["1.1.2.1 관성계와 제1·2·3법칙", "E6 과학 수업 모형과 교수 전략", "E2 학습 이론", "E4 과학 탐구와 과학적 사고", "뉴턴 제2법칙", "변인 통제", "실험 설계"], "a": "(1) 가설 검증 학습 모형(문제 파악–가설 설정–실험 설계–실험–가설 검증–적용). ㉠: 질량이 일정할 때 물체에 작용하는 힘이 클수록 물체의 가속도가 크다. / (2) 기존 오개념으로 실험 결과를 동화하지 못해 인지 불평형(인지 갈등)이 생기고, 인지 구조를 조절하여 힘과 가속도의 관계를 받아들이며 새로운 평형에 이르는 평형화 과정으로 개념을 획득한다. / (3) 학생의 인지 구조에 이미 있는 일상 경험(관련 정착 지식)과 새 개념을 연결해 학습 과제가 학생에게 의미를 갖게(심리적 유의미가를 갖게) 하기 위해서이다. / (4) 변인 통제는 형식적 조작기의 사고 능력이 필요한데, 학생들이 아직 구체적 조작기 수준에 머물러 있기 때문이다. / (5) 조작변인: 힘(매단 추의 무게), 종속변인: 가속도, 통제", "th": "../학습지/_썸네일/PTE-2018-B-08.png", "L": [["학생용", "../학습지/2_물리교육론/2018/PTE-2018-B-08_학생용.html"], ["교사용", "../학습지/2_물리교육론/2018/PTE-2018-B-08_교사용.html"], ["원문 PDF", "../문항모음/2018_중등1차_물리_전공B.pdf#page=5"]], "au": false, "bd": false}, {"id": "PTE-2017-A-02", "c": "2017 1차 전공A 2번", "mj": "역학", "ms": ["역학"], "g": "내용학", "y": 2017, "t": "수평으로 나는 표적을 최고점에서 맞히는 총알의 발사 속력", "s": "2017학년도 1차 전공A 2번 · 난이도 ★★☆☆☆ · 1.1.1.3 포물체 운동 및 상대속도 · 총알과 물체가 같은 연직선에서 출발해 최고점에서 만나려면 ① 수평 속도가 같고(v\\cos\\theta=v_0) ② 최고점 높이가 H((v\\sin\\theta)^2=2g(H-h))여야 한다. 두 식의 제곱합 → v=\\sq", "tg": ["1.1.1.3 포물체 운동 및 상대속도", "1.2.1.3 역학적 에너지 보존과 비보존력", "포물선 운동", "수평·연직 분리", "최고점 조건"], "a": "(1) v=\\sqrt{v_0^{\\,2}+2g(H-h)} (발사각 \\tan\\theta=\\sqrt{2g(H-h)}/v_0)", "th": "../학습지/_썸네일/PTE-2017-A-02.png", "L": [["학생용", "../학습지/1_내용학/2017/PTE-2017-A-02_학생용.html"], ["교사용", "../학습지/1_내용학/2017/PTE-2017-A-02_교사용.html"], ["원문 PDF", "../문항모음/2017_중등1차_물리_전공A.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2017-A-03", "c": "2017 1차 전공A 3번", "mj": "파동 및 광학", "ms": ["파동 및 광학"], "g": "내용학", "y": 2017, "t": "맥놀이 그래프 읽기 — 맥놀이 진동수와 두 음파의 진동수", "s": "2017학년도 1차 전 ", "y": 2017, "t": "광전 효과를 ‘바구니 속 구슬’로 설명하기 — 비유 수업 전략의 장점·한계·효과적 사용 조건", "s": "2017학년도 1차 전공B 8번 · 난이도 ★★★☆☆ · 5.1.2.2 광전 효과와 광자 · 비유(analogy): 낯선 목표 개념(광전 효과)을 친숙한 비유물(구슬 맞히기)과 구조적으로 대응시켜 설명하는 전략. 장점: 추상적·비가시적 개념을 구체화해 이해와 흥미를 돕는다. 한계: 대응하지 않는 속성이 오개", "tg": ["5.1.2.2 광전 효과와 광자", "E6 과학 수업 모형과 교수 전략", "E3 오개념과 개념 변화", "광전 효과", "일함수", "빛의 입자성"], "a": "(1) 비유(유추) 전략 — 낯선 목표 개념(광전 효과)을 학생에게 친숙한 비유물(구슬 맞히기)과 대응시켜 설명하는 전략 / (2) 눈에 보이지 않는 추상적 개념(일함수, 임계 진동수)을 친숙한 구슬·바구니 높이로 구체화하여, ‘문턱 에너지를 넘어야 전자가 나오고 빛의 세기(구슬의 수)와는 무관하다’는 관계를 쉽게 이해하게 한다(흥미·동기 유발). / (3) 비유물과 목표물의 대응하지 않는 속성 때문에 오개념이 생길 수 있다. 예: 임계 진동수를 구슬의 ‘속력’에 대응시켜 ‘진동수가 큰 빛은 더 빠르다’고 생각하거나, 충돌 후에도 남는 구슬처럼 광자가 흡수되지 않고 튕겨 나간다고 생각할 수 있다. / (4) ① 학생이 비유물(구슬, 바구니)에 친숙해야 한다. ② 비유물과 목표 개념의 대응 관계를 명확히 하고", "th": "../학습지/_썸네일/PTE-2017-B-08.png", "L": [["학생용", "../학습지/2_물리교육론/2017/PTE-2017-B-08_학생용.html"], ["교사용", "../학습지/2_물리교육론/2017/PTE-2017-B-08_교사용.html"], ["원문 PDF", "../문항모음/2017_중등1차_물리_전공B.pdf#page=5"]], "au": false, "bd": false}, {"id": "PTE-2016-A-02", "c": "2016 1차 전공A 2번", "mj": "역학", "ms": ["역학"], "g": "내용학", "y": 2016, "t": "공기 저항(kv)과 운동 마찰력(f)을 받는 물체 — 운동 방정식과 정지 시간", "s": "2016학년도 1차 전공A 2번 · 난이도 ★★☆☆☆ · 1.1.2.3 마찰력과 구심력 운동 · m\\dfrac{dv}{dt}=-kv-f → v=\\left(v_0+\\dfrac fk\\right)e^{-kt/m}-\\dfrac fk. v=0: t_{\\rm 정지}=\\dfrac mk\\ln\\left(1+\\dfrac{kv_0", "tg": ["1.1.2.3 마찰력과 구심력 운동", "1.1.1.1 변위, 속도, 가속도", "마찰력", "공기 저항"], "a": "(1) m\\dfrac{dv}{dt}=-kv-f / (2) t_{\\rm 정지}=\\dfrac mk\\ln\\left(1+\\dfrac{kv_0}{f}\\right)", "th": "../학습지/_썸네일/PTE-2016-A-02.png", "L": [["학생용", "../학습지/1_내용학/2016/PTE-2016-A-02_학생용.html"], ["교사용", "../학습지/1_내용학/2016/PTE-2016-A-02_교사용.html"], ["원문 PDF", "../문항모음/2016_중등1차_물리_전공A.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2016-A-03", "c": "2016 1차 전공A 3번", "mj": "전자기학", "ms": ["전자기학", "역학"], "g": "내용학", "y": 2016, "t": "용수철에 매단 축전기 극판 — 극판 사이 인력과 늘어난 길이", "s": "2016학년도 1차 전공A 3번 · 난이도 ★★☆☆☆ · 3.1.2.3 축전기(커패시터)와 유전체 · 한 극판이 받는 장은 다른 극판이 만든 \\dfrac{\\sigma}{2\\epsilon_0} → 전공 서술형 2번 · 난이도 ★☆☆☆☆ · 1.4.1.2 단진자와 물리 진자 · 한 번에 하나의 변인만 바꾸고(조작 변인) 나머지는 같게 유지(통제 변인)해야 결과의 원인을 판단할 수 있다. 가설 A: ‘실의 길이가 길수록 진자의 주기가 길어질 것이다’(조작 변인: 실의 길이, 종속 변인: 주기", "tg": ["1.4.1.2 단진자와 물리 진자", "E4 과학 탐구와 과학적 사고", "E7 실험 지도와 평가", "진자", "변인 통제", "가설"], "a": "가설 A “(추의 질량과 진폭이 같을 때) 실의 길이가 길수록 진자의 주기가 길어질 것이다.” — 조작 변인: 실의 길이, 종속 변인: 진자의 주기 / 수정된 실험 설계 추의 질량을 한 가지(예: 100 g)로 같게 하고(통제 변인), 실의 길이만 10, 20, 30, 40 cm로 바꾸어 4개의 진자를 만든 뒤, 같은 진폭에서 놓아 각각의 주기를 측정한다.", "th": "../학습지/_썸네일/PTE-2008-02.png", "L": [["학생용", "../학습지/2_물리교육론/2008/PTE-2008-02_학생용.html"], ["교사용", "../학습지/2_물리교육론/2008/PTE-2008-02_교사용.html"], ["원문 PDF", "../문항모음/2008_중등1차_물리_전공%20문제.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2008-03", "c": "2008 전공 서술형 3번", "mj": "물리교육론", "ms": ["물리교육론", "파동 및 광학"], "g": "물리교육론", "y": 2008, "t": "빛과 그림자 수업을 PEOE(예상–설명1–관찰–설명2) 모형으로 재구성하기", "s": "2008학년도 전공 서술형 3번 · 난이도 ★★☆☆☆ · 4.2.1.1 반사의 법칙과 스넬의 법칙 · PEOE: 예상(결과를 예측) → 설명 1(예상의 이유) → 관찰(실제 결과) → 설명 2(예상과 관찰의 차이를 설명하며 개념 수정). 물리: 크기가 있는 광원은 점광원의 모임 — 각 점광원이 만든 그림자가 겹쳐 그", "tg": ["4.2.1.1 반사의 법칙과 스넬의 법칙", "E6 과학 수업 모형과 교수 전략", "E3 오개념과 개념 변화", "빛의 직진", "그림자", "광원"], "a": "예상 단계 점광원이 아닌 광원으로 원형 물체를 비추면, 그림자의 모양은 물체의 모양(원형)과 똑같을 것이라고 예상한다. / 설명1 단계 그림자는 직진하는 빛을 물체가 가려서 생기므로, 그림자의 모양은 물체의 모양과 같을 것이라고 예상의 이유를 설명한다. / 관찰 단계 직선 모양의 광원으로 원형 물체를 비추었더니, 예상과 달리 스크린에 직선 모양(광원과 같은 방향으로 긴)의 그림자가 생겼다. / 설명2 단계 직선 모양의 광원은 점광원이 연속해서 이어진 것이므로, 각 점광원이 만든 원형 그림자가 위아래로 이어져 직선 모양의 그림자가 된다. 따라서 A: ‘그림자의 모양은 물체의 모양뿐 아니라 광원의 모양에 의해서도 결정된다.’", "th": "../학습지/_썸네일/PTE-2008-03.png", "L": [["학생용", "../학습지/2_물리교육론/2008/PTE-2008-03_학생용.html"], ["교사용", "../학습지/2_물리교육론/2008/PTE-2008-03_교사용.html"], ["원문 PDF", "../문항모음/2008_중등1차_물리_전공%20문제.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2008-04", "c": "2008 전공 서술형 4번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2008, "t": "건전지 병렬 연결 시범의 실패 — 내부 저항과 실험 조건 바꾸기", "s": "2008학년도 전공 서술형 4번 · 난이도 ★★☆☆☆ · 3.2.1.2 키르히호프의 법칙과 직·병렬 회로 · 실제 건전지 = 기전력 \\varepsilon + 내부 저항 r. 회로 1: I_1=\\dfrac{\\varepsilon}{R+r}, 회로 2(같은 전지 2개 병렬): I_2=\\dfrac{\\varepsilon}{R+r/2", "tg": ["3.2.1.2 키르히호프의 법칙과 직·병렬 회로", "3.2.1.1 전류, 저항, 옴의 법칙", "E7 실험 지도와 평가", "E5 과학의 본성과 과학사", "전지의 연결", "전류", "저항"], "a": "이유 건전지에는 내부 저항이 있는데, 외부 저항(1 Ω)이 내부 저항에 비해 충분히 크지 않아 병렬 연결로 전체 내부 저항이 절반으로 줄어든 효과가 커서 회로 전체 저항이 줄었기 때문이다(I_2=\\varepsilon/(R+r/2)&gt;I_1=\\varepsilon/(R+r)). / 바꿀 실험 조건 외부 저항을 건전지의 내부 저항보다 훨씬 큰 것(예: 1 Ω → 100 Ω 정도)으로 바꾸어 내부 저항의 영향을 무시할 수 있게 한다(전류계는 mA 범위로).", "th": "../학습지/_썸네일/PTE-2008-04.png", "L": [["학생용", "../학습지/2_물리교육론/2008/PTE-2008-04_학생용.html"], ["교사용", "../학습지/2_물리교육론/2008/PTE-2008-04_교사용.html"], ["원문 PDF", "../문항모음/2008_중등1차_물리_전공%20문제.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2008-05", "c": "2008 전공 서술형 5번", "mj": "물리교육론", "ms": ["물리교육론", "현대물리학"], "g": "물리교육론", "y": 2008, "t": "유리는 고체인가 — 분류 기준의 차이와 사회적 구성주의 관점의 교사 설명", "s": "2008학년도 전공 서술형 5번 · 난이도 ★★☆☆☆ · 5.2.2.3 고체물리 기초 (에너지 밴드와 반도체) · A의 기준: 단단하고 일정한 모양·크기 → 유리는 고체. B의 기준: 결정이 있어야 고체 → 유리는 고체 아님. 기준(정의)이 달라 논쟁. 사회적 구성주의: 과학 개념과 분류는 과학자 공동체가 사회적 상호작용·협상을", "tg": ["5.2.2.3 고체물리 기초 (에너지 밴드와 반도체)", "E2 학습 이론", "E5 과학의 본성과 과학사", "고체와 액체", "결정", "유리"], "a": "논쟁의 이유 학생 A는 ‘단단하고 일정한 모양·크기’를, 학생 B는 ‘결정의 유무’를 고체의 기준으로 삼아, 고체를 정의(분류)하는 기준이 서로 달랐기 때문이다. / 교사의 설명 “고체를 어떤 기준으로 정의하느냐에 따라 판단이 달라질 수 있어요. 과학 개념은 과학자 사회의 합의로 정해지는데, 현재 과학자들은 유리를 결정 구조는 없지만 단단하고 모양이 일정한 ‘비결정질 고체’로 분류하기로 합의했으니 A의 생각은 틀리지 않았어요.”", "th": "../학습지/_썸네일/PTE-2008-05.png", "L": [["학생용", "../학습지/2_물리교육론/2008/PTE-2008-05_학생용.html"], ["교사용", "../학습지/2_물리교육론/2008/PTE-2008-05_교사용.html"], ["원문 PDF", "../문항모음/2008_중등1차_물리_전공%20문제.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2008-06", "c": "2008 전공 서술형 6번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2008, "t": "표를 그래프로 — 속력–운동에너지 그래프 그리기와 지역별 강수량 그래프의 오류", "s": "2008학년도 전공 서술형 6번 · 난이도 ★☆☆☆☆ · 1.2.1.1 일과 운동에너지 정리 · 그래프 형식은 변인의 종류로 정한다: 두 변인이 모두 연속이면 점을 찍고 경향을 나타내는 매끄러운 선(꺾은선 X), 독립 변인이 범주(불연속)이면 막대그래프. 축에는 변인 이름과 단위. &lt;표 1&gt;은 E_k", "tg": ["1.2.1.1 일과 운동에너지 정리", " ac{pc^2}{E}=\\dfrac{hc}{\\sqrt{h^2+m^2c^2\\lambda^2}}=\\dfrac{c}{\\sqrt{1+(mc\\lambda/h)^2}} (=v)", "th": "../학습지/_썸네일/PTE-2007-25.png", "L": [["학생용", "../학습지/1_내용학/2007/PTE-2007-25_학생용.html"], ["교사용", "../학습지/1_내용학/2007/PTE-2007-25_교사용.html"], ["원문 PDF", "../문항모음/2007_중등1차_물리_전공%20문제.pdf#page=10"]], "au": false, "bd": false}, {"id": "PTE-2007-01", "c": "2007 전공 서술형 1번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2007, "t": "명왕성의 재분류 — 과학자 공동체의 합의와 쿤 이전 과학철학의 한계", "s": "2007학년도 전공 서술형 1번 · 난이도 ★★☆☆☆ · 1.4.2.2 케플러 법칙과 궤도 운동 · 2006년 IAU 총회는 행성의 정의(① 태양 공전 ② 정역학 평형의 둥근 모양 ③ 궤도 주변의 다른 천체를 ‘청소’)를 표결로 정하고 명왕성을 왜소행성으로 재분류했다. 과학 지식(분류 체계)은 새로운 관측 증거(카", "tg": ["1.4.2.2 케플러 법칙과 궤도 운동", "1.4.2.1 만유인력 법칙과 중력 퍼텐셜", "E5 과학의 본성과 과학사", "과학의 본성", "태양계", "과학 지식의 변화"], "a": "설명 명왕성 재분류는 새로운 관측(카이퍼대 천체 발견)을 계기로 과학자 공동체(IAU)가 토론·표결로 개념을 다시 정한 것으로, 과학 지식이 공동체의 합의라는 사회적 과정을 통해 형성·변화함(잠정성)을 보여 준다. 쿤 이전의 귀납주의·논리실증주의·반증주의는 지식이 관찰과 논리(검증·반증)만으로 객관적·누적적으로 정당화된다고 보아, 과학자 공동체의 합의와 개념 틀(패러다임)의 역할을 설명하지 못한다. / 사례 예) 2018년 국제도량형총회가 표결로 킬로그램을 플랑크 상수로 재정의 — 과학자 공동체의 합의로 측정 기준(과학 지식)이 바뀜. (대륙 이동설 → 판 구조론의 수용 등도 가능)", "th": "../학습지/_썸네일/PTE-2007-01.png", "L": [["학생용", "../학습지/2_물리교육론/2007/PTE-2007-01_학생용.html"], ["교사용", "../학습지/2_물리교육론/2007/PTE-2007-01_교사용.html"], ["원문 PDF", "../문항모음/2007_중등1차_물리_전공%20문제.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2007-02", "c": "2007 전공 서술형 2번", "mj": "물리교육론", "ms": ["물리교육론", "열역학 및 통계물리"], "g": "물리교육론", "y": 2007, "t": "에탄올 끓는점 측정 모둠 실험 — 협동학습의 특징으로 본 문제점과 개선 계획", "s": "2007학년도 전공 서술형 2번 · 난이도 ★★☆☆☆ · 2.1.2.1 열량, 비열, 잠열 · 협동학습의 기본 요소: 긍정적 상호의존성(공동 목표·역할·자원 분담, 집단 보상), 개별 책무성(각자의 학습 결과를 개별 확인), 대면적 상호작용, 사회적 기술, 집단 과정(성찰). 대화의 모둠은 역할이 없어 A가 ", "tg": ["2.1.2.1 열량, 비열, 잠열", "2.1.1.1 온도계와 열평형", "E6 과학 수업 모형과 교수 전략", "E7 실험 지도와 평가", "모둠 실험", "끓는점", "상태 변화"], "a": "문제점 역할 분담 없이 실험이 진행되어 학생 A가 실험을 독점하고 B·C·D는 무임승차(사회적 태만)하며, 방법을 모르는 B를 돕는 상호작용도 없다. 즉 협동학습의 핵심인 개별 책무성(각자의 학습 확인)과 긍정적 상호의존성(역할·목표·보상의 공유)이 결여되어 있다. / 수업 계획 ① 이질 모둠에 역할(가열·안전, 온도 측정, 시간·기록, 그래프·발표)을 분담하고 반복 실험에서 순환한다. ② 실험 전 모둠원이 서로 절차를 설명·확인하고 교사가 무작위 지명으로 점검한다. ③ 모둠은 하나의 그래프·끓는점을 공동 산출하고, 실험 후 개인 퀴즈(개인 보고서)의 향상 점수를 모둠 점수로 합산해 보상한다(STAD). ④ 무작위 발표와 동료 평가로 개별 책무성과 집단 성찰을 확보한다.", "th": "../학습지/_썸네일/PTE-2007-02.png", "L": [["학생용", "../학습지/2_물리교육론/2007/PTE-2007-02_학생용.html"], ["교사용", "../학습지/2_물리교육론/2007/PTE-2007-02_교사용.html"], ["원문 PDF", "../문항모음/2007_중등1차_물리_전공%20문제.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2007-03", "c": "2007 전공 서술형 3번", "mj": "물리교육론", "ms": ["물리교육론", "현대물리학"], "g": "물리교육론", "y": 2007, "t": "두 사례로 본 과학의 본성 — 잠정성과 재현 가능성(공적 검증)", "s": "2007학년도 전공 서술형 3번 · 난이도 ★☆☆☆☆ · 5.2.2.4 핵분열, 핵융합 및 방사성 붕괴 · (가) 46개 염색체의 발견: 과학 지식은 새로운 증거(관찰 기술의 발전)에 따라 수정될 수 있다 — 잠정성. (나) 상온 핵융합 주장(1989): 다른 과학자들이 같은 조건에서 같은 결과를 재현하지 못해 철회 — ", "tg": ["5.2.2.4 핵분열, 핵융합 및 방사성 붕괴", "E5 과학의 본성과 과학사", "과학의 본성", "핵융합", "과학 지식의 변화"], "a": "(가) 잠정성 — 새로운 관찰 증거에 의해 기존의 과학 지식(48개)이 46개로 수정되었기 때문 / (나) 재현 가능성(공적 검증) — 다른 학자들이 같은 실험 결과를 재현하지 못해 주장이 과학 지식으로 인정되지 못하고 철회되었기 때문", "th": "../학습지/_썸네일/PTE-2007-03.png", "L": [["학생용", "../학습지/2_물리교육론/2007/PTE-2007-03_학생용.html"], ["교사용", "../학습지/2_물리교육론/2007/PTE-2007-03_교사용.html"], ["원문 PDF", "../문항모음/2007_중등1차_물리_전공%20문제.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2007-04", "c": "2007 전공 서술형 4번", "mj": "물리교육론", "ms": ["물리교육론", "파동 및 광학"], "g": "물리교육론", "y": 2007, "t": "‘빛의 굴절’ 수업의 첫 질문 — 교사 질문의 문제점과 발산적 질문으로 바꾸기", "s": "2007학년도 전공 서술형 4번 · 난이도 ★★☆☆☆ · 4.2.1.1 반사의 법칙과 스넬의 법칙 · 좋은 발문: 사고를 요구하는 개방형(발산적) 질문, 충분한 대기 시간(3~5초 이상), 질문 → 기다림 → 지명 순서. 교사의 질문은 정의를 묻는 수렴적(폐쇄적) 질문이며, ‘얼른 대답해 봐요’로 생각할 시간을 주지", "tg": ["4.2.1.1 반사의 법칙과 스넬의 법칙", "E6 과학 수업 모형과 교수 전략", "E3 오개념과 개념 변화", "빛의 굴절", "질문 만들기"], "a": "문제점 ② ‘얼른 대답해 봐요’라며 재촉하여 학생에게 생각할 시간(대기 시간)을 주지 않는다. (또는: 질문하기 전에 특정 학생을 먼저 지명하여 다른 학생들의 사고 참여를 막는다.) / 발산적 질문 “물컵에 꽂은 빨대가 꺾여 보이는 것처럼, 우리 주변에서 빛이 꺾여 보이는 현상에는 어떤 것들이 있을까요? 그런 현상이 왜 일어나는지 여러 가지로 생각해 봅시다.” (학급 전체에 묻고 충분히 기다린 뒤 지명)", "th": "../학습지/_썸네일/PTE-2007-04.png", "L": [["학생용", "../학습지/2_물리교육론/2007/PTE-2007-04_학생용.html  반증이 나와도 보조 가설을 수정하면 이론을 지킬 수 있으므로 반증은 결정적이지 않다(이론은 반증 사례 하나로 폐기되지 않는다). ② 스팔란짜니는 니담의 관찰을 ‘충분히 끓이지 않았거나 밀봉이 불완전했다’고 해석했다 — 반증의 근거가 되는 관찰·실험 결과도 오류 가능하고 이론에 의존해 해석되므로 확실한 반증 판단이 어렵다.", "th": "../학습지/_썸네일/PTE-2006-02.png", "L": [["학생용", "../학습지/2_물리교육론/2006/PTE-2006-02_학생용.html"], ["교사용", "../학습지/2_물리교육론/2006/PTE-2006-02_교사용.html"], ["원문 PDF", "../문항모음/2006_중등1차_물리_전공%20문제.hwp.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2006-03", "c": "2006 전공 서술형 3번", "mj": "물리교육론", "ms": ["물리교육론"], "g": "물리교육론", "y": 2006, "t": "소음을 소재로 한 과학적 소양 수업 — 문제 해결·의사 결정·실천 능력", "s": "2006학년도 전공 서술형 3번 · 난이도 ★★☆☆☆ · 과학적 소양인의 능력: 과학 지식·원리를 일상의 문제에 적용하여 해결하는 능력, 과학 관련 사회적 쟁점에서 여러 여건을 고려한 합리적 의사 결정 능력, 결정을 개인·사회적 행동으로 실천(참여)하는 능력.", "tg": ["E6 과학 수업 모형과 교수 전략", "E1 과학과 교육과정", "과학적 소양", "소리의 세기", "생활 속 과학"], "a": "3 ① 과학 지식과 원리를 일상생활의 문제에 적용하여 해결하는 능력(문제 해결력) ② 과학과 관련된 사회 문제에 대해 여러 여건을 고려하여 합리적으로 판단하는 의사 결정 능력 ③ 결정한 내용을 개인적·사회적 행동으로 옮기는 실천(참여) 능력", "th": "../학습지/_썸네일/PTE-2006-03.png", "L": [["학생용", "../학습지/2_물리교육론/2006/PTE-2006-03_학생용.html"], ["교사용", "../학습지/2_물리교육론/2006/PTE-2006-03_교사용.html"], ["원문 PDF", "../문항모음/2006_중등1차_물리_전공%20문제.hwp.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2006-04", "c": "2006 전공 서술형 4번", "mj": "물리교육론", "ms": ["물리교육론", "열역학 및 통계물리"], "g": "물리교육론", "y": 2006, "t": "압력–부피 실험 그래프의 점검표 평가 — 자료 변환 능력의 평가 준거", "s": "2006학년도 전공 서술형 4번 · 난이도 ★★☆☆☆ · 2.2.1.1 이상기체 방정식 · 그래프 작성 평가 준거: 변인 설정, 제목, 점 표시(제시됨) + 축에 변인 이름과 단위, 자료 범위에 맞는 눈금(축척), 측정점의 경향을 나타내는 매끄러운 곡선(최적선). 학생 그래프: 단위 없음, 압력 축이 0~", "tg": ["2.2.1.1 이상기체 방정식", "E7 실험 지도와 평가", "E4 과학 탐구와 과학적 사고", "그래프 그리기", "보일 법칙", "탐구"], "a": "4 ① 축에 변인의 이름과 단위를 표시하였다 — 단위(기압, mL)가 없으므로 (X) ② 자료의 범위에 맞게 축의 눈금(축척)을 적절히 정하였다 — 압력 축을 0~6으로 잡아 자료(1.0~2.5)가 좁은 부분에 몰렸으므로 (X) ③ 측정점의 경향을 나타내도록 매끄러운 곡선(최적선)을 그렸다 — 점들을 꺾은선으로 연결했으므로 (X)", "th": "../학습지/_썸네일/PTE-2006-04.png", "L": [["학생용", "../학습지/2_물리교육론/2006/PTE-2006-04_학생용.html"], ["교사용", "../학습지/2_물리교육론/2006/PTE-2006-04_교사용.html"], ["원문 PDF", "../문항모음/2006_중등1차_물리_전공%20문제.hwp.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2006-05", "c": "2006 전공 서술형 5번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2006, "t": "패러데이 법칙의 순환 학습 — 개념 도입 활동과 피아제의 평형화", "s": "2006학년도 전공 서술형 5번 · 난이도 ★★☆☆☆ · 3.2.2.3 패러데이 전자기 유도 법칙과 렌츠의 법칙 · 순환 학습(Karplus·Lawson): 탐색(자료 수집, 불평형 유발) → 개념 도입(용어·개념을 도입해 탐색 결과 설명, 조절) → 개념 적용(새 상황에 적용, 일반화). 피아제: 동화로 설명되지 않는 경험 → ", "tg": ["3.2.2.3 패러데이 전자기 유도 법칙과 렌츠의 법칙", "E2 학습 이론", "E6 과학 수업 모형과 교수 전략", "순환 학습", "전자기 유도", "학습 이론"], "a": "5-1 개념 도입(용어 도입) 단계 — 학생들이 활동 1·2의 결과를 발표·토의하게 한 뒤, 교사가 이를 정리하며 ‘전자기 유도’, ‘유도 전류(유도 기전력)’, ‘자기 선속의 변화’ 등의 용어와 패러데이 법칙을 도입·설명한다. / 5-2 활동 1·2의 탐색에서 기존 인지 구조(전류는 전지가 있어야 흐른다)로 설명되지 않는 현상을 겪어 생긴 인지적 불평형이, 활동 3에서 전자기 유도 개념을 받아들여 인지 구조를 재구성하는 조절을 통해 해소되어, 새로운 개념이 통합된 평형 상태(평형화)에 도달하기를 기대한다.", "th": "../학습지/_썸네일/PTE-2006-05.png", "L": [["학생용", "../학습지/2_물리교육론/2006/PTE-2006-05_학생용.html"], ["교사용", "../학습지/2_물리교육론/2006/PTE-2006-05_교사용.html"], ["원문 PDF", "../문항모음/2006_중등1차_물리_전공%20문제.hwp.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2006-06", "c": "2006 전공 서술형 6번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2006, "t": "운동량과 충격량의 STS 수업 — 문제로의 초대 단계와 실행 단계", "s": "2006학년도 전공 서술형 6번 · 난이도 ★★☆☆☆ · 1.2.2.1 선운동량과 충격량 · F\\Delta t=m\\Delta v: 같은 운동량 변화(충격량)라도 충돌 시간 \\Delta t가 길면 평균 힘이 작다 → 에어백·안전벨트·헬멧·운동장 매트. STS 모형(Yager): 문제로의 초대(실생활·사회 문제", "tg": ["1.2.2.1 선운동량과 충격량", "E6 과학 수업 모형과 교수 전략", "충격량", "STS", "안전장치"], "a": "6-1 문제로의 초대 단계 — 자동차 충돌 실험 영상(에어백·안전벨트 유무 비교)이나 교통사고 기사를 보여 주고, 학생들이 “같은 속력으로 충돌해도 에어백이 있으면 왜 덜 다칠까?”와 같은 질문을 스스로 제기하게 한다. 근거: 학생 주변의 실생활·사회 문제에서 출발하여 흥미와 학습의 필요성을 느끼고 스스로 문제를 인식하게 하는 것이 STS 수업의 출발점이기 때문이다. / 6-2 실행(행동하기) 단계 — 충격량과 충돌 시간의 관계를 근거로 안전벨트·헬멧 착용을 권장하는 캠페인을 기획·실행하거나, 달걀 보호 장치·충격 흡수 장치를 설계·제작하여 발표하고 학교 주변 안전시설 개선을 건의한다. 근거: 학습한 과학 지식을 개인적·사회적 의사 결정과 행동으로 옮기게 하여 과학적 소양(실천 능력)을 기르는 것이 STS ", "th": "../학습지/_썸네일/PTE-2006-06.png", "L": [["학생용", "../학습지/2_물리교육론/2006/PTE-2006-06_학생용.html"], ["교사용", "../학습지/2_물리교육론/2006/PTE-2006-06_교사용.html"], ["원문 PDF", "../문항모음/2006_중등1차_물리_전공%20문제.hwp.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2006-07", "c": "2006 전공 서술형 7번", "mj": "물리교육론", "ms": ["물리교육론", "전자기학"], "g": "물리교육론", "y": 2006, "t": "나선형 교육과정 — 9학년·물리Ⅰ·물리Ⅱ의 ‘전류와 자기장’ 학습 내용의 폭과 깊이", "s": "2006학년도 전공 서술형 7번 · 난이도 ★★☆☆☆ · 3.2.2.1 자기력과 로렌츠 힘 · 나선형 교육과정(브루너): 같은 핵심 개념을 학년이 올라가며 반복하되 폭(다루는 범위)과 깊이(추상화·정량화 수준)를 넓힌다. 공통: 전류와 자기장의 상호 작용(자기장 속 전류가 받는 힘). 9학년 정성적 확인 → ", "tg": ["3.2.2.1 자기력과 로렌츠 힘", "3.2.2.2 비오-사바르 법칙과 앙페르 법칙", "E1 과학과 교육과정", "E2 학습 이론", "교육과정", "자기력", "전류와 자기장"], "a": "7-1 자기장 속에서 전류(운동하는 전하)가 받는 힘 — 전류와 자기장의 상호 작용(자기력) / 7-2 9학년에서는 도선 주위 자기장과 자기장 속 도선이 힘을 받는 현상을 정성적으로 확인·이해하고, 물리Ⅰ에서는 그 힘의 크기와 방향을 결정하는 요인(전류, 자기장의 세기, 도선 길이, 방향)을 탐구하여 정량적 관계(F=BIL\\sin\\theta, 왼손 법칙)로 깊어지며, 물리Ⅱ에서는 평행한 두 도선 사이의 힘(전류가 만든 자기장과 전류의 상호 작용)으로 폭이 넓어지고 운동 전하가 받는 힘(F=qvB)으로 미시적 원리까지 일반화되어 깊이가 더해진다.", "th": "../학습지/_썸네일/PTE-2006-07.png", "L": [["학생용", "../학습지/2_물리교육론/2006/PTE-2006-07_학생용.html"], ["교사용", "../학습지/2_물리교육론/2006/PTE-2006-07_교사용.html"], ["원문 PDF", "../문항모음/2006_중등1차_물리_전공%20문제.hwp.pdf#page=3"]], "au": false, "bd": false}, {"id": "PTE-2006-08", "c": "2006 전공 서술형 8번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2006, "t": "학생의 ‘힘과 운동’ 개념도에서 선개념 찾기와 인지 갈등 상황", "s": "2006학년도 전공 서술형 8번 · 난이도 ★★☆☆☆ · 1.1.2.1 관성계와 제1·2·3법칙 · 뉴턴: 힘은 운동의 변화(가속도)의 원인, \\vec F_{\\rm net}=m\\vec a. 등속 운동에는 알짜힘 0. 학생의 선개념: ① 물체 안에 ‘운동하려는 힘’이 있다가 소모된다(임페투스) — 위로 던진 공이 느", "tg": ["1.1.2.1 관성계와 제1·2·3법칙", "1.1.2.2 중력, 수직항력, 장력", "E3 오개념과 개념 변화", "힘과 운동", "오개념", "관성"], "a": "8-1 ① 운동하는 물체는 ‘운동하려는 힘’을 가지고 있으며, 이 힘이 소모되면 속력이 줄어든다(위로 던진 공이 점점 느려지는 것은 공의 힘이 소모되기 때문) — 임페투스 개념. ② 등속으로 운동하는 물체에는 운동 방향으로 일정한 크기의 (알짜)힘이 계속 작용한다(운동을 유지하려면 힘이 필요하다). [그 밖에: 정지한 물체에는 힘이 작용하지 않는다] / 8-2 상황: 마찰이 거의 없는 공기 부상 궤도에서 수레를 잠시 밀었다 놓기 전에, 손을 뗀 뒤의 운동을 예측하게 하고 관찰하게 한다. 근거: 학생은 ‘밀어 준 힘이 소모되어 곧 멈춘다(등속으로 가려면 계속 힘이 필요하다)’고 예측하지만, 실제로 수레는 힘을 받지 않고도 거의 같은 속력으로 계속 움직이므로 예측과 관찰이 모순되어 인지 갈등이 일어난다(느려지는", "th": "../학습지/_썸네일/PTE-2006-08.png", "L": [["학생용", "../학습지/2_물리  이유와 채점 준거", "s": "2005학년도 전공 서술형 2번 · 난이도 ★★☆☆☆ · 1.4.1.2 단진자와 물리 진자 · 가설 설정 능력 = 문제에 대한 잠정적 답을 스스로 만들어 진술하는 능력 → 정해진 답을 고르는 선다형으로는 타당하게 측정하기 어렵고, 학생이 직접 진술한 결과·과정을 보는 수행평가가 적절. 채점 준거: 독립·종속 ", "tg": ["1.4.1.2 단진자와 물리 진자", "E7 실험 지도와 평가", "E4 과학 탐구와 과학적 사고", "탐구 능력 평가", "가설", "단진자"], "a": "이유 가설 설정 능력은 학생이 스스로 가설을 만들어 진술하는 능력인데, 선다형은 제시된 답 중에서 고르게 하므로(재인) 이 능력을 직접 측정할 수 없어 타당도가 낮다. 수행평가는 학생이 직접 가설을 설정·진술하는 과정과 결과를 평가하므로 측정하려는 능력을 타당하게 평가할 수 있다. / 채점 준거 ① 독립변인(실의 길이)과 종속변인(진자의 주기) 사이의 관계가 명확하게 진술되었는가 ② 실험을 통해 검증할 수 있는(측정 가능한) 형태로 진술되었는가", "th": "../학습지/_썸네일/PTE-2005-02.png", "L": [["학생용", "../학습지/2_물리교육론/2005/PTE-2005-02_학생용.html"], ["교사용", "../학습지/2_물리교육론/2005/PTE-2005-02_교사용.html"], ["원문 PDF", "../문항모음/2005_중등1차_물리_전공%20문제.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2005-03", "c": "2005 전공 서술형 3번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2005, "t": "밀도 개념 수업 — 행동주의 vs 구성주의 교수·학습 절차", "s": "2005학년도 전공 서술형 3번 · 난이도 ★★☆☆☆ · 1.3.2.2 유체 정역학 (압력, 파스칼, 아르키메데스 원리) · 행동주의: 공식 암기 → 반복 연습(자극–반응 강화). 구성주의: 학생의 선개념에서 출발해 직접 탐구·토의로 지식을 스스로 구성(교사는 안내자). 밀도 \\rho=m/V: 같은 물질이면 크기와 상관없이 일정한 물질의 ", "tg": ["1.3.2.2 유체 정역학 (압력, 파스칼, 아르키메데스 원리)", "E2 학습 이론", "E3 오개념과 개념 변화", "E6 과학 수업 모형과 교수 전략", "학습 이론", "밀도", "개념 변화"], "a": "절차 ① 큰 나무토막과 작은 쇠못 등이 뜨고 가라앉는 것을 예상·설명하게 하여 학생의 선개념을 드러낸다(인지 갈등). ② 모둠별로 여러 물질의 질량과 부피를 직접 측정·그래프화하고 토의하여 질량/부피가 물질마다 일정함(밀도)을 스스로 찾게 한다. ③ 밀도 개념을 새 상황(물질 구별, 부침)에 적용하고 처음 생각과 비교·반성하게 한다. / 이유 학생의 선개념에서 출발하여, 학생이 직접 측정·토의하는 활동과 동료와의 상호작용을 통해 밀도 개념을 스스로 구성하고(교사는 안내자) 새 상황에 적용하게 하므로 구성주의 학습 이론에 따른 절차이다.", "th": "../학습지/_썸네일/PTE-2005-03.png", "L": [["학생용", "../학습지/2_물리교육론/2005/PTE-2005-03_학생용.html"], ["교사용", "../학습지/2_물리교육론/2005/PTE-2005-03_교사용.html"], ["원문 PDF", "../문항모음/2005_중등1차_물리_전공%20문제.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2005-04", "c": "2005 전공 서술형 4번", "mj": "물리교육론", "ms": ["물리교육론", "파동 및 광학"], "g": "물리교육론", "y": 2005, "t": "반으로 자른 볼록 렌즈의 상 작도 — 직접 풀고 채점 준거 세우기", "s": "2005학년도 전공 서술형 4번 · 난이도 ★★☆☆☆ · 4.2.1.3 렌즈 방정식과 광학 기기 · 렌즈의 각 부분은 물체의 한 점에서 나온 빛을 모두 같은 상점으로 모은다 → 렌즈를 반으로 잘라도 상 전체가 그대로 생기고 밝기만 줄어든다. 물체가 2f에 있으면 \\dfrac1a+\\dfrac1b=\\dfrac1f → ", "tg": ["4.2.1.3 렌즈 방정식과 광학 기기", "4.2.1.1 반사의 법칙과 스넬의 법칙", "E7 실험 지도와 평가", "E3 오개념과 개념 변화", "렌즈와 상", "굴절", "광선 작도"], "a": "작도 렌즈 오른쪽 2F′(렌즈에서 2f) 위치에 물체와 같은 크기의 거꾸로 선 실상이 완전하게 생긴다(반쪽 렌즈이므로 밝기만 약해짐). 광선은 렌즈의 앞·뒤 두 경계면에서 각각 굴절하도록 그린다. / 채점 준거 ① 광선이 렌즈의 두 경계면(공기→유리, 유리→공기)에서 각각 스넬 법칙에 맞는 방향으로 굴절하도록 작도했는가 ② 상의 위치(2F′)와 크기(같음)·방향(거꾸로 선 실상)을 옳게, 그리고 반쪽 렌즈라도 상 전체가 맺히도록 나타냈는가", "th": "../학습지/_썸네일/PTE-2005-04.png", "L": [["학생용", "../학습지/2_물리교육론/2005/PTE-2005-04_학생용.html"], ["교사용", "../학습지/2_물리교육론/2005/PTE-2005-04_교사용.html"], ["원문 PDF", "../문항모음/2005_중등1차_물리_전공%20문제.pdf#page=1"]], "au": false, "bd": false}, {"id": "PTE-2005-05", "c": "2005 전공 서술형 5번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2005, "t": "자유 낙하 시범과 인지 갈등 — 관찰의 이론 의존성", "s": "2005학년도 전공 서술형 5번 · 난이도 ★★☆☆☆ · 1.1.1.2 등가속도 직선운동 및 자유낙하 · 관찰의 이론 의존성(핸슨): 관찰은 관찰자가 가진 이론·개념에 의해 영향을 받는다 — 같은 현상도 무엇을 아느냐에 따라 다르게 ‘보인다’. 선개념을 가진 학생은 가속 운동을 보여 주어도 선개념에 맞게 관찰·해석하므로", "tg": ["1.1.1.2 등가속도 직선운동 및 자유낙하", "1.1.2.1 관성계와 제1·2·3법칙", "E5 과학의 본성과 과학사", "E3 오개념과 개념 변화", "과학의 본성", "오개념", "자유 낙하"], "a": "5 학생들은 자신의 선개념(힘은 속력에 비례, 중력은 일정 → 일정한 속력으로 떨어질 것)이라는 이론의 틀을 통해 낙하 운동을 관찰하므로, 물체가 가속 운동하는 것을 보더라도 이를 가속 운동으로 인식하지 못하거나 선개념에 맞게 해석하여 자신의 생각과 모순되는 증거로 받아들이지 않았기 때문이다(관찰이 관찰자의 이론에 의존).", "th": "../학습지/_썸네일/PTE-2005-05.png", "L": [["학생용", "../학습지/2_물리교육론/2005/PTE-2005-05_학생용.html"], ["교사용", "../학습지/2_물리교육론/2005/PTE-2005-05_교사용.html"], ["원문 PDF", "../문항모음/2005_중등1차_물리_전공%20문제.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2005-06", "c": "2005 전공 서술형 6번", "mj": "물리교육론", "ms": ["물리교육론", "현대물리학"], "g": "물리교육론", "y": 2005, "t": "보어 원자 모형의 수정 — 라카토스의 과학적 연구 프로그램", "s": "2005학년도 전공 서술형 6번 · 난이도 ★★☆☆☆ · 5.2.2.1 보어 원자 모형과 수소 스펙트럼 · 라카토스: 과학 이론은 연구 프로그램 — 반증에서 보호되는 견고한 핵(러더퍼드 유핵 모형) + 수정 가능한 보호대(보조 가설). 부정적 발견법: 핵을 건드리지 말라. 긍정적 발견법: 보호대를 어떻게 고치고 발전시킬지", "tg": ["5.2.2.1 보어 원자 모형과 수소 스펙트럼", "E5 과학의 본성과 과학사", "과학의 본성", "보어 원자 모형", "선 스펙트럼"], "a": "라카토스 이론 긍정적 발견법 (견고한 핵인 유핵 모형은 유지하고 보호대를 수정·발전시키는 연구 프로그램의 지침) / 이유 견고한 핵인 러더퍼드의 유핵 모형은 포기하지 않고 유지하면서, 반증 사례를 설명하기 위해 보호대의 보조 가설(두 양성자 핵 주위의 전자 He⁺, 환산 질량)을 수정·추가하여 반증 사례를 확증 사례로 바꾸었기 때문이다.", "th": "../학습지/_썸네일/PTE-2005-06.png", "L": [["학생용", "../학습지/2_물리교육론/2005/PTE-2005-06_학생용.html"], ["교사용", "../학습지/2_물리교육론/2005/PTE-2005-06_교사용.html"], ["원문 PDF", "../문항모음/2005_중등1차_물리_전공%20문제.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2005-07", "c": "2005 전공 서술형 7번", "mj": "물리교육론", "ms": ["물리교육론", "역학"], "g": "물리교육론", "y": 2005, "t": "힘·질량·가속도 실험의 탐구 과정 — 변인 통제와 자료 변환", "s": "2005학년도 전공 서술형 7번 · 난이도 ★★☆☆☆ · 1.1.2.1 관성계와 제1·2·3법칙 · 단계 1(힘만 바꿈, 질량 고정)·단계 2(질량만 바꿈, 힘 고정) → 공통: 변인 통제. 단계 3: 종이테이프를 일정 시간 간격(예: 6타점 = 0.1 s)으로 잘라 붙여 속력–시간 그래프로 만들고 가속도를 구해 ", "tg": ["1.1.2.1 관성계와 제1·2·3법칙", "1.1.1.2 등가속도 직선운동 및 자유낙하", "E4 과학 탐구와 과학적 사고", "E7 실험 지도와 평가", "탐구 과정", "가속도 법칙", "실험"], "a": "단계1·2 공통 변인 통제 / 단계3 활동 종이테이프를 일정한 시간 간격(예: 0.1초 = 6타점)으로 잘라 붙여 속력–시간 그래프를 그리고, 그 기울기로 각 경우의 가속도를 구한 다음, 힘–가속도 및 질량–가속도(또는 1/질량–가속도) 관계를 표와 그래프로 나타낸다. / 단계3 탐구과정 자료 변환", "th": "../학습지/_썸네일/PTE-2005-07.png", "L": [["학생용", "../학습지/2_물리교육론/2005/PTE-2005-07_학생용.html"], ["교사용", "../학습지/2_물리교육론/2005/PTE-2005-07_교사용.html"], ["원문 PDF", "../문항모음/2005_중등1차_물리_전공%20문제.pdf#page=2"]], "au": false, "bd": false}, {"id": "PTE-2005-08", "c": "2005 전공 서술형 8번", "mj": "물리교육론", "ms": ["물리교육론"], "g": "물리교육론", "y": 2005, "t": "물리 학습 태도 검사 — 의미 분석법 결과 해석과 리커트 척도 변환", "s": "2005학년도 전공 서술형 8번 · 난이도 ★★☆☆☆ · 의미 분석법(semantic differential): 양극의 형용사 쌍(재미있다–지루하다) 사이 7단계. 점수는 서열(순위) 척도 — 순서는 말할 수 있으나 1점 차이가 같은 크기의 태도 차이라는 보장은 없다. 리", "tg": ["E7 실험 지도와 평가", "태도 검사", "척도"], "a": "평가 세 학급 모두 평균이 중간값(4)보다 커서 물리 학습을 대체로 재미있다고 느끼며, 긍정적인 정도는 C > B > A 순이다(A는 중립에 가까움). 그러나 의미 분석법 점수는 서열 척도이므로 평균이 1점씩 차이 난다고 해서 학급 간 태도 차이가 같은 크기라고(또는 비율로) 해석할 수는 없다. / 변환 “물리 공부는 재미있다.” — 매우 그렇다 / 그렇다 / 보통이다 / 그렇지 않다 / 전혀 그렇지 않다 (5~1점)", "th": "../학습지/_썸네일/PTE-2005-08.png", "L": [["학생용", "../학습지/2_물리교육론/ function esc(t){ return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }
var S={q:'',mj:'all',g:'all',yr:'all',sort:store('sort')||'topic',view:store('view')||'grid',ans:store('ans')==='1',click:+(store('click')||0),lim:PAGE}, F=[];
(function(){ var h=location.hash.slice(1); if(!h) return; h.split('&').forEach(function(p){ var kv=p.split('='), v=decodeURIComponent(kv[1]||'');
  if(kv[0]==='t'&&MJ[v]) S.mj=v; if(kv[0]==='g') S.g=v; if(kv[0]==='q') S.q=v.toLowerCase(); if(kv[0]==='y') S.yr=v; }); })();
/* hero */
(function(){
  var n=IT.length, cnt={}, ys=IT.map(function(i){return i.y}), y0=Math.min.apply(0,ys), y1=Math.max.apply(0,ys);
  IT.forEach(function(it){cnt[it.mj]=(cnt[it.mj]||0)+1});
  $('heroSub').textContent=y0+'–'+y1+' · '+D.blurb;
  var sol=IT.filter(function(i){return i.L.length>1}).length;
  var st=[[n,'전체 문항'],[D.groups.length,D.glabel],[D.majors.length,'주제'],[(y1-y0+1)+'년','수록 기간'],[sol,D.hasAns?'정답 있음':'해설 포함']];
  $('stats').innerHTML=st.map(function(s){return '<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join('');
  $('dist').innerHTML=D.majors.map(function(m){return '<i style="width:'+(100*(cnt[m.k]||0)/n)+'%;background:'+m.color+'" title="'+m.name+' '+(cnt[m.k]||0)+'"></i>'}).join('');
  $('legend').innerHTML=D.majors.map(function(m){return '<span data-mj="'+m.k+'"><em style="background:'+m.color+'"></em>'+m.icon+' '+m.name+' '+(cnt[m.k]||0)+'</span>'}).join('');
  $('legend').onclick=function(e){ var s=e.target.closest('[data-mj]'); if(s){ S.mj=s.dataset.mj; render(); $('mainWrap').scrollIntoView(); } };
  $('glab').textContent=D.glabel; $('glab2').textContent=D.glabel;
  $('foot').innerHTML='문항 '+n+'개 · 생성일 '+D.built+' · <a href="'+D.xlsx+'">엑셀 목록 열기</a> · <a href="../index.html" target="_top">🏠 대문</a> · <a href="'+D.hub+'" target="_top">종합 대시보드</a> · 다른 지역: '+D.others.map(function(o){return '<a href="'+o[1]+'" target="_top">'+o[0]+'</a>'}).join(', ');
  var yrs=[]; for(var y=y1;y>=y0;y--) if(IT.some(function(i){return i.y===y})) yrs.push(y);
  $('yf').innerHTML='<option value="all">모든 연도</option>'+yrs.map(function(y){return '<option value="'+y+'">'+y+'년</option>'}).join('');
  $('yf').value=S.yr;
  if(!D.hasAns) $('ansBtn').style.display='none';
})();
/* controls */
$('tabs').onclick=function(e){ var b=e.target.closest('[data-mj]'); if(b){ S.mj=b.dataset.mj; render(); } };
$('chips').onclick=function(e){ var b=e.target.closest('[data-g]'); if(b){ S.g=(S.g===b.dataset.g&&b.dataset.g!=='all')?'all':b.dataset.g; render(); } };
$('yf').onchange=function(){ S.yr=this.value; render(); };
$('clickTo').value=String(S.click); $('clickTo').onchange=function(){ S.click=+this.value; store('click',S.click); draw(); };
$('sort').value=S.sort; $('sort').onchange=function(){ S.sort=this.value; store('sort',S.sort); render(); };
function setView(v){ S.view=v; store('view',v); document.body.classList.toggle('list',v==='list'); $('vGrid').classList.toggle('on',v==='grid'); $('vList').classList.toggle('on',v==='list'); }
$('vGrid').onclick=function(){setView('grid')}; $('vList').onclick=function(){setView('list')}; setView(S.view);
function setAns(a){ S.ans=a; store('ans',a?'1':'0'); document.body.classList.toggle('show-ans',a); $('ansBtn').classList.toggle('on',a); }
$('ansBtn').onclick=function(){setAns(!S.ans)}; setAns(S.ans&&D.hasAns);
var tm; $('q').value=S.q; $('q').oninput=function(){ clearTimeout(tm); var v=this.value; tm=setTimeout(function(){ S.q=v.trim().toLowerCase(); render(); },120); };
$('rand').onclick=function(){ var L=F.length?F:IT; openModal(L[Math.floor(Math.random()*L.length)].i); };
var th=store('theme'); if(th) document.documentElement.dataset.theme=th;
$('theme').onclick=function(){ var cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'), nx=cur==='dark'?'light':'dark'; document.documentElement.dataset.theme=nx; store('theme',nx); };
addEventListener('scroll',function(){ $('topBtn').classList.toggle('on',scrollY>600); },{passive:true});
$('topBtn').onclick=function(){ scrollTo({top:0}); };
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&document.activeElement!==$('q')){ e.preventDefault(); $('q').focus(); }
  if(!$('modal').classList.contains('on')) return;
  if(e.key==='Escape') closeModal(); if(e.key==='ArrowRight') step(1); if(e.key==='ArrowLeft') step(-1);
});
/* filter */
function match(it,ignoreMj,ignoreG){
  if(!ignoreMj&&S.mj!=='all'&&it.ms.indexOf(S.mj)<0) return false;
  if(!ignoreG&&S.g!=='all'&&it.g!==S.g) return false;
  if(S.yr!=='all'&&String(it.y)!==S.yr) return false;
  if(S.q){ var ws=S.q.split(/\s+/); for(var i=0;i<ws.length;i++) if(it._t.indexOf(ws[i])<0) return false; }
  return true;
}
var GI={}; D.groups.forEach(function(g,i){GI[g]=i});
function sorter(a,b){
  switch(S.sort){ case 'old': return a.y-b.y||a.i-b.i; case 'group': return (GI[a.g]-GI[b.g])||(b.y-a.y)||a.i-b.i; default: return b.y-a.y||a.i-b.i; }
}
/* render */
function card(it){
  var m=MJ[it.mj]||D.majors[0], first=it.L[Math.min(S.click,it.L.length-1)]||['',''];
  return '<article class="card" style="--c:'+m.color+'">'+
    '<a class="thumb" href="'+esc(first[1])+'" target="_blank">'+(it.th?'<img loading="lazy" src="'+esc(it.th)+'" alt="">':'<span class="noimg">'+m.icon+'</span>')+'<span class="go">'+esc(first[0])+' 열기 ↗</span></a>'+
    '<span class="badge">'+esc(it.c)+'</span>'+
    '<div class="cb"><div class="meta"><span>'+it.y+'</span><span>'+esc(it.g)+'</span>'+(it.bd?'<span class="rc" title="여러 문항을 한 학습지에 묶음">객관식 묶음</span>':'')+(it.au?'<span class="rc" title="키워드 자동 분류">자동분류</span>':'')+(it.L[0]&&it.L[0][1].indexOf('/심화/')>=0?'<span class="rc deep" title="한국어 문제·AI 풀이·모의실험이 있는 심화 학습지">✦ 심화</span>':'')+'</div>'+
    '<div class="ko">'+esc(it.t)+'</div><div class="en">'+esc(it.s)+'</div>'+
    '<div class="tags">'+it.ms.map(function(t){var x=MJ[t];return x?'<span class="tp" style="--tc:'+x.color+'">'+esc(t)+'</span>':''}).join('')+it.tg.slice(0,3).map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'</div>'+
    (it.a?'<div class="ans">정답: '+esc(it.a)+'</div>':'')+
    '<div class="acts">'+it.L.slice(0,2).map(function(l){return '<a href="'+esc(l[1])+'" target="_blank">'+esc(l[0])+'</a>'}).join('')+'<button class="pv" data-pv="'+it.i+'" title="미리보기">🔍</button></div>'+
    '</div></article>';
}
function render(){
  F=IT.filter(function(it){return match(it)}).sort(sorter); S.lim=PAGE;
  var base=IT.filter(function(it){return match(it,true,false)}), cm={}; base.forEach(function(it){ it.ms.forEach(function(t){cm[t]=(cm[t]||0)+1}) });
  var h='<button class="tab'+(S.mj==='all'?' on':'')+'" data-mj="all">전체 <span class="n">'+base.length+'</span></button>';
  D.majors.forEach(function(m){ h+='<button class="tab'+(S.mj===m.k?' on':'')+'" data-mj="'+esc(m.k)+'" style="--c:'+m.color+'">'+m.icon+' '+m.name+' <span class="n">'+(cm[m.k]||0)+'</span></button>'; });
  $('tabs').innerHTML=h;
  var gb=IT.filter(function(it){return match(it,false,true)}), cg={}; gb.forEach(function(it){cg[it.g]=(cg[it.g]||0)+1});
  $('chips').innerHTML='<button class="chip'+(S.g==='all'?' on':'')+'" data-g="all">전체 <span class="n">'+gb.length+'</span></button>'+D.groups.map(function(g){return '<button class="chip'+(S.g===g?' on':'')+'" data-g="'+esc(g)+'">'+esc(g)+' <span class="n">'+(cg[g]||0)+'</span></button>'}).join('');
  var tr=IT.filter(function(it){return match(it,true,true)}), t='';
  D.majors.forEach(function(m){
    var inM=tr.filter(function(it){return it.ms.indexOf(m.k)>=0}); if(!inM.length) return;
    t+='<div class="mj" data-mj="'+esc(m.k)+'"><span class="dot" style="background:'+m.color+'"></span>'+m.icon+' '+m.name+'<span class="cnt">'+inM.length+'</span></div>';
    D.groups.forEach(function(g){ var c=inM.filter(function(it){return it.g===g}).length; if(c) t+='<div class="mn'+(S.mj===m.k&&S.g===g?' on':'')+'" data-mj="'+esc(m.k)+'" data-g="'+esc(g)+'">'+esc(g)+'<span class="cnt">'+c+'</span></div>'; });
  });
  $('tree').innerHTML=t;
  var pills=[]; if(S.mj!=='all') pills.push(['mj',S.mj]); if(S.g!=='all') pills.push(['g',S.g]); if(S.yr!=='all') pills.push(['yr',S.yr+'년']); if(S.q) pills.push(['q','“'+S.q+'”']);
  $('resLine').innerHTML='<span><b>'+F.length+'</b>개 문항</span>'+pills.map(function(p){return '<span class="pill">'+esc(p[1])+' <button data-clr="'+p[0]+'">×</button></span>'}).join('')+(pills.length?'<span class="pill"><button data-clr="all">모두 지우기</button></span>':'');
  draw();
}
function draw(){
  if(!F.length){ $('content').innerHTML='<div class="empty"><b>🔭</b>조건에 맞는 문항이 없습니다.</div>'; return; }
  var h='', shown=0, lim=S.lim;
  if(S.sort==='topic'){
    D.majors.forEach(function(m){
      if(shown>=lim) return;
      var inM=F.filter(function(it){return it.mj===m.k}); if(!inM.length) return;
      h+='<section class="sec"><div class="sec-h"><span class="ic">'+m.icon+'</span><h2 style="color:'+m.color+'">'+m.name+'</h2><span class="cnt">'+inM.length+'문항</span></div>';
      D.groups.forEach(function(g){
        if(shown>=lim) return;
        var inG=inM.filter(function(it){return it.g===g}); if(!inG.length) return;
        var part=inG.slice(0,Math.max(0,lim-shown)); shown+=part.length;
        h+='<div class="minor-h" style="--c:'+m.color+'"><span class="code">'+esc(g)+'</span><h3>'+esc(g)+'</h3><span class="desc">'+inG.length+'문항</span></div><div class="grid">'+part.map(card).join('')+'</div>';
      });
      h+='</section>';
    });
  } else { var part=F.slice(0,lim); shown=part.length; h='<div class="grid">'+part.map(card).join('')+'</div>'; }
  if(shown<F.length) h+='<button class="more" id="more">더 보기 ('+shown+' / '+F.length+')</button>';
  $('content').innerHTML=h;
  if($('more')) $('more').onclick=function(){ S.lim+=PAGE; draw(); };
}
$('tree').onclick=function(e){ var a=e.target.closest('[data-mj]'); if(!a) return; S.mj=a.dataset.mj; S.g=a.dataset.g||'all'; render(); $('mainWrap').scrollIntoView(); };
$('resLine').onclick=function(e){ var b=e.target.closest('[data-clr]'); if(!b) return; var k=b.dataset.clr;
  if(k==='mj'||k==='all') S.mj='all'; if(k==='g'||k==='all') S.g='all'; if(k==='yr'||k==='all'){ S.yr='all'; $('yf').value='all'; } if(k==='q'||k==='all'){ S.q=''; $('q').value=''; } render(); };
/* modal */
var CUR=null;
function openModal(i){
  var it=IT[i]; if(!it) return; CUR=i; var m=MJ[it.mj]||D.majors[0];
  $('mbox').style.setProperty('--c',m.color);
  $('mFig').innerHTML=it.th?'<img src="'+esc(it.th)+'" alt="">':'<span style="font-size:80px;opacity:.3">'+m.icon+'</span>';
  $('mTxt').className='mtxt';
  $('mTxt').innerHTML='<div class="top"><span class="badge" style="position:static;--c:'+m.color+'">'+esc(it.c)+'</span><span class="pill">'+it.ms.map(function(t){return (MJ[t]?MJ[t].icon+' ':'')+esc(t)}).join(' · ')+'</span></div>'+
    '<h3>'+esc(it.t)+'</h3><div class="en">'+esc(it.s)+'</div>'+
    '<div class="tags">'+it.tg.map(function(t){return '<span>'+esc(t)+'</span>'}).join('')+'</div>'+
    (it.a?'<div class="mans">정답: '+esc(it.a)+'</div>':'')+
    (it.bd?'<div class="note">이 문항은 여러 문항이 묶인 시험지 PDF 안에 있습니다. 미리보기는 시험지 첫 쪽입니다.</div>':'')+
    (it.au?'<div class="note">주제는 키워드로 자동 분류했습니다.</div>':'')+
    '<div class="mbtns">'+it.L.map(function(l,j){return '<a class="'+(j===0?'pri':'')+'" href="'+esc(l[1])+'" target="_blank">'+esc(l[0])+' 열기 ↗</a>'}).join('')+(it.a?'<button id="mRev">정답 보기</button>':'')+'</div>';
  if($('mRev')) $('mRev').onclick=function(){ $('mTxt').classList.toggle('reveal'); this.textContent=$('mTxt').classList.contains('reveal')?'정답 숨기기':'정답 보기'; };
  $('modal').classList.add('on'); $('modal').setAttribute('aria-hidden','false'); document.body.style.overflow='hidden';
}
function closeModal(){ $('modal').classList.remove('on'); $('modal').setAttribute('aria-hidden','true'); document.body.style.overflow=''; }
function step(d){ var L=F.length?F:IT, k=-1; for(var j=0;j<L.length;j++) if(L[j].i===CUR) k=j; if(k<0) return; openModal(L[(k+d+L.length)%L.length].i); }
$('content').addEventListener('click',function(e){ var b=e.target.closest('[data-pv]'); if(b) openModal(+b.dataset.pv); });
$('mClose').onclick=closeModal; $('mPrev').onclick=function(){step(-1)}; $('mNext').onclick=function(){step(1)};
$('modal').onclick=function(e){ if(e.target===$('modal')) closeModal(); };
render();
})();
</script>
</body>
</html>
