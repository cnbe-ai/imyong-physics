<style>
  :root{--fs:1;--fig:1;--ink:#1b1f2a;--muted:#5b6475;--line:#d5dae4;--accent:#3b3486;--accent2:#6a5fd6;--soft:#f4f2fb;
    --bg:#ffffff;--card:#ffffff;--ok:#1e8f4e;--okbg:#e8f6ee;--warn:#b5541c;--warnbg:#fdf1e8}
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--ink);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6}
  .btn{font:inherit;font-size:14px;padding:6px 13px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .grow{flex:1} .hint{font-size:13px;color:var(--muted)} .kbd{font-size:12px;color:var(--muted)}
  /* ---------- simulation ---------- */
  .sim{display:grid;grid-template-columns:1fr 310px;grid-template-rows:auto 1fr auto;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;height:calc(640px*var(--fig))}
  .sim .cap{grid-column:1;grid-row:1;padding:8px 14px;background:#fbfbfd;border-bottom:1px solid var(--line);font-size:calc(15px*var(--fs));min-height:44px;display:flex;align-items:center;gap:8px}
  .sim .cap .ph{background:var(--accent);color:#fff;border-radius:6px;padding:0 8px;font-size:calc(13px*var(--fs));white-space:nowrap}
  .sim .stage{grid-column:1;grid-row:2;position:relative;min-height:0}
  .sim canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .sim .bar{grid-column:1;grid-row:3;display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:#fbfbfd;flex-wrap:wrap}
  .sim .bar input[type=range]{flex:1;min-width:140px}
  .sim .side{grid-column:2;grid-row:1/4;border-left:1px solid var(--line);padding:12px 14px;overflow-y:auto;background:#fcfcfe;font-size:calc(14px*var(--fs))}
  .side .grp{margin-bottom:12px}
  .side .grp>label,.side .lbl{display:flex;justify-content:space-between;font-weight:600;font-size:calc(13.5px*var(--fs))}
  .side .grp>label output{font-weight:700;color:var(--accent)}
  .side input[type=range]{width:100%}
  .side .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:4px}
  .side .seg button{flex:1;font:inherit;font-size:calc(13px*var(--fs));border:0;background:#fff;padding:5px 4px;cursor:pointer}
  .side .seg button.on{background:var(--accent);color:#fff}
  .side .chk{display:flex;gap:10px;flex-wrap:wrap;font-size:calc(13px*var(--fs))}
  .readout{width:100%;font-size:calc(13px*var(--fs));border-collapse:collapse}
  .readout td{border:0;border-bottom:1px solid #eef0f4;padding:3px 2px}
  .readout td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .result{margin-top:8px;border-radius:8px;padding:8px 10px;font-weight:700;font-size:calc(14px*var(--fs));background:#f1f2f6}
  .result.good{background:var(--okbg);color:var(--ok)}
  .result.bad{background:var(--warnbg);color:var(--warn)}
  #mini{width:100%;height:150px;display:block;border:1px solid var(--line);border-radius:8px;background:#fff;margin-top:4px}
  .sim:fullscreen{height:100vh;width:100vw;border-radius:0;border:0;grid-template-columns:1fr 360px}
  .sim:fullscreen .cap{font-size:calc(20px*var(--fs));min-height:56px}
  .sim:fullscreen .side{font-size:calc(15px*var(--fs))}
  .sim:-webkit-full-screen{height:100vh;width:100vw;border-radius:0;border:0;grid-template-columns:1fr 360px}
  .kbd{font-size:calc(12px*var(--fs));color:var(--muted)}
  .graphs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
  .graphs canvas{width:100%;height:calc(280px*var(--fig));display:block;border:1px solid var(--line);border-radius:10px;background:#fff}


:root{--accent:#9a4d0b;--soft:#fbf1e6} .tb1{background:linear-gradient(100deg,#5e2c06 0%,#9a4d0b 45%,#d9822b 100%)!important} .tbtn.solid{color:#9a4d0b!important} .stepper button,.stepper output{color:#9a4d0b!important} #problem,.tb2 a[href="#problem"]{--c:#9a4d0b} .qnum{background:#9a4d0b} .qnum.ext{background:#a87a00}
  .sim{height:calc(100vh - 2px)!important}
  @media (max-width:900px){.sim{height:auto!important}}

    <div class="sim" id="simBox" tabindex="0">
      <div class="cap"><span class="ph" id="capPh">모의실험</span><span id="capTx">3D 장면. 파동함수 sin(n_xπx/2a)·sin(n_yπy/a)의 높이(빨강 +, 파랑 −). 에너지 ∝ n_x²/4 + n_y².</span></div>

<div class="grp"><label>n_y <output id="o_ny"></output></label><input type="range" data-p="ny" data-u="" min="1" max="3" step="1" value="1"></div>

<script>
/* PTC 공통 라이브러리 — 모든 교사용 페이지의 모의실험이 사용 */
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id)};
  var PTC=window.PTC={};
  PTC.$=$;
  PTC.DEG=Math.PI/180;
  PTC.fs=function(){return window.PTC_FS||1};
  PTC.font=function(px,weight,family){return (weight?weight+' ':'')+Math.round(px*PTC.fs())+'px '+(family||'"Noto Sans KR","Malgun Gothic",sans-serif')};
  PTC.setupCanvas=function(c){
    var r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;
    c.width=Math.max(1,Math.round(r.width*d)); c.height=Math.max(1,Math.round(r.height*d));
    var x=c.getContext('2d'); x.setTransform(d,0,0,d,0,0); return {x:x,w:r.width,h:r.height};
  };
  PTC.arrow=function(ctx,x,y,dx,dy,color,label,lw){
    var L=Math.hypot(dx,dy); if(L<2) return;
    ctx.save(); ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=lw||2.5;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+dx,y+dy); ctx.stroke();
    var a=Math.atan2(dy,dx), h=Math.min(12,L*0.4);
    ctx.beginPath(); ctx.moveTo(x+dx,y+dy);
    ctx.lineTo(x+dx-h*Math.cos(a-0.4),y+dy-h*Math.sin(a-0.4));
    ctx.lineTo(x+dx-h*Math.cos(a+0.4),y+dy-h*Math.sin(a+0.4)); ctx.closePath(); ctx.fill();
    if(label){ctx.font=PTC.font(14,'600'); ctx.fillText(label,x+dx+6,y+dy-6);}
    ctx.restore();
  };
  PTC.text=function(ctx,s,x,y,px,color,weight,align){
    ctx.save(); ctx.fillStyle=color||'#1b1f2a'; ctx.font=PTC.font(px||14,weight); ctx.textAlign=align||'left'; ctx.fillText(s,x,y); ctx.restore();
  };
  /* 그래프: o={xmin,xmax,ymin,ymax,log,xticks,yticks,xlabel,ylabel,title,series:[{f|pts,color,label,dash}],marker,points:[[x,y,color]],fill:{f,color,x0,x1},xfmt} */
  PTC.plot=function(c,o){
    var cc=PTC.setupCanvas(c), x=cc.x, w=cc.w, h=cc.h; if(w<20) return;
    var L=o.padL||52, R=14, T=o.title?30:12, B=36, fs=PTC.fs();
    function px(v){return L+(v-o.xmin)/(o.xmax-o.xmin)*(w-L-R)}
    function py(v){var a=o.log?Math.log10(v):v;return h-B-(a-o.ymin)/(o.ymax-o.ymin)*(h-T-B)}
    x.clearRect(0,0,w,h);
    if(o.title){x.fillStyle='#1b1f2a';x.font=PTC.font(13,'600');x.fillText(o.title,L,18);}
    x.font=PTC.font(12); x.strokeStyle='#e6e9f0'; x.fillStyle='#5b6475'; x.lineWidth=1;
    (o.yticks||[]).forEach(function(v){var yy=o.log?h-B-(v-o.ymin)/(o.ymax-o.ymin)*(h-T-B):py(v);x.beginPath();x.moveTo(L,yy);x.lineTo(w-R,yy);x.stroke();x.fillText(o.log?String(Math.pow(10,v)):(o.yfmt?o.yfmt(v):String(v)),4,yy+4);});
    (o.xticks||[]).forEach(function(v){var xx=px(v);x.beginPath();x.moveTo(xx,T);x.lineTo(xx,h-B);x.stroke();var s=o.xfmt?o.xfmt(v):String(v);x.fillText(s,xx-x.measureText(s).width/2,h-B+16);});
    x.strokeStyle='#1b1f2a'; x.beginPath(); x.moveTo(L,T); x.lineTo(L,h-B); x.lineTo(w-R,h-B); x.stroke();
    if(o.xlabel){x.fillStyle='#5b6475';var xs=o.xlabel;x.fillText(xs,w-R-x.measureText(xs).width,h-4);}
    if(o.ylabel){x.save();x.fillStyle='#5b6475';x.translate(12,T+4);x.fillText(o.ylabel,0,0);x.restore();}
    if(o.fill){var F=o.fill;x.fillStyle=F.color;x.beginPath();x.moveTo(px(F.x0),py(o.log?Math.pow(10,o.ymin):Math.max(o.ymin,0)));
      for(var k=0;k<=120;k++){var vv=F.x0+(F.x1-F.x0)*k/120;x.lineTo(px(vv),py(F.f(vv)));}
      x.lineTo(px(F.x1),py(o.log?Math.pow(10,o.ymin):Math.max(o.ymin,0)));x.closePath();x.fill();}
    (o.series||[]).forEach(function(sr,si){
      x.strokeStyle=sr.color; x.lineWidth=sr.lw||2.2; x.setLineDash(sr.dash||[]); x.beginPath(); var started=false;
      var N=sr.pts?sr.pts.length-1:300;
      for(var i=0;i<=N;i++){
        var v,y; if(sr.pts){v=sr.pts[i][0];y=sr.pts[i][1];} else {v=o.xmin+(o.xmax-o.xmin)*i/N;y=sr.f(v);}
        if(!isFinite(y)||(o.log&&y<=0)){started=false;continue;}
        var yy=py(y); if(yy<T-2||yy>h-B+2){started=false;continue;}
        if(!started){x.moveTo(px(v),yy);started=true;}else x.lineTo(px(v),yy);
      }
      x.stroke(); x.setLineDash([]);
      if(sr.label){x.fillStyle=sr.color;x.font=PTC.font(12,'600');x.fillText('— '+sr.label,L+10+si*((w-L)/o.series.length),T+14);}
    });
    if(o.marker!=null && o.marker>=o.xmin && o.marker<=o.xmax){x.strokeStyle='#d23b3b';x.setLineDash([5,4]);x.lineWidth=1.5;x.beginPath();x.moveTo(px(o.marker),T);x.lineTo(px(o.marker),h-B);x.stroke();x.setLineDash([]);}
    (o.points||[]).forEach(function(p){ if(o.log&&p[1]<=0) return; x.fillStyle=p[2]||'#d23b3b'; x.beginPath(); x.arc(px(p[0]),Math.max(T,Math.min(h-B,py(p[1]))),5,0,2*Math.PI); x.fill(); });
    return {px:px,py:py,ctx:x,w:w,h:h};
  };
  /* 시간 진행형 모의실험 제어: o={tMin(),tMax(),draw(t),pauses:[t..],loop} */
  PTC.timeline=function(o){
    var T={t:o.tMin(),playing:false,last:null,speed:$('selSpeed')?+$('selSpeed').value:1,passed:{}};
    function sync(){var s=$('tScrub'); if(s) s.value=Math.round((T.t-o.tMin())/((o.tMax()-o.tMin())||1)*1000);}
    function setP(p){T.playing=p; var b=$('bPlay'); if(b) b.textContent=p?'⏸ 정지':'▶ 재생'; T.last=null; if(p) requestAnimationFrame(tick);}
    function tick(ts){
      if(!T.playing) return;
      if(T.last==null) T.last=ts;
      var dt=Math.min(0.05,(ts-T.last)/1000); T.last=ts;
      var prev=T.t; T.t+=dt*T.speed;
      var ps=o.pauses||[], cp=$('cPause');
      if(!cp||cp.checked){ for(var i=0;i<ps.length;i++){ if(prev<ps[i]&&T.t>=ps[i]&&!T.passed[i]){T.t=ps[i];T.passed[i]=true;setP(false);sync();o.draw(T.t);return;} } }
      if(T.t>=o.tMax()){ if(o.loop){T.t=o.tMin();T.passed={};} else {T.t=o.tMax();setP(false);} }
      sync(); o.draw(T.t);
      if(T.playing) requestAnimationFrame(tick);
    }
    T.toggle=function(){ if(T.playing){setP(false);return;} if(T.t>=o.tMax()-1e-9){T.t=o.tMin();T.passed={};} setP(true); };
    T.reset=function(){ T.t=o.tMin(); T.passed={}; setP(false); sync(); o.draw(T.t); };
    T.set=function(t){ T.t=Math.max(o.tMin(),Math.min(o.tMax(),t)); T.passed={}; (o.pauses||[]).forEach(function(p,i){if(T.t>=p)T.passed[i]=true}); sync(); o.draw(T.t); };
    T.redraw=function(){ T.t=Math.max(o.tMin(),Math.min(o.tMax(),T.t)); sync(); o.draw(T.t); };
    T.pause=function(){setP(false)};
    if($('bPlay')) $('bPlay').onclick=T.toggle;
    if($('bReset')) $('bReset').onclick=T.reset;
    if($('tScrub')) $('tScrub').oninput=function(){ setP(false); T.set(o.tMin()+(o.tMax()-o.tMin())*this.value/1000); };
    if($('selSpeed')) $('selSpeed').onchange=function(){ T.speed=+this.value; };
    window.SIM={toggle:T.toggle,reset:T.reset};
    return T;
  };
  /* 연속 애니메이션 (정적 모의실험의 흐르는 전류 등) */
  PTC.loop=function(fn){ var last=null; function f(ts){ var dt=last==null?0:Math.min(0.05,(ts-last)/1000); last=ts; fn(dt); requestAnimationFrame(f);} requestAnimationFrame(f); };
  PTC.onResize=function(fn){ var st=document.querySelector('#simBox .stage'); if(window.ResizeObserver&&st) new ResizeObserver(function(){fn()}).observe(st); window.addEventListener('resize',fn); };
  PTC.seg=function(id,cb){ var box=$(id); box.querySelectorAll('button').forEach(function(b){ b.onclick=function(){ box.querySelectorAll('button').forEach(function(o){o.classList.toggle('on',o===b)}); cb(b.dataset.v); }; }); };
  PTC.range=function(id,outId,fmt,cb){ var r=$(id),o=$(outId); function u(){ if(o) o.textContent=fmt(+r.value); if(cb) cb(+r.value); } r.addEventListener('input',u); if(o) o.textContent=fmt(+r.value); return r; };
  PTC.readout=function(id,rows){ $(id).innerHTML=rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'}).join(''); };
  PTC.result=function(id,good,text){ var el=$(id); el.className='result '+(good===true?'good':good===false?'bad':''); el.textContent=text; };
  PTC.caption=function(ph,tx){ if($('capPh')) $('capPh').textContent=ph; if($('capTx')) $('capTx').textContent=tx; };
})();

/* SK — 간단 모의실험 키트 (도구/도움.py 의 kit() 와 짝).
   SK.run({mode:'static'|'time', T:function(P){return 초}, scene:function(g,P,t){…}, plot:function(P,t){return PTC.plot 옵션},
           plot2:…, readout:function(P,t){return [[이름,값],…]}, check:function(P){return [true|false|null, 글]}, caption:function(P,t){return 글},
           pre:function(P){…매개변수가 바뀔 때 한 번 계산…}})
   매개변수: 오른쪽 칸의 [data-p] 요소 (range·checkbox·seg) → P.이름
   g = {x:ctx, w, h} · SK.view(g,x0,x1,y0,y1,pad) → {X(x),Y(y),s} (가로세로 같은 축척)
   3D: kit(…, three=True) 와 함께 view3d:{up:'z',cam:[…],target:[…],grid:10}, build:function(V,P){ …물체를 만들고 객체 O 를 돌려줌… },
       frame:function(V,O,P,t){ …위치·화살표·라벨 갱신… } 를 쓰면 #cv 가 three.js 3D 장면이 된다 (마우스 끌기 회전·휠 확대).
       (three.js 를 못 불러오면 scene 이 있으면 2D 로 대신 그린다.) */
(function(){
  'use strict';
  var SK=window.SK={};
  SK.read=function(){ var P={};
    document.querySelectorAll('[data-p]').forEach(function(el){ var k=el.dataset.p;
      if(el.type==='checkbox') P[k]=el.checked; else if(el.classList.contains('seg')){ var b=el.querySelector('button.on'); P[k]=b?(isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v):null; }
      else P[k]=+el.value; });
    return P; };
  SK.view=function(g,x0,x1,y0,y1,pad){ pad=pad==null?24:pad; var s=Math.min((g.w-2*pad)/(x1-x0),(g.h-2*pad)/(y1-y0)),
      ox=(g.w-(x1-x0)*s)/2-x0*s, oy=(g.h+(y1-y0)*s)/2+y0*s; return {s:s,X:function(x){return ox+x*s},Y:function(y){return oy-y*s}}; };
  SK.line=function(c,pts,col,lw,dash){ c.save(); c.strokeStyle=col||'#1b1f2a'; c.lineWidth=lw||2; c.setLineDash(dash||[]); c.beginPath();
    pts.forEach(function(p,i){ if(i) c.lineTo(p[0],p[1]); else c.moveTo(p[0],p[1]); }); c.stroke(); c.restore(); };
  SK.poly=function(c,pts,fill,stroke){ c.save(); c.beginPath(); pts.forEach(function(p,i){ if(i) c.lineTo(p[0],p[1]); else c.moveTo(p[0],p[1]); }); c.closePath();
    if(fill){c.fillStyle=fill;c.fill();} if(stroke){c.strokeStyle=stroke;c.lineWidth=1.5;c.stroke();} c.restore(); };
  SK.circle=function(c,x,y,r,fill,stroke,lw){ c.save(); c.beginPath(); c.arc(x,y,r,0,6.2832); if(fill){c.fillStyle=fill;c.fill();} if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||1.5;c.stroke();} c.restore(); };
  SK.rect=function(c,x,y,w,h,fill,stroke){ c.save(); if(fill){c.fillStyle=fill;c.fillRect(x,y,w,h);} if(stroke){c.strokeStyle=stroke;c.lineWidth=1.5;c.strokeRect(x,y,w,h);} c.restore(); };
  SK.text=function(c,s,x,y,px,col,wt,al){ PTC.text(c,s,x,y,px||13,col||'#1b1f2a',wt||'600',al); };
  SK.arrow=function(c,x,y,dx,dy,col,lab,lw){ PTC.arrow(c,x,y,dx,dy,col,lab,lw); };
  SK.spring=function(c,x1,y1,x2,y2,n,amp,col){ n=n||10; amp=amp||7; var L=Math.hypot(x2-x1,y2-y1)||1, ux=(x2-x1)/L, uy=(y2-y1)/L, nx=-uy, ny=ux, pts=[[x1,y1]], lead=Math.min(8,L/6);
    pts.push([x1+ux*lead,y1+uy*lead]); for(var i=0;i<2*n;i++){ var s=lead+(L-2*lead)*(i+0.5)/(2*n), sg=i%2?-1:1; pts.push([x1+ux*s+nx*amp*sg,y1+uy*s+ny*amp*sg]); }
    pts.push([x2-ux*lead,y2-uy*lead]); pts.push([x2,y2]); SK.line(c,pts,col||'#4a5568',1.6); };
  SK.ground=function(c,x0,x1,y,col){ SK.line(c,[[x0,y],[x1,y]],col||'#1b1f2a',2); c.save(); c.strokeStyle='#9aa2b2'; c.lineWidth=1; for(var x=x0;x<x1;x+=10){ c.beginPath(); c.moveTo(x,y); c.lineTo(x-7,y+8); c.stroke(); } c.restore(); };
  SK.fmt=function(v,d){ if(!isFinite(v)) return '—'; var a=Math.abs(v); if(a!==0&&(a<1e-3||a>=1e5)) return v.toExponential(d==null?3:d); return v.toFixed(d==null?3:d); };
  SK.rk4=function(f,y,t,dt){ var k1=f(t,y), y2=y.map(function(v,i){return v+dt/2*k1[i]}), k2=f(t+dt/2,y2), y3=y.map(function(v,i){return v+dt/2*k2[i]}), k3=f(t+dt/2,y3),
      y4=y.map(function(v,i){return v+dt*k3[i]}), k4=f(t+dt,y4); return y.map(function(v,i){return v+dt/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i])}); };
  SK.run=function(o){
    var P=SK.read(), TL=null;
    function outs(){ document.querySelectorAll('input[type=range][data-p]').forEach(function(el){ var out=document.getElementById('o_'+el.dataset.p); if(!out) return;
      var st=el.step&&el.step!=='any'?el.step:'0.01', d=st.indexOf('.')>=0?st.split('.')[1].length:0; out.textContent=(+el.value).toFixed(d)+(el.dataset.u||''); }); }
    var V3=null, O3=null;
    if(o.build&&window.PTC3&&PTC3.ok()){ V3=PTC3.view('cv',o.view3d||{up:'z',cam:[6,-8,5],target:[0,0,0],grid:10}); if(V3) O3=o.build(V3,P); }
    else if(o.build&&!o.scene){ o.scene=function(g){ SK.text(g.x,'3D 장면을 불러오지 못했습니다 (인터넷 연결 필요: three.js).',16,30,15,'#667'); }; }
    function draw(t){ t=t||0;
      if(V3){ try{ o.frame(V3,O3,P,t); }catch(e){ console.error(e); } V3.render(); }
      else { var c=PTC.setupCanvas(document.getElementById('cv')); if(c.w<20) return; c.x.clearRect(0,0,c.w,c.h);
        try{ o.scene(c,P,t); }catch(e){ console.error(e); } }
      if(o.plot&&document.getElementById('mini')) PTC.plot(document.getElementById('mini'),o.plot(P,t));
      if(o.plot2&&document.getElementById('mini2')) PTC.plot(document.getElementById('mini2'),o.plot2(P,t));
      if(o.readout) PTC.readout('ro',o.readout(P,t));
      if(o.caption){ var cp=o.caption(P,t); if(cp) PTC.caption(cp[0],cp[1]); } }
    function update(){ P=SK.read(); outs(); if(o.pre) o.pre(P); if(V3&&o.rebuild) O3=o.rebuild(V3,O3,P); if(o.check){ var r=o.check(P); PTC.result('res',r[0],r[1]); } if(TL) TL.reset(); else draw(0); }
    document.querySelectorAll('[data-p]').forEach(function(el){
      if(el.classList.contains('seg')) el.querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){ el.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)}); update(); }); });
      else el.addEventListener(el.type==='checkbox'?'change':'input',update); });
    if(o.mode==='time') TL=PTC.timeline({tMin:function(){return 0},tMax:function(){return o.T?o.T(P):10},draw:draw,loop:!!o.loop});
    PTC.onResize(function(){ if(TL) TL.redraw(); else draw(0); });
    SK.P=function(){return P}; SK.V3=function(){return V3}; SK.redraw=function(){ if(TL) TL.redraw(); else draw(0); };
    update();
  };
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* PTC3 — 3D 모의실험 공통 도우미 (three.js r147 + OrbitControls). sim 에 three=True 일 때만 들어간다.
   사용:  var V=PTC3.view('cv',{up:'z', cam:[6,-8,5], target:[0,0,0], grid:10, axes:3});
          var a=V.arrow([0,0,0],[1,0,0],'#d23b3b');  a.set(origin, vec)   // 화살표(길이 = |vec|)
          var b=V.ball(0.2,'#3b6fd6');  b.position.set(x,y,z)               // 공
          var L=V.line([[0,0,0],[1,1,1]],'#888'); L.set(points)            // 선(궤적)
          var t=V.label('m',[0,0,1],'#333'); t.set('m₁',[x,y,z])           // 화면 크기 고정 글자
          V.box([w,d,h],color,opacity) · V.cyl(r,h,color,opacity) · V.plane(w,h,color,opacity)
          V.group() · V.onFrame(function(dt){…})  // 매 프레임 호출(재생과 무관)
          V.render()  // 값을 바꾼 뒤 한 번 그리기 (onFrame 이 있으면 자동)
   좌표: up:'z' 이면 z 가 위(물리 문제 관례), 기본 'y'.  마우스 끌기 = 회전, 휠 = 확대, 오른쪽 끌기 = 이동.
   인터넷이 없어 three.js 를 못 불러오면 캔버스에 안내 글을 쓰고 null 을 돌려준다(2D 부분은 그대로 동작). */
(function(){
  'use strict';
  var PTC3=window.PTC3={};
  function col(c){ return new THREE.Color(c||'#555'); }
  function v3(a){ return new THREE.Vector3(a[0]||0,a[1]||0,a[2]||0); }
  PTC3.ok=function(){ return !!(window.THREE&&THREE.OrbitControls); };
  PTC3.view=function(id,o){
    o=o||{}; var cv=typeof id==='string'?document.getElementById(id):id;
    if(!PTC3.ok()){
      try{ var x=cv.getContext('2d'), r=cv.getBoundingClientRect(); cv.width=r.width; cv.height=r.height;
        x.fillStyle='#667'; x.font='15px "Noto Sans KR",sans-serif'; x.fillText('3D 장면을 불러오지 못했습니다 (인터넷 연결 필요: three.js).',16,30);}catch(e){}
      return null;
    }
    var renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:false,preserveDrawingBuffer:true});
    renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
    var scene=new THREE.Scene(); scene.background=col(o.bg||'#f7f8fb');
    if(o.up==='z') THREE.Object3D.DefaultUp.set(0,0,1);
    var cam=new THREE.PerspectiveCamera(o.fov||40,1,0.01,(o.far||1000));
    if(o.up==='z') cam.up.set(0,0,1);
    cam.position.copy(v3(o.cam||[6,5,8]));
    var ctl=new THREE.OrbitControls(cam,cv); ctl.target.copy(v3(o.target||[0,0,0])); var off0=cam.position.clone().sub(ctl.target), touched=false, lastAuto=null; ctl.addEventListener('start',function(){touched=true;}); ctl.enableDamping=true; ctl.dampingFactor=0.12; ctl.update();
    scene.add(new THREE.HemisphereLight(0xffffff,0x8890a0,0.85));
    var dl=new THREE.DirectionalLight(0xffffff,0.55); dl.position.set(5,8,10); scene.add(dl);
    var V={THREE:THREE,scene:scene,camera:cam,renderer:renderer,controls:ctl,canvas:cv}, frames=[], dirty=true, last=null;
    /* (수정) 격자·좌표축은 한 번만 만든다 — 원래 resize() 안에 있어 창 크기가 바뀔 때마다 중복으로 쌓였음 */
    function addHelpers(){
    if(o.grid){ var g=new THREE.GridHelper(o.grid,o.gridDiv||o.grid,0xc5cad6,0xe1e4ec); if(o.up==='z') g.rotation.x=Math.PI/2; if(o.gridAt) g.position.copy(v3(o.gridAt)); scene.add(g); V.gridObj=g; }
    if(o.axes){ var A=o.axes; [[1,0,0,'#d23b3b','x'],[0,1,0,'#2e9e5b','y'],[0,0,1,'#3b6fd6','z']].forEach(function(a){
      scene.add(new THREE.ArrowHelper(new THREE.Vector3(a[0],a[1],a[2]),new THREE.Vector3(),A,col(a[3]).getHex(),A*0.08,A*0.04));
      if(o.axisLabels!==false) V.label(a[4],[a[0]*A*1.08,a[1]*A*1.08,a[2]*A*1.08],a[3]); }); }
    }
    function resize(){
      var st=cv.parentElement, w=Math.max(1,st.clientWidth), h=Math.max(1,st.clientHeight);
      renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
      /* 좁은(세로로 긴) 화면에서는 장면이 잘리지 않도록 카메라를 뒤로 뺀다(사용자가 돌리기 전까지만) */
      if(lastAuto&&cam.position.distanceTo(lastAuto)>1e-6) touched=true;  /* 모의실험이 카메라를 직접 옮겼으면 손대지 않음 */
      if(!touched){ var k=Math.max(1,(o.fitAspect||1.5)/cam.aspect); cam.position.copy(ctl.target).add(off0.clone().multiplyScalar(k)); lastAuto=cam.position.clone(); }
      dirty=true;
    }
    V.resize=resize; V.render=function(){ dirty=true; };
    V.onFrame=function(f){ frames.push(f); };
    ctl.addEventListener('change',function(){dirty=true;});
    function loop(ts){
      var dt=last==null?0:Math.min(0.05,(ts-last)/1000); last=ts;
      for(var i=0;i<frames.length;i++){ frames[i](dt); dirty=true; }
      if(ctl.update()) dirty=true;
      if(dirty){ renderer.render(scene,cam); dirty=false; }
      requestAnimationFrame(loop);
    }
    function mat(c,op,extra){ var m=new THREE.MeshStandardMaterial(Object.assign({color:col(c),roughness:0.55,metalness:0.05},extra||{})); if(op!=null&&op<1){m.transparent=true;m.opacity=op;m.depthWrite=false;} return m; }
    V.mat=mat;
    V.add=function(obj,parent){ (parent||scene).add(obj); dirty=true; return obj; };
    V.group=function(parent){ return V.add(new THREE.Group(),parent); };
    V.ball=function(r,c,op,parent){ return V.add(new THREE.Mesh(new THREE.SphereGeometry(r,32,20),mat(c,op)),parent); };
    V.box=function(s,c,op,parent){ return V.add(new THREE.Mesh(new THREE.BoxGeometry(s[0],s[1],s[2]),mat(c,op)),parent); };
    /* 원기둥: 기본 축은 up 축(z 또는 y) */
    V.cyl=function(r,h,c,op,parent,r2){ var g=new THREE.CylinderGeometry(r2==null?r:r2,r,h,40,1); if(o.up==='z') g.rotateX(Math.PI/2); return V.add(new THREE.Mesh(g,mat(c,op,{side:THREE.DoubleSide})),parent); };
    V.plane=function(w,h,c,op,parent){ var g=new THREE.PlaneGeometry(w,h); return V.add(new THREE.Mesh(g,mat(c,op==null?0.35:op,{side:THREE.DoubleSide})),parent); };
    V.torus=function(R,r,c,op,parent){ return V.add(new THREE.Mesh(new THREE.TorusGeometry(R,r,16,80),mat(c,op)),parent); };
    V.line=function(pts,c,parent,opt){
      opt=opt||{}; var n=Math.max(2,opt.max||pts.length||2), geo=new THREE.BufferGeometry(), arr=new Float32Array(n*3);
      geo.setAttribute('position',new THREE.BufferAttribute(arr,3));
      var m=opt.dash?new THREE.LineDashedMaterial({color:col(c),dashSize:opt.dash,gapSize:opt.dash*0.7}):new THREE.LineBasicMaterial({color:col(c),transparent:opt.opacity!=null,opacity:opt.opacity==null?1:opt.opacity});
      var L=new THREE.Line(geo,m);
      L.set=function(p){ var k=Math.min(n,p.length); for(var i=0;i<k;i++){arr[3*i]=p[i][0];arr[3*i+1]=p[i][1];arr[3*i+2]=p[i][2]||0;} geo.setDrawRange(0,k); geo.attributes.position.needsUpdate=true; geo.computeBoundingSphere(); if(opt.dash) L.computeLineDistances(); dirty=true; return L; };
      L.set(pts||[]); return V.add(L,parent);
    };
    V.arrow=function(from,vec,c,parent,opt){
      opt=opt||{}; var a=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(),1,col(c).getHex());
      a.line.material.linewidth=2;
      a.set=function(f,v){ var d=v3(v), L=d.length(); a.visible=L>1e-9; if(!a.visible) return a; a.position.copy(v3(f)); a.setDirection(d.clone().normalize());
        var h=opt.head||Math.min(0.35*L,opt.headMax||0.35); a.setLength(L,h,h*0.55); dirty=true; return a; };
      a.set(from,vec); return V.add(a,parent);
    };
    V.label=function(text,pos,c,parent,px){
      var cnv=document.createElement('canvas'), ctx=cnv.getContext('2d'), tex=new THREE.CanvasTexture(cnv);
      var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true,sizeAttenuation:false}));
      sp.renderOrder=10;
      sp.set=function(t,p,cc){
        if(t!=null&&(t!==sp._t||(cc&&cc!==sp._c))){ sp._t=t; sp._c=cc; var f=(px||15)*2, FONT='600 '+f+'px "Noto Sans KR","Malgun Gothic",sans-serif';
          ctx.font=FONT; var w=Math.ceil(ctx.measureText(t).width)+12;
          cnv=document.createElement('canvas'); ctx=cnv.getContext('2d',{willReadFrequently:true});   /* 매번 새 캔버스(CPU) — GPU 업로드 중인 캔버스를 다시 쓰다 글자가 깨지는 일 방지 */
          cnv.width=w; cnv.height=f+12;
          ctx.font=FONT; ctx.textBaseline='middle'; ctx.lineJoin='round'; ctx.lineWidth=Math.max(3,f*0.2); ctx.strokeStyle='rgba(255,255,255,0.92)'; ctx.strokeText(t,6,cnv.height/2);   /* 흰 테두리: 뒤의 선·화살표가 글자와 겹쳐 보이지 않게 */
          ctx.fillStyle=cc||c||'#1b1f2a'; ctx.fillText(t,6,cnv.height/2);
          tex.dispose(); tex=new THREE.CanvasTexture(cnv); tex.minFilter=THREE.LinearFilter; tex.generateMipmaps=false;   /* 밉맵 번짐 방지 */
          sp.material.map=tex; sp.material.needsUpdate=true;
          var sy=0.045*(px||15)/15; sp.scale.set(sy*w/cnv.height,sy,1); sp.center.set(0,0.5); }
        if(p) sp.position.copy(v3(p)); dirty=true; return sp; };
      sp.set(text,pos); return V.add(sp,parent);
    };
    V.trail=function(c,max,parent){ var pts=[], L=V.line([],c,parent,{max:max||2000}); L.push=function(p){ pts.push(p); if(pts.length>(max||2000)) pts.shift(); L.set(pts); return L; }; L.clear=function(){ pts=[]; L.set(pts); return L; }; return L; };
    addHelpers();
    var st=cv.parentElement; if(window.ResizeObserver) new ResizeObserver(resize).observe(st); window.addEventListener('resize',resize);
    resize(); requestAnimationFrame(loop);
    return V;
  };
})();

</script>
<script>
SK.run({mode:'static',loop:false,
  view3d:{up:'z',cam:[1,-2.6,2.2],target:[1,0.5,0.1],grid:0},
  build:function(V,P){ var O={}; V.line([[0,0,0],[2,0,0],[2,1,0],[0,1,0],[0,0,0]],'#1b1f2a'); O.pts=[]; var i,j; for(i=0;i<=40;i++){ for(j=0;j<=20;j++){ O.pts.push(V.ball(0.018,'#3b6fd6')); } }
    O.l=V.label('',[-0.2,0,1.1],'#1b1f2a',null,12); return O; },
  frame:function(V,O,P){ var i,j,k=0; for(i=0;i<=40;i++){ for(j=0;j<=20;j++){ var x=2*i/40, y=j/20, ps=Math.sin(P.nx*Math.PI*x/2)*Math.sin(P.ny*Math.PI*y); O.pts[k].position.set(x,y,0.6*ps); O.pts[k].material.color.set(ps>=0?'#d23b3b':'#2f6fd6'); k++; } }
    O.l.set('E ∝ n_x²/4 + n_y² = '+P.e+(P.deg.length?'  (축퇴: '+P.deg.join(', ')+')':'  (축퇴 없음)'),null); },
  pre:function(P){ P.e=P.nx*P.nx/4+P.ny*P.ny; P.deg=[]; var a,b; for(a=1;a<=12;a++) for(b=1;b<=6;b++){ if((a!==P.nx||b!==P.ny)&&Math.abs(a*a/4+b*b-P.e)<1e-12) P.deg.push('('+a+','+b+')'); } },
  readout:function(P){ function dg(a,b){ var e=a*a/4+b*b, c=0, i,j; for(i=1;i<=12;i++) for(j=1;j<=6;j++) if(Math.abs(i*i/4+j*j-e)<1e-12) c++; return c>1; }
    return [['선지 ① (1,1)',dg(1,1)?'축퇴':'비축퇴'],['선지 ② (2,1)',dg(2,1)?'축퇴':'비축퇴'],['선지 ③ (3,1)',dg(3,1)?'축퇴':'비축퇴'],['선지 ④ (4,1)',dg(4,1)?'축퇴 = (2,2)':'비축퇴'],['선지 ⑤ (5,1)',dg(5,1)?'축퇴':'비축퇴']]; },
  check:function(P){ function dg(a,b){ var e=a*a/4+b*b, c=0, i,j; for(i=1;i<=12;i++) for(j=1;j<=6;j++) if(Math.abs(i*i/4+j*j-e)<1e-12) c++; return c>1; }
    var r=[dg(1,1),dg(2,1),dg(3,1),dg(4,1),dg(5,1)]; var ok=!r[0]&&!r[1]&&!r[2]&&r[3]&&!r[4]; return [ok, ok?'다섯 선지 중 (n_x, n_y) = (4,1)만 (2,2)와 같은 에너지 — 정답표 ④와 일치 ✓':'확인 필요']; }
});
</script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  // 모의실험: 전체화면 + 키보드
  var box=$('simBox'); if(!box) return;
  function toggleFull(){
    var fe=document.fullscreenElement||document.webkitFullscreenElement;
    if(fe){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
    else{(box.requestFullscreen||box.webkitRequestFullscreen).call(box);}
  }
  if($('bFull')) $('bFull').onclick=toggleFull;
  function onFs(){var fe=document.fullscreenElement||document.webkitFullscreenElement; if($('bFull')) $('bFull').textContent=fe?'✕ 전체화면 종료':'⛶ 전체화면'; setTimeout(function(){window.dispatchEvent(new Event('resize'));},60);}
  document.addEventListener('fullscreenchange',onFs); document.addEventListener('webkitfullscreenchange',onFs);
  box.querySelectorAll('button').forEach(function(b){b.addEventListener('mousedown',function(e){e.preventDefault();});});
  document.addEventListener('keydown',function(ev){
    var tag=(ev.target.tagName||'').toLowerCase(); if((tag==='input'&&ev.target.type!=='range')||tag==='select'||tag==='textarea') return;
    var inSim=box.contains(document.activeElement)||document.fullscreenElement===box||document.activeElement===document.body;
    if(!inSim) return;
    if(ev.code==='Space' && window.SIM){ev.preventDefault();window.SIM.toggle();}
    else if((ev.key==='r'||ev.key==='R') && window.SIM){window.SIM.reset();}
    else if(ev.key==='f'||ev.key==='F'){toggleFull();}
  });
})();

</script>
